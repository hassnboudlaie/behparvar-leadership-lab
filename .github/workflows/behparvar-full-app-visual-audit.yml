name: Behparvar — Full App Visual Audit (Non-Production)

on:
  pull_request:
    paths:
      - 'scripts/audit-full-app-visual-20261115.cjs'
      - '.github/workflows/behparvar-full-app-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Read-only Browser Audit — 8 surfaces × 2 devices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install chromium test engine
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run visual evidence capture on checked-out files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/behparvar-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          BEHPARVAR_URL='http://127.0.0.1:4173/' node scripts/audit-full-app-visual-20261115.cjs
      - name: Save screenshots and audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behparvar-full-app-visual-evidence
          path: artifacts/behparvar-full-audit/
          if-no-files-found: warn

      - name: Publish real app JPGs into the isolated marketing branch
        if: github.event_name == 'pull_request' && github.head_ref == 'marketing/real-app-album-20261118'
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/behparvar-full-audit/original-app-jpg/01-original-app.jpg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "${GITHUB_HEAD_REF}"
          git checkout "${GITHUB_HEAD_REF}"
          mkdir -p marketing/real-app-carousel-jpg
          cp artifacts/behparvar-full-audit/original-app-jpg/*.jpg marketing/real-app-carousel-jpg/
          cp artifacts/behparvar-full-audit/original-app-jpg/source-manifest.json marketing/real-app-carousel-jpg/
          git add marketing/real-app-carousel-jpg/
          git commit -m 'Marketing: publish ten original Behparvar app JPG screenshots' || exit 0
          git push origin "${GITHUB_HEAD_REF}"
