name: Behparvar — Full App Visual Audit (Non-Production)

on:
  pull_request:
    paths:
      - 'scripts/audit-full-app-visual-20261115.cjs'
      - '.github/workflows/behparvar-full-app-visual-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Read-only Browser Audit — 8 surfaces × 2 devices
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install chromium test engine
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run visual evidence capture on checked-out files
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/behparvar-audit-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          BEHPARVAR_URL='http://127.0.0.1:4173/' node scripts/audit-full-app-visual-20261115.cjs
      - name: Save screenshots and audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behparvar-full-app-visual-evidence
          path: artifacts/behparvar-full-audit/
          if-no-files-found: warn
