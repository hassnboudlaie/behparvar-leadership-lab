name: Install Behparvar management workshop photo
on:
  push:
    paths:
      - '.github/workflows/mml-import-approved-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-photo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download full-resolution realistic management meeting photo
        run: |
          curl --fail --location --retry 2 --connect-timeout 10 --max-time 35 -sS \
            'https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1200&q=85' \
            -o /tmp/meeting.jpg
          file /tmp/meeting.jpg
      - name: Optimize a stable first-party WebP asset
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          im=Image.open('/tmp/meeting.jpg').convert('RGB')
          print('Downloaded image size',im.size)
          assert im.width>=700 and im.height>=450, 'Photo below production-quality threshold'
          target=Path('assets/mml-welcome/hero-meeting.webp')
          target.parent.mkdir(parents=True,exist_ok=True)
          im=ImageOps.exif_transpose(im)
          im.save(target, 'WEBP', quality=85, method=6)
          print('Saved stable photo', target, target.stat().st_size)
          PY
      - name: Commit photo to the site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mml-welcome/hero-meeting.webp
          if ! git diff --cached --quiet; then
            git commit -m 'assets: bundle realistic management workshop hero as local WebP'
            git pull --rebase origin main
            git push origin main
          fi
