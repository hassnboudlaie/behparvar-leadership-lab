name: Import approved Behparvar welcome artwork
on:
  push:
    paths:
      - '.github/workflows/mml-import-approved-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download owner-approved artwork
        env:
          IMAGE_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1672/quality:100/uri:ifs%3A%2F%2FM%2F832b23ae-1a2b-4077-93f8-4a066f8381db/watermark:F/width:941?csig=AAAAAAAAAAAAAAAAAAAAALFpt-POK2Jy5jObsUInbf7L1Xr2lRiklPcVOODgrsjE&exp=1793559862&osig=AAAAAAAAAAAAAAAAAAAAAJ0_ZoyjjGVm25F_6jmHlx5EF9MdC6PhENo1nhj9ffuW&signer=media-rpc&token=AAIAAU0AJDgzMmIyM2FlLTFhMmItNDA3Ny05M2Y4LTRhMDY2ZjgzODFkYgAAAAABoZh_mvB6qbP-awZtthGp2Q_FuS-Nj_j3ANvuEEaY_cfQ1uCtvg&x-canva-quality=default'
        run: |
          curl --fail --location --retry 2 -sS "$IMAGE_URL" -o /tmp/approved.png
          file /tmp/approved.png
      - name: Extract hero and lively icons
        run: |
          python -m pip install -q Pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          from pathlib import Path
          im=Image.open('/tmp/approved.png').convert('RGB')
          print('Source image',im.size)
          if im.width<800 or im.height<1500:
              raise ValueError('Source unavailable at approved original resolution; do not publish a blurry asset.')
          out=Path('assets/mml-welcome');out.mkdir(parents=True,exist_ok=True)
          assets={
            'hero-meeting.webp':(14,273,915,770),
            'icon-competency.webp':(661,1016,862,1199),
            'icon-sessions.webp':(357,1018,568,1196),
            'icon-scenarios.webp':(60,1017,274,1197),
            'icon-growth.webp':(564,1355,835,1519),
            'icon-guide.webp':(94,1353,383,1532),
          }
          for name,rect in assets.items():
              item=im.crop(rect)
              if name=='hero-meeting.webp':
                  item.thumbnail((1200,720),Image.Resampling.LANCZOS)
              else:
                  item.thumbnail((360,270),Image.Resampling.LANCZOS)
              item.save(out/name,format='WEBP',quality=85,method=6)
              print(name,(out/name).stat().st_size,item.size)
          PY
      - name: Commit image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mml-welcome/
          if ! git diff --cached --quiet; then
            git commit -m "assets: install approved management welcome photo and five lively icons"
            git push
          fi
