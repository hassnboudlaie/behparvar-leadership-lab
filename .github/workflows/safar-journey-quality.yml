name: Safar Ertebatat Quality Gate
on:
  push:
    paths:
      - 'session4-communication-journey.html'
      - 'session5-communication-journey.html'
      - 'assets/safar-*.js'
      - 'assets/safar-*.css'
      - 'tests/safar-*.cjs'
      - '.github/workflows/safar-journey-quality.yml'
  pull_request:
    paths:
      - 'session4-communication-journey.html'
      - 'session5-communication-journey.html'
      - 'assets/safar-*.js'
      - 'assets/safar-*.css'
      - 'tests/safar-*.cjs'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Safar Ertebatat learning journey
        run: node tests/safar-journey-quality.cjs
      - name: Verify individual-only scoring and context-aware coach
        run: |
          node tests/safar-state-contract.cjs
          node tests/safar-solo-quality.cjs
          node tests/safar-rubric-v2.cjs
          node tests/safar-content-v4-audit.cjs
  browser-solo:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve same-origin PWA locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/safar-peer-browser.log 2>&1 &
          sleep 2
          curl -fsSI http://127.0.0.1:8765/
      - name: Test solo journey, active coaching and useful contextual guide
        run: |
          node tests/safar-solo-browser.cjs
          node tests/safar-full-journey-browser.cjs
