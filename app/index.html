<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132c68"><title>My Management Lab | انتقال به اپ یکپارچه</title><link rel="canonical" href="../"><link rel="manifest" href="../manifest.webmanifest">
<style>body{margin:0;background:#f6f7fb;color:#183150;font:16px/2 Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}main{background:white;border:1px solid #d9e6ed;border-radius:20px;padding:28px;max-width:560px;text-align:center}a{color:#137c79;font-weight:bold}</style></head><body><main><h1>My Management Lab</h1><p>وب‌سایت و اپلیکیشن به‌پرور اکنون یک محصول واحد هستند. به نشانی اصلی هدایت می‌شوید.</p><p><a id="openLab" href="../">ورود به My Management Lab</a></p><p>اگر قبلاً نسخه مستقل را نصب کرده‌اید، برای استفاده از تجربه یکپارچه می‌توانید نسخه جدید را از صفحه اصلی نصب کنید.</p></main>
<script>
(function(){
var hash=location.hash.replace(/^#\/?/,""),parts=hash.split("/");
var old={};try{old=JSON.parse(localStorage.getItem("behparvar_app_v1")||"{}")||{}}catch(e){}
var role=old.role==="supervisors"?"supervisors":"managers";
var url=new URL("../",location.href);
url.searchParams.set("audience",role);
var allowed=["m1","m2","leaders","techniques","visuals","diseases","quiz"];
if(parts[0]==="read"&&Number(parts[1])>=1&&Number(parts[1])<=6&&allowed.includes(parts[2])){
 var n=Number(parts[1]);url.hash=n===1?parts[2]:"session"+n+"-"+parts[2];
}else if(parts[0]==="passport"){url.searchParams.set("passport","1");url.hash="course"}
else if(parts[0]==="coaches"){url.searchParams.set("coach","1");url.hash="course"}
else{url.hash=""}
document.getElementById("openLab").href=url.href;
location.replace(url.href);
})();
</script></body></html>
