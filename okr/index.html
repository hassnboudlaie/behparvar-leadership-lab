-value:hover{background:#eaf5fb}</style></head><body><div class="shell"><nav class="rail" id="rail"></nav><aside class="side" id="side"></aside><main class="main"><header class="top"><b>به‌پرور | اجرای استراتژی</b><div class="row"><input id="search" placeholder="جستجوی اهداف…" aria-label="جستجو"><button id="export" title="خروجی داده">خروجی</button></div></header><div class="content" id="app"></div></main></div><div id="overlay"></div>

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:1}),date=()=>new Date().toISOString().slice(0,10);
const seed={identity:{ultimate:'خلق ارزش پایدار برای مشتریان، کارکنان و کسب‌وکار',mission:'ارائه محصولات و خدمات قابل اعتماد با کیفیت پایدار',vision:'تبدیل شدن به مجموعه‌ای پیشرو در کیفیت، بهره‌وری و رضایت مشتری',values:'کیفیت، مسئولیت‌پذیری، همکاری، یادگیری'},teams:['مدیریت ارشد','تولید','کنترل کیفیت','فروش و بازاریابی','منابع انسانی','مالی','تدارکات و پشتیبانی'],period:'فصل جاری',pillars:[{id:'p1',name:'رشد پایدار و مشتری‌مداری'},{id:'p2',name:'تعالی عملیاتی و کیفیت'},{id:'p3',name:'توسعه سرمایه انسانی'}],goals:[{id:'o1',kind:'Objective',name:'بهبود تجربه مشتری',pillar:'p1',parent:'',team:'فروش و بازاریابی',owner:'مدیر فروش',status:'فعال',description:'کاهش نارضایتی و تقویت وفاداری مشتری',history:[]},{id:'k1',kind:'KR',name:'افزایش رضایت مشتری از ۷۵ به ۹۰ درصد',pillar:'p1',parent:'o1',team:'فروش و بازاریابی',owner:'مدیر فروش',start:75,target:90,current:82,unit:'درصد',status:'فعال',history:[]},{id:'k2',kind:'KPI',name:'نرخ شکایت مشتری',pillar:'p1',parent:'',team:'کنترل کیفیت',owner:'مدیر کیفیت',start:4,target:2,current:3,unit:'درصد',status:'فعال',history:[]},{id:'o2',kind:'Objective',name:'ارتقای بهره‌وری و کیفیت تولید',pillar:'p2',parent:'',team:'تولید',owner:'مدیر تولید',status:'فعال',history:[]},{id:'k3',kind:'KR',name:'کاهش ضایعات تولید از ۵ به ۳ درصد',pillar:'p2',parent:'o2',team:'تولید',owner:'مدیر تولید',start:5,target:3,current:4.1,unit:'درصد',status:'فعال',history:[]},{id:'k4',kind:'KPI',name:'تحویل به‌موقع سفارش',pillar:'p2',parent:'',team:'تدارکات و پشتیبانی',owner:'مسئول برنامه‌ریزی',start:80,target:95,current:87,unit:'درصد',status:'فعال',history:[]},{id:'o3',kind:'Objective',name:'تقویت قابلیت‌های سرپرستان',pillar:'p3',parent:'',team:'منابع انسانی',owner:'مدیر منابع انسانی',status:'فعال',history:[]},{id:'k5',kind:'KR',name:'افزایش تکمیل برنامه توسعه سرپرستان',pillar:'p3',parent:'o3',team:'منابع انسانی',owner:'مدیر منابع انسانی',start:0,target:100,current:60,unit:'درصد',status:'فعال',history:[]}],tasks:[{id:'t1',name:'تحلیل علل ضایعات تولید',goal:'k3',owner:'مدیر تولید',due:'',done:false},{id:'t2',name:'جمع‌آوری بازخورد مشتریان',goal:'k1',owner:'مدیر فروش',due:'',done:false}],meetings:[],reviews:[],peopleReviews:[]};
let data;try{data=JSON.parse(localStorage.getItem('behparvar-strategy-v1'))||structuredClone(seed)}catch{data=structuredClone(seed)}let page='home',sub='',team='',query='',statusFilter='all',openId='';
let save=()=>{try{localStorage.setItem('behparvar-strategy-v1',JSON.stringify(data))}catch{alert('ذخیره محلی ممکن نیست؛ از خروجی پشتیبان استفاده کنید.')}};
const types={Objective:'هدف',KR:'نتیجه کلیدی',KPI:'شاخص عملکرد',Initiative:'ابتکار راهبردی'},navs=[['home','⌂','خانه'],['strategy','◇','استراتژی'],['goals','◎','اهداف'],['tasks','☑','اقدامات'],['teams','♧','تیم‌ها'],['meetings','▤','جلسات'],['reviews','▥','بازبینی کسب‌وکار'],['people','☆','ارزیابی عملکرد'],['dash','◫','داشبورد'],['settings','⚙','تنظیمات']],subnav={home:[['','مرکز اقدامات']],strategy:[['map','نقشه استراتژی'],['identity','هویت راهبردی']],goals:[['all','اهداف فعال'],['risk','اهداف نیازمند توجه'],['kpi','تابلوی KPI'],['map','نمای درختی'],['closed','اهداف بسته‌شده']],tasks:[['','اقدامات و پروژه‌ها']],teams:[['','همه تیم‌ها']],meetings:[['','جلسات و پیگیری']],reviews:[['','بازبینی دوره‌ای']],people:[['','چرخه ارزیابی']],dash:[['','عملکرد سازمان']],settings:[['','تنظیمات و داده‌ها']]};
function isOpenGoal(g){return !['بسته','بایگانی'].includes(g.status)}
function drivenByChildren(g){
  return g.kind==='Objective' && g.measurement!=='manual-objective';
}
function progress(g){
  if(drivenByChildren(g)){
    const scores=data.goals.filter(child=>child.parent===g.id && child.kind==='KR').map(progress).filter(Number.isFinite);
    return scores.length?scores.reduce((sum,value)=>sum+value,0)/scores.length:null;
  }
  const [start,target,current]=[g.start,g.target,g.current].map(value=>value==null||value===''?NaN:Number(value));
  return [start,target,current].every(Number.isFinite)&&start!==target?Math.max(0,Math.min(100,100*(current-start)/(target-start))):null;
}
function bar(p){return p===null?'<small>بدون نتیجه کلیدی</small>':'<div class="row"><div class="bar" style="width:70px"><i style="width:'+p+'%"></i></div><small>'+fa(p)+'٪</small></div>'}
function health(g){let p=progress(g);return g.status==='بسته'?'بسته‌شده':p===null?'تعریف نشده':p>=70?'پیشرفت بالا':p>=40?'نیازمند پیگیری':'پیشرفت پایین'}
function goto(p,s){page=p;sub=s??subnav[p][0][0];team='';query='';$('#search').value='';render();window.scrollTo(0,0)}
function render(){ $('#rail').innerHTML='<div class="mark">ب</div>'+navs.map(n=>'<button data-page="'+n[0]+'" class="'+(page===n[0]?'active':'')+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'<a href="../"><span>↩</span>اپ آموزش</a>';$('#side').innerHTML='<h2>'+navs.find(n=>n[0]===page)[2]+'</h2><small>نماهای اصلی</small>'+subnav[page].map(n=>'<button data-sub="'+n[0]+'" class="'+(sub===n[0]?'active':'')+'">'+n[1]+'</button>').join('')+'<small>دوره جاری</small><div style="padding:0 12px">'+esc(data.period)+'</div><small>محیط آموزشی مستقل</small>';let views={home, strategy,goals,tasks,teams,meetings:()=>records('meetings'),reviews:()=>records('reviews'),people:()=>records('peopleReviews'),dash,settings};$('#app').innerHTML='<div class="notice">نسخه آموزشی — داده‌های اولیه صرفاً نمونه هستند و اطلاعات رسمی به‌پرور محسوب نمی‌شوند. ذخیره‌سازی در همین مرورگر انجام می‌شود.</div>'+views[page](); }
const heading=(title,desc,button='')=>'<div class="head row between"><div><h1>'+title+'</h1><small>'+desc+'</small></div>'+button+'</div>',panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>',btn=(act,label,cls='primary')=>'<button class="'+cls+'" data-act="'+act+'">'+label+'</button>';
function match(g){return (!query||[g.name,g.owner,g.team,types[g.kind]].join(' ').includes(query))&&(!team||g.team===team)}
function table(list){return '<div class="tablewrap"><table><thead><tr><th>عنوان</th><th>تیم</th><th>مسئول</th><th>پیشرفت</th><th>مقدار فعلی</th><th>هدف</th><th>وضعیت</th></tr></thead><tbody>'+list.map(g=>'<tr data-id="'+esc(g.id)+'"><td class="tname">'+(g.kind==='KR'?'↳ ':'')+'<span class="tag">'+types[g.kind]+'</span> '+esc(g.name)+'</td><td>'+esc(g.team)+'</td><td>'+esc(g.owner)+'</td><td>'+bar(progress(g))+'</td><td>'+ (g.kind==='Objective'?'—':fa(g.current)+' '+esc(g.unit))+'</td><td>'+(g.kind==='Objective'?'—':fa(g.target)+' '+esc(g.unit))+'</td><td>'+health(g)+'</td></tr>').join('')+'</tbody></table>'+(list.length?'':'<div class="empty">موردی یافت نشد.</div>')+'</div>'}
function summary(){let a=data.goals.filter(g=>g.kind==='KR'&&isOpenGoal(g)),p=a.length?a.reduce((s,g)=>s+(progress(g)||0),0)/a.length:0;return '<div class="metrics">'+[['اهداف',data.goals.filter(g=>g.kind==='Objective').length],['نتایج کلیدی',a.length],['شاخص‌های عملکرد',data.goals.filter(g=>g.kind==='KPI').length],['پیشرفت نتایج کلیدی',fa(p)+'٪']].map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+esc(v)+'</strong></div>').join('')+'</div>'}
function home(){return heading('خانه','مرکز اقدامات و مسئولیت‌ها',btn('add-goal','＋ هدف جدید'))+summary()+panel('مرکز اقدامات','<div class="action"><div><b>به‌روزرسانی پیشرفت اهداف</b><br><small>آخرین وضعیت نتایج کلیدی را ثبت کنید.</small></div>'+btn('go-goals','مشاهده اهداف')+'</div><div class="action"><div><b>بازبینی دوره‌ای کسب‌وکار</b><br><small>آموخته‌ها، موانع و تصمیم‌های بعدی</small></div>'+btn('go-reviews','بازبینی')+'</div><div class="action"><div><b>اقدامات باز</b><br><small>'+fa(data.tasks.filter(t=>!t.done).length)+' اقدام تکمیل نشده</small></div>'+btn('go-tasks','پیگیری')+'</div>')+panel('مسئولیت‌ها و اهداف',table(data.goals.filter(g=>isOpenGoal(g)&&match(g))))}
function node(g){return '<div class="node" data-kind="'+g.kind+'" data-id="'+esc(g.id)+'" tabindex="0"><small>'+types[g.kind]+'</small><b>'+esc(g.name)+'</b>'+bar(progress(g))+'<small>'+esc(g.team)+'</small></div>'}
function map(){return '<div class="panel map"><div class="mapinner"><div class="rootnode"><div class="node" data-act="identity"><small>هدف غایی سازمان</small><b>'+esc(data.identity.ultimate)+'</b><small>مأموریت، چشم‌انداز و ارزش‌ها</small></div></div><div class="trunk"></div><div class="branches">'+data.pillars.map(p=>'<div class="branch"><div class="node" data-act="pillar:'+esc(p.id)+'"><small>رکن راهبردی</small><b>'+esc(p.name)+'</b></div><div class="children">'+data.goals.filter(g=>g.pillar===p.id&&!g.parent&&isOpenGoal(g)&&match(g)).map(g=>node(g)+(g.kind==='Objective'?'<div class="children">'+data.goals.filter(k=>k.parent===g.id&&k.status!=='بسته').map(node).join('')+'</div>':'')).join('')+'</div></div>').join('')+'</div></div></div>'}
function strategy(){if(sub==='identity')return heading('هویت راهبردی','از هدف غایی تا ارزش‌های سازمان')+panel('هویت سازمان', '<form id="identityForm">'+Object.entries({ultimate:'هدف غایی',mission:'مأموریت',vision:'چشم‌انداز',values:'ارزش‌ها'}).map(([k,v])=>'<label for="i-'+k+'">'+v+'</label><textarea id="i-'+k+'" name="'+k+'" required>'+esc(data.identity[k])+'</textarea>').join('')+'<button class="primary" style="margin-top:12px">ذخیره هویت راهبردی</button></form>')+panel('ارکان راهبردی',data.pillars.map(p=>'<div class="action"><b>'+esc(p.name)+'</b>'+btn('pillar:'+p.id,'ویرایش','secondary')+'</div>').join('')+btn('add-pillar','＋ رکن جدید'));return heading('نقشه استراتژی','ارتباط هدف غایی، ارکان، OKR و KPI',btn('add-pillar','＋ رکن راهبردی')+' '+btn('add-goal','＋ هدف'))+ '<div class="row filters">'+btn('identity','هویت راهبردی','secondary')+btn('print','چاپ نقشه','secondary')+'</div>'+map()}
function goals(){let list=data.goals.filter(g=>match(g)&&(sub==='archived'?g.status==='بایگانی':sub==='closed'?g.status==='بسته':isOpenGoal(g))&&(sub!=='kpi'||g.kind==='KPI')&&(sub!=='risk'||g.confidence==='خارج از مسیر'));let controls='<div class="row filters"><select id="goalTeam" style="width:auto"><option value="">همه تیم‌ها</option>'+data.teams.map(t=>'<option '+(team===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'+['all','risk','kpi','map','closed','archived'].map((s,i)=>'<button data-sub="'+s+'">'+['فهرست','خارج از مسیر','شاخص‌ها','درخت اهداف','بسته‌شده','بایگانی'][i]+'</button>').join('')+'</div>';if(sub==='map')return heading('نمای درختی اهداف','هم‌راستایی استراتژیک',btn('add-goal','＋ هدف جدید'))+controls+map();if(sub==='kpi')return heading('تابلوی شاخص‌های عملکرد','آخرین مقدار و تاریخچه ثبت‌شده',btn('add-goal','＋ شاخص'))+controls+panel('شاخص‌های عملکرد',table(list))+panel('تاریخچه پایش شاخص‌ها','<div class="tablewrap"><table><thead><tr><th>شاخص</th><th>تاریخ</th><th>مقدار</th><th>یادداشت</th></tr></thead><tbody>'+list.flatMap(g=>(g.history||[]).map(h=>'<tr><td>'+esc(g.name)+'</td><td>'+esc(h.date)+'</td><td>'+fa(h.value)+'</td><td>'+esc(h.note)+'</td></tr>')).join('')+'</tbody></table></div>');return heading(sub==='risk'?'اهداف خارج از مسیر':sub==='closed'?'اهداف بسته‌شده':sub==='archived'?'اهداف بایگانی‌شده':'اهداف فعال','مدیریت اهداف، نتایج کلیدی و شاخص‌ها',btn('add-goal','＋ افزودن هدف'))+controls+panel('فهرست اهداف',table(list))}
function tasks(){return heading('اقدامات و پروژه‌ها','اقدامات مرتبط با تحقق اهداف',btn('add-task','＋ اقدام جدید'))+panel('فهرست اقدامات',data.tasks.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'><span>'+esc(t.name)+'<br><small>'+esc(t.owner)+' | '+esc(data.goals.find(g=>g.id===t.goal)?.name||'بدون هدف')+' | '+esc(t.due||'بدون موعد')+'</small></span></label>'+btn('task:'+t.id,'ویرایش','secondary')+'</div>').join('')||'<div class="empty">اقدامی ثبت نشده است.</div>')}
function teams(){return heading('تیم‌ها','مسئولیت و هم‌راستایی واحدها',btn('add-team','＋ تیم جدید'))+'<div class="grid">'+data.teams.map(t=>'<section class="panel teamcard"><h2>'+esc(t)+'</h2><small>'+fa(data.goals.filter(g=>g.team===t).length)+' هدف و شاخص</small><div style="margin-top:12px"><button data-team="'+esc(t)+'">مشاهده اهداف تیم</button></div></section>').join('')+'</div>'}
const recNames={meetings:'جلسات',reviews:'بازبینی کسب‌وکار',peopleReviews:'ارزیابی عملکرد'},recFields={meetings:[['name','عنوان جلسه'],['owner','شرکت‌کنندگان'],['due','تاریخ جلسه'],['notes','دستور جلسه و نکات گفت‌وگو'],['next','تصمیم‌ها و اقدامات بعدی']],reviews:[['name','عنوان دوره بازبینی'],['owner','مسئول / تیم'],['due','تاریخ بازبینی'],['notes','نتایج، موانع و آموخته‌ها'],['next','تصمیم‌ها و اولویت‌های دوره بعد']],peopleReviews:[['name','عنوان چرخه یا نام فرد'],['owner','ارزیاب / مشارکت‌کنندگان'],['due','مهلت'],['notes','شواهد عملکرد و بازخورد'],['next','برنامه رشد و پیگیری']]};
function records(k){return heading(recNames[k],'ثبت، مرور و پیگیری',btn('record:'+k,'＋ ثبت جدید'))+panel('سوابق',data[k].map(r=>'<div class="action"><div><b>'+esc(r.name)+'</b><br><small>'+esc(r.owner)+' | '+esc(r.due||'بدون تاریخ')+'</small><p>'+esc(r.notes||'')+'</p></div>'+btn('record:'+k+':'+r.id,'مشاهده / ویرایش','secondary')+'</div>').join('')||'<div class="empty">هنوز موردی ثبت نشده است.</div>')}
function dash(){let a=data.goals.filter(g=>g.kind==='KR'&&isOpenGoal(g)),avg=a.length?a.reduce((s,g)=>s+(progress(g)||0),0)/a.length:0;return heading('داشبورد عملکرد','نمای مدیریتی پیشرفت و وضعیت اهداف',btn('print','چاپ گزارش'))+summary()+'<div class="grid">'+panel('پیشرفت نتایج کلیدی','<div class="donut" style="background:conic-gradient(#204a91 '+avg+'%,#e9edf4 0)"><span>'+fa(avg)+'٪</span></div><div class="muted" style="text-align:center">میانگین ساده پیشرفت نتایج کلیدی فعال</div>')+panel('وضعیت اهداف',a.map(g=>'<div class="action"><span>'+esc(g.name)+'</span>'+bar(progress(g))+'</div>').join(''))+'</div>'+panel('عملکرد تیم‌ها',data.teams.map(t=>{let x=a.filter(g=>g.team===t),p=x.length?x.reduce((s,g)=>s+(progress(g)||0),0)/x.length:null;return '<div class="action"><b>'+esc(t)+'</b>'+bar(p)+'</div>'}).join(''))+panel('آخرین ثبت‌های پیشرفت',data.goals.flatMap(g=>(g.history||[]).map(h=>({...h,name:g.name}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(h=>'<div class="action"><span>'+esc(h.name)+' | '+esc(h.date)+'</span><b>'+fa(h.value)+'</b></div>').join('')||'<div class="empty">پس از به‌روزرسانی اهداف، سوابق در اینجا نمایش داده می‌شود.</div>')}
function settings(){return heading('تنظیمات','مدیریت دوره، داده‌ها و پشتیبان')+panel('دوره زمانی','<form id="periodForm"><label>عنوان دوره</label><input name="period" value="'+esc(data.period)+'" required><button class="primary" style="margin-top:12px">ذخیره</button></form>')+panel('پشتیبان و گزارش','<div class="row">'+btn('download','خروجی JSON')+btn('csv','خروجی CSV')+btn('print','چاپ / ذخیره PDF','secondary')+'</div><label>بازیابی فایل پشتیبان JSON</label><input type="file" id="import" accept=".json,application/json"><p class="muted">بازیابی، داده‌های فعلی همین مرورگر را جایگزین می‌کند.</p>')+panel('محدودیت محیط آموزشی','<p>این نسخه بدون حساب کاربری و سرور اشتراکی است. همگام‌سازی کاربران، مجوزها، اعلان‌ها، اتصال سازمانی و دستیار هوش مصنوعی در این نسخه فعال نیستند.</p>'+btn('reset','بازگردانی نمونه آموزشی','danger'))}
function drawer(title,body){$('#overlay').innerHTML='<div class="backdrop" data-act="close"></div><section class="drawer" role="dialog" aria-modal="true"><div class="row between"><h2>'+title+'</h2>'+btn('close','بستن ×','secondary')+'</div>'+body+'</section>'}
function field(k,label,value='',type='text'){return '<div class="formrow"><label>'+label+'</label><input name="'+k+'" type="'+type+'" value="'+esc(value)+'" '+(k==='name'?'required':'')+' '+(type==='number'?'step="any" required':'')+'></div>'}
function options(k,label,items,value){return '<label>'+label+'</label><select name="'+k+'">'+items.map(([v,l])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'}
function goalForm(g={}){drawer(g.id?'ویرایش هدف':'افزودن هدف', '<form id="goalForm" data-id="'+esc(g.id||'')+'">'+field('name','عنوان',g.name)+options('kind','نوع',Object.entries(types),g.kind||'Objective')+options('pillar','رکن راهبردی',data.pillars.map(p=>[p.id,p.name]),g.pillar||data.pillars[0]?.id)+options('parent','هدف بالادست نتیجه کلیدی یا ابتکار',[['','بدون هدف بالادست'],...data.goals.filter(x=>x.kind==='Objective'&&x.id!==g.id).map(x=>[x.id,x.name])],g.parent||'')+options('team','تیم',data.teams.map(t=>[t,t]),g.team||data.teams[0])+memberField(g)+'<div class="fields" id="numeric">'+field('start','مقدار مبنا',g.start??0,'number')+field('target','مقدار هدف',g.target??100,'number')+field('current','مقدار فعلی',g.current??0,'number')+field('unit','واحد',g.unit||'درصد')+'</div>'+field('period','دوره زمانی',g.period||data.period)+field('due','موعد',g.due,'date')+'<label>شرح</label><textarea name="description" '+requiredTemplate('description')+'>'+esc(g.description??(g.id?'':data.templates?.description??''))+'</textarea><button class="primary" style="margin-top:14px">ذخیره هدف</button></form>')}
function detail(id){let g=data.goals.find(x=>x.id===id);if(!g)return;openId=id;let p=progress(g);drawer(esc(g.name),'<div class="row"><span class="tag">'+types[g.kind]+'</span><span class="tag">'+esc(g.status)+'</span><small>'+esc(g.team)+' | '+esc(g.owner)+'</small></div><div class="tabs row">'+btn('edit:'+id,'ویرایش','secondary')+btn('close-goal:'+id,g.status==='بسته'?'بازگشایی هدف':'بستن هدف','secondary')+'</div>'+panel('پیشرفت',bar(p)+(g.kind==='Objective'?'<p class="muted">پیشرفت هدف از میانگین نتایج کلیدی آن محاسبه می‌شود.</p>':'<form id="updateProgress" data-id="'+id+'">'+field('current','مقدار فعلی',g.current,'number')+'<label>توضیح تغییر و موانع</label><textarea name="note"></textarea><button class="primary">ثبت پیشرفت</button></form>'))+panel('شرح و هم‌راستایی','<p>'+esc(g.description||'بدون شرح')+'</p><small>'+esc(data.pillars.find(x=>x.id===g.pillar)?.name||'')+'</small>')+(g.kind==='Objective'?panel('نتایج کلیدی',table(data.goals.filter(x=>x.parent===id))+btn('add-kr:'+id,'＋ نتیجه کلیدی')):'')+panel('اقدامات مرتبط',data.tasks.filter(t=>t.goal===id).map(t=>'<div class="action">'+esc(t.name)+'<small>'+(t.done?'تکمیل شده':'باز')+'</small></div>').join('')+btn('add-task:'+id,'＋ اقدام'))+panel('فعالیت‌ها و سوابق','<div class="timeline">'+(g.history||[]).slice().reverse().map(h=>'<p>'+esc(h.date)+' | '+fa(h.value)+' — '+esc(h.note)+'</p>').join('')+'</div>')+(g.closeNote?panel('آموخته‌های اختتام',g.closings?.length?g.closings.map(n=>'<article class="activity"><div><b>'+esc(n.outcome)+' · '+fa(n.rating)+'/۵</b><small> '+esc(n.date)+'</small><p>'+esc(n.learning)+'</p><p>'+esc(n.next)+'</p></div></article>').join(''):esc(g.closeNote)):'')+btn('delete-goal:'+id,'حذف هدف','danger'))}
function taskForm(t={}){drawer('اقدام / پروژه','<form id="taskForm" data-id="'+esc(t.id||'')+'">'+field('name','عنوان اقدام',t.name)+options('goal','هدف مرتبط',[['','بدون هدف'],...data.goals.map(g=>[g.id,g.name])],t.goal||'')+memberField(t)+field('due','موعد',t.due,'date')+'<button class="primary">ذخیره</button></form>'+(t.id?btn('delete-task:'+t.id,'حذف','danger'):''))}
function recordForm(k,id){let r=data[k].find(x=>x.id===id)||{};drawer(recNames[k],'<form id="recordForm" data-kind="'+k+'" data-id="'+esc(id||'')+'">'+recFields[k].map(([key,label])=>['notes','next'].includes(key)?'<label>'+label+'</label><textarea name="'+key+'">'+esc(r[key]||'')+'</textarea>':field(key,label,r[key],key==='due'?'date':'text')).join('')+'<button class="primary">ذخیره</button></form>'+(id?btn('delete-record:'+k+':'+id,'حذف','danger'):''))}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function act(s){const [a,b,c]=s.split(':');if(a==='close'){$('#overlay').innerHTML='';return}if(a==='identity'){goto('strategy','identity');return}if(a==='go-goals'){goto('goals');return}if(a==='go-reviews'){goto('reviews');return}if(a==='go-tasks'){goto('tasks');return}if(a==='print'){window.print();return}if(a==='download'){download('behparvar-strategy.json',JSON.stringify(data,null,2),'application/json');return}if(a==='csv'){let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('behparvar-goals.csv','\ufeff'+[['عنوان','نوع','تیم','مسئول','مبنا','هدف','فعلی','واحد','پیشرفت'],...data.goals.map(g=>[g.name,types[g.kind],g.team,g.owner,g.start,g.target,g.current,g.unit,progress(g)])].map(r=>r.map(q).join(',')).join('\n'),'text/csv');return}if(a==='reset'){if(confirm('داده‌های فعلی حذف و نمونه جایگزین شود؟')){data=structuredClone(seed);save();render()}return}if(a==='add-goal'){goalForm({kind:sub==='kpi'?'KPI':'Objective'});return}if(a==='edit'){goalForm(data.goals.find(g=>g.id===b));return}if(a==='add-kr'){let g=data.goals.find(x=>x.id===b);goalForm({kind:'KR',parent:b,pillar:g.pillar,team:g.team,owner:g.owner});return}if(a==='add-task'||a==='task'){taskForm(a==='task'?data.tasks.find(t=>t.id===b):{goal:b});return}if(a==='delete-task'){if(confirm('حذف شود؟')){data.tasks=data.tasks.filter(t=>t.id!==b);save();act('close');render()}return}if(a==='record'){recordForm(b,c);return}if(a==='delete-record'){if(confirm('حذف شود؟')){data[b]=data[b].filter(r=>r.id!==c);save();act('close');render()}return}if(a==='add-pillar'||a==='pillar'){let p=data.pillars.find(x=>x.id===b);drawer('رکن راهبردی','<form id="pillarForm" data-id="'+esc(b||'')+'">'+field('name','عنوان رکن',p?.name)+'<button class="primary">ذخیره</button></form>');return}if(a==='add-team'){drawer('تیم جدید','<form id="teamForm">'+field('name','نام تیم')+'<button class="primary">ذخیره</button></form>');return}if(a==='delete-goal'){if(data.goals.some(g=>g.parent===b)||data.tasks.some(t=>t.goal===b)){alert('ابتدا نتایج یا اقدامات مرتبط را منتقل یا حذف کنید.');return}if(confirm('هدف حذف شود؟')){data.goals=data.goals.filter(g=>g.id!==b);save();act('close');render()}return}if(a==='close-goal'){let g=data.goals.find(x=>x.id===b);if(g.status==='بسته'){g.status='فعال';save();render();detail(b);return}drawer('اختتام هدف','<form id="closeForm" data-id="'+b+'"><label>ارزیابی و آموخته‌ها</label><textarea name="note" required></textarea><label>گام بعدی</label><textarea name="next"></textarea><button class="primary">ثبت و بستن هدف</button></form>')}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-sub],[data-act],[data-id],[data-team]');if(!el)return;if(el.tagName==='FORM')return;let d=el.dataset;if(d.page)goto(d.page);else if('sub' in d){sub=d.sub;render()}else if(d.act)act(d.act);else if(d.team){goto('goals','all');team=d.team;render()}else if(d.id)detail(d.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')act('close');if(e.key==='Enter'&&e.target.matches('.node[data-id]'))detail(e.target.dataset.id)});
document.addEventListener('change',async e=>{let x=e.target;if(x.id==='goalTeam'){team=x.value;render()}if(x.dataset.task){let t=data.tasks.find(t=>t.id===x.dataset.task);if(t){t.done=x.checked;save();render()}}if(x.id==='import'&&x.files[0]){try{let v=JSON.parse(await x.files[0].text());if(!v.identity||!Array.isArray(v.goals)||!Array.isArray(v.pillars)||!Array.isArray(v.teams)||!['tasks','meetings','reviews','peopleReviews'].every(k=>Array.isArray(v[k])))throw Error();if(confirm('داده‌های جاری جایگزین شوند؟')){data=v;save();render()}}catch{alert('فایل پشتیبان معتبر نیست.')}}});
document.addEventListener('submit',e=>{let f=e.target;if(!f.id)return;e.preventDefault();let v=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(cloud&&v.ownerId){v.owner=memberName(v.ownerId)}if(f.id==='identityForm')data.identity=v;else if(f.id==='periodForm')data.period=v.period;else if(f.id==='goalForm'){if(v.kind==='KR'||(v.kind==='Initiative'&&v.parent)){let p=data.goals.find(g=>g.id===v.parent&&g.kind==='Objective');if(!p){alert('برای نتیجه کلیدی یک هدف بالادست انتخاب کنید.');return}v.pillar=p.pillar}else v.parent='';if(v.kind!=='Objective'&&Number(v.start)===Number(v.target)){alert('مقدار هدف و مبنا باید متفاوت باشند.');return}if(id&&v.kind!=='Objective'&&data.goals.some(x=>x.parent===id)){alert('هدف دارای نتیجه کلیدی است؛ نوع آن قابل تغییر نیست.');return}let old=data.goals.find(g=>g.id===id);let g={...old,...v,id:id||uid(),status:old?.status||'فعال',history:old?.history||[]};['start','target','current'].forEach(k=>g[k]=Number(v[k]));if(g.kind==='KPI'&&(!old||old.current!==g.current||old.target!==g.target)){g.history.push({date:date(),value:g.current,target:g.target,start:g.start,note:'ثبت مقدار و هدف شاخص'})}if(old){Object.assign(old,g);data.goals.filter(x=>x.parent===id).forEach(x=>x.pillar=g.pillar)}else data.goals.push(g)}else if(f.id==='updateProgress'){let g=data.goals.find(x=>x.id===id);g.current=Number(v.current);g.history.push({date:date(),value:g.current,target:g.target,start:g.start,author:cloud?.email||'کاربر آموزشی',note:v.note});save();render();detail(id);return}else if(f.id==='closeForm'){let g=data.goals.find(x=>x.id===id);g.status='بسته';g.closeNote=v.note+' | گام بعدی: '+v.next}else if(f.id==='taskForm'){let t=data.tasks.find(x=>x.id===id);if(t)Object.assign(t,v);else data.tasks.push({...v,id:uid(),done:false})}else if(f.id==='recordForm'){let list=data[f.dataset.kind],r=list.find(x=>x.id===id);if(r)Object.assign(r,v);else list.push({...v,id:uid()})}else if(f.id==='pillarForm'){let p=data.pillars.find(x=>x.id===id);if(p)Object.assign(p,v);else data.pillars.push({...v,id:uid()})}else if(f.id==='teamForm'){if(!data.teams.includes(v.name))data.teams.push(v.name)}save();act('close');render()});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();if(page!=='goals'){page='goals';sub='all'}render()});$('#export').addEventListener('click',()=>act('download'));render();
</script>

ckground:#fafbfc}.period-board .current{background:#e6f4fe}.modal{width:min(560px,calc(100% - 24px));max-height:90vh;overflow:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;z-index:21;border-radius:9px;padding:22px;box-shadow:0 15px 70px #18294133}.modal h2{font-size:18px;margin:0 0 10px}.star{color:#da9826;font-size:25px;min-width:36px;background:transparent;border:0;padding:0}.star.dim{color:#cbd5e1}.actionline{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center}.actionline:last-child{border:0}.actionline>div{flex:1}.actionicon{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e5f5ef;color:#16805e}.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.integration{min-height:130px;border:1px solid var(--line);padding:14px;border-radius:7px;background:white}.integration p{color:var(--muted);font-size:12px}.chartlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.profilehead{display:flex;gap:12px;align-items:center;margin-bottom:15px}.profilehead .avatar{width:50px;height:50px;font-size:22px}.subtle{background:#fafbfd}.mobiletabs{display:none}@media(max-width:880px){.shell{grid-template-columns:62px minmax(0,1fr)}.goalworkspace{grid-template-columns:1fr}.cardgrid{grid-template-columns:1fr}.mobiletabs{display:flex;gap:4px;overflow:auto;margin-bottom:10px}.mobiletabs button{white-space:nowrap}.content{padding:10px}}@media print{.goalworkspace{display:block}.modal{display:none}.mobiletabs{display:none}}

<script>
/* Expanded reference-based workspace. All values are local, not a connected enterprise tenant. */
let activeGoal='',detailTab='aligned',boardFreq='monthly',boardOffset=0,profilePerson='',teamProfile='',homeTab='goals',showColumns={team:true,owner:true,progress:true,actual:true,target:true,status:true,due:true},filterOwner='';
const baseRender=render,baseGoto=goto,baseAct=act,baseGoals=goals,baseSettings=settings,baseDash=dash,baseTeams=teams,baseHome=home;
const persons=()=>[...new Set(data.goals.map(g=>g.owner).concat(data.tasks.map(t=>t.owner)).filter(Boolean))];
const av=n=>'<span class="avatar">'+esc((n||'؟').trim().slice(0,1))+'</span>';
function extended(){data.templates??={description:'',learning:'چه آموختیم؟',next:'گام‌های بعدی چیست؟',progress:'چه چیزی تغییر کرده است؟'};data.userReviews??=[];data.dashboardConfig??={trend:true,status:true,teams:true};data.goals.forEach(g=>{g.history??=[];g.comments??=[];g.confidence??='نامشخص';g.measurement??='manual';g.goalType??='متعهدانه'});}
extended();
subnav.goals.push(['templates','قالب‌های اهداف']);subnav.settings.push(['integrations','یکپارچه‌سازی‌ها']);subnav.teams.push(['people','افراد']);
goto=function(p,s){activeGoal='';teamProfile='';profilePerson='';filterOwner='';baseGoto(p,s)};
render=function(){extended();baseRender();if(activeGoal&&data.goals.some(g=>g.id===activeGoal))$('#app').innerHTML=goalPage(data.goals.find(g=>g.id===activeGoal));if(page==='teams'&&profilePerson)$('#app').innerHTML=personPage(profilePerson);else if(page==='teams'&&teamProfile)$('#app').innerHTML=teamPage(teamProfile);let side=subnav[page];if(side&&side.length>1&&!activeGoal)$('#app').insertAdjacentHTML('afterbegin','<div class="mobiletabs no-print">'+side.map(n=>'<button data-sub="'+n[0]+'">'+n[1]+'</button>').join('')+'</div>')};
function trend(points,target){let a=points.map(x=>Number(x.value)).filter(Number.isFinite);if(!a.length)return '<div class="empty">هنوز سابقه‌ای برای نمودار ثبت نشده است.</div>';let all=Number.isFinite(target)?a.concat(target):a,lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){hi+=1;lo-=1}const X=i=>38+i*462/Math.max(1,a.length-1),Y=v=>145-(v-lo)*115/(hi-lo);let lines=[0,1,2,3,4].map(i=>'<line x1="38" y1="'+(30+i*28.75)+'" x2="500" y2="'+(30+i*28.75)+'" stroke="#e5eaf0"/><text x="31" y="'+(34+i*28.75)+'" text-anchor="end" font-size="10" fill="#697b8c">'+fa(hi-i*(hi-lo)/4)+'</text>').join('');return '<svg class="goalchart" viewBox="0 0 530 175" role="img" aria-label="نمودار روند مقادیر" direction="ltr">'+lines+(Number.isFinite(target)?'<line x1="38" y1="'+Y(target)+'" x2="500" y2="'+Y(target)+'" stroke="#e3a33b" stroke-dasharray="5 4"/>':'')+'<polyline points="'+a.map((v,i)=>X(i)+','+Y(v)).join(' ')+'" fill="none" stroke="#168acf" stroke-width="2.5"/>'+a.map((v,i)=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#168acf"/>').join('')+'</svg><div class="row between tiny muted"><span>'+esc(points[0]?.date||'')+'</span><span>'+esc(points.at(-1)?.date||'')+'</span></div>'}
function statusDot(g){return '<span class="dot '+(g.confidence==='در مسیر'?'green':g.confidence==='خارج از مسیر'?'red':g.confidence==='در معرض ریسک'?'orange':'')+'"></span>'}
function goalPage(g){let p=progress(g),children=data.goals.filter(x=>x.parent===g.id),ts=data.tasks.filter(t=>t.goal===g.id),hist=(g.history||[]).map(h=>({...h,type:'progress'})).concat((g.comments||[]).map(h=>({...h,type:'comment'}))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));let tabs='<div class="tabline">'+[['aligned','اهداف هم‌راستا'],['tasks','اقدامات'],['history','روند و سوابق']].map(([k,n])=>'<button data-act="detail-tab:'+k+'" class="'+(detailTab===k?'selected':'')+'">'+n+'</button>').join('')+'</div>';
let content=detailTab==='tasks'?panel('اقدامات مرتبط',ts.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label>'+btn('task:'+t.id,'ویرایش','secondary')+'</div>').join('')+btn('add-task:'+g.id,'＋ اقدام جدید')):detailTab==='history'?panel('روند پیشرفت',drivenByChildren(g)?'<p>پیشرفت هدف بر مبنای نتایج کلیدی محاسبه می‌شود.</p>':trend(g.history,Number(g.target))):panel('اهداف هم‌راستا',(g.parent?'<div class="action"><small>هدف بالادست</small><button data-id="'+esc(g.parent)+'">'+esc(data.goals.find(x=>x.id===g.parent)?.name||'')+'</button></div>':'')+table(children)+(g.kind==='Objective'?btn('add-kr:'+g.id,'＋ نتیجه کلیدی'):''));
return '<div class="row between"><button data-act="back-goals">بازگشت به اهداف</button><small>کاوش / نقشه استراتژی / '+esc(types[g.kind])+'</small></div><h1 class="detailtitle">'+esc(g.name)+'</h1><div class="row" style="margin-bottom:14px"><span class="pill">'+types[g.kind]+'</span><span class="pill">'+esc(g.status)+'</span><span class="pill">'+esc(g.period||data.period)+'</span><span class="pill">'+esc(g.goalType)+'</span>'+btn('edit:'+g.id,'ویرایش','secondary')+(g.status==='بایگانی'?'':btn('close-goal:'+g.id,g.status==='بسته'?'بازگشایی':'اختتام هدف','secondary'))+(g.status==='بسته'?btn('archive-goal:'+g.id,'بایگانی هدف','secondary'):'')+'</div><div class="goalworkspace"><div>'+tabs+content+panel('فعالیت‌ها','<form id="goalComment" data-id="'+g.id+'"><textarea name="note" placeholder="افزودن نظر یا یادداشت…" required></textarea><button class="primary">ثبت نظر</button></form>'+hist.map(h=>'<div class="activity">'+av(h.author)+'<div><b>'+esc(h.author||'ثبت‌کننده مشخص نیست')+'</b> <small>'+esc(h.date)+'</small><p>'+(h.type==='progress'?'پیشرفت را به '+fa(h.value)+' '+esc(g.unit)+' به‌روزرسانی کرد. ':'')+esc(h.note||'')+'</p></div></div>').join(''))+'</div><aside>'+panel('پیشرفت','<div class="row">'+statusDot(g)+'<span>'+esc(g.confidence)+'</span></div><div style="font-size:30px;font-weight:700">'+(p===null?'—':fa(p)+'٪')+'</div>'+bar(p)+(!drivenByChildren(g)?'<p class="tiny">مقدار فعلی: <b>'+fa(g.current)+' '+esc(g.unit)+'</b><br>هدف: '+fa(g.target)+' '+esc(g.unit)+'</p>'+btn('checkin:'+g.id,'به‌روزرسانی پیشرفت')+' '+btn('measure:'+g.id,'روش پایش','secondary'):btn('measure:'+g.id,'روش پایش','secondary'))+'<p class="tiny muted">آخرین ثبت: '+esc(g.history.at(-1)?.date||'ثبت نشده')+'</p>')+panel('توضیحات',esc(g.description||'بدون شرح'))+panel('افراد و مسئولیت‌ها','<div class="row">'+av(g.owner)+'<div>'+esc(g.owner)+'<br><small>مسئول هدف</small></div></div><p class="tiny">'+esc(g.team)+'</p>'+(cloud?(g.ownerId?btn('org-person:'+g.ownerId,'پروفایل مسئول','secondary'):''):btn('person:'+encodeURIComponent(g.owner||''),'پروفایل مسئول','secondary')))+panel('زمان‌بندی','<small>دوره: '+esc(g.period||data.period)+'<br>موعد: '+esc(g.due||'تعیین نشده')+'</small>')+(g.closeNote?panel('آموخته‌های اختتام',g.closings?.length?g.closings.map(n=>'<article class="activity"><div><b>'+esc(n.outcome)+' · '+fa(n.rating)+'/۵</b><small> '+esc(n.date)+'</small><p>'+esc(n.learning)+'</p><p>'+esc(n.next)+'</p></div></article>').join(''):esc(g.closeNote)):'')+'</aside></div>'}
detail=function(id){if(!data.goals.some(g=>g.id===id))return;act('close');activeGoal=id;detailTab='aligned';render();window.scrollTo(0,0)};
function modal(title,content){$('#overlay').innerHTML='<div class="backdrop" data-act="close"></div><section class="modal" role="dialog" aria-modal="true"><div class="row between"><h2>'+title+'</h2><button data-act="close">×</button></div>'+content+'</section>'}
function dialogFooter(){
 return '<footer class="dialog-foot"><button type="button" data-act="close">انصراف</button><button class="primary">ذخیره</button></footer>';
}
function requiredTemplate(key){
 const flags=data.templates.required;
 return (flags?flags[key]:key==='learning')?'required':'';
}
function templateSettings(){
 const groups=[['شرح OKR',[['description','شرح پیش‌فرض']]],['یادداشت‌های اختتام',[['learning','آموخته‌ها'],['next','گام‌های بعدی']]],['یادداشت بایگانی',[['archive','یادداشت بایگانی']]],['به‌روزرسانی پیشرفت',[['progress','یادداشت پیشرفت']]]];
 return heading('قالب‌های اهداف','')+panel('تنظیم قالب‌ها','<form id="templateForm">'+groups.map(([title,fields])=>'<details class="template-section"><summary>'+title+'</summary>'+fields.map(([key,label])=>'<label>'+label+'</label><textarea name="'+key+'">'+esc(data.templates[key]||'')+'</textarea><label class="check"><input type="checkbox" name="require-'+key+'" '+(requiredTemplate(key)?'checked':'')+'>پاسخ الزامی</label>').join('')+'</details>').join('')+'<button class="primary">ذخیره قالب‌ها</button></form>');
}
function driverDialog(g){
 const mode=drivenByChildren(g)?'aligned':'manual';
 const choices=[['manual','ثبت دستی',false],['integration','اتصال بیرونی',true],['aligned','اهداف هم‌راستا',g.kind!=='Objective']];
 modal('روش محاسبه پیشرفت','<form id="measureForm" data-id="'+esc(g.id)+'"><p>پیشرفت این هدف چگونه اندازه‌گیری شود؟</p><div class="drivers">'+choices.map(([key,label,disabled])=>'<label><input type="radio" name="measurement" value="'+key+'" '+(disabled?'disabled':'')+' '+(mode===key?'checked':'')+'>'+label+'</label>').join('')+'</div><p class="muted">اتصال بیرونی پیکربندی نشده است. پیشرفت هدف هم‌راستا از میانگین نتایج کلیدی دارای مقدار معتبر محاسبه می‌شود.</p>'+dialogFooter()+'</form>');
}
function closingDialog(g){
 const stars=[1,2,3,4,5].map(n=>'<label><input type="radio" name="rating" required value="'+n+'" aria-label="'+fa(n)+' از پنج"><span aria-hidden="true">★</span></label>').join('');
 modal('اختتام هدف','<form id="closeEnhanced" data-id="'+esc(g.id)+'"><p>'+esc(g.name)+'</p><fieldset class="rating"><legend>کیفیت اجرا را چگونه ارزیابی می‌کنید؟</legend><div>'+stars+'</div></fieldset>'+options('outcome','وضعیت اختتام',['محقق شد','تا حدی محقق شد','محقق نشد','متوقف شد'].map(v=>[v,v]),'')+'<label>'+esc(data.templates.learning)+'</label><textarea name="learning" '+requiredTemplate('learning')+'></textarea><label>'+esc(data.templates.next)+'</label><textarea name="next" '+requiredTemplate('next')+'></textarea><label class="check"><input type="checkbox" name="markClosed" checked>هدف بسته شود</label>'+dialogFooter()+'</form>');
}
function boardDate(offset){let now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(boardFreq==='weekly'){d.setDate(d.getDate()-((d.getDay()+1)%7)+offset*7);return d}if(boardFreq==='monthly')return new Date(now.getFullYear(),now.getMonth()+offset,1);if(boardFreq==='quarterly')return new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3+offset*3,1);return new Date(now.getFullYear()+offset,0,1)}
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function periodCell(g,p,key){
 if(cloud&&cloud.role!=='admin')return '<td>'+p[key]+'</td>';
 const label=key==='actual'?'واقعی':'هدف';
 return '<td><button class="period-value" aria-label="'+esc(label+' '+g.name+' '+p.from)+'" data-act="period-value:'+esc(g.id)+':'+p.from+':'+key+'">'+p[key]+'</button></td>';
}
function editPeriod(g,from,key){
 if(!g||g.kind!=='KPI'||!['actual','target'].includes(key)||!/^\d{4}-\d{2}-\d{2}$/.test(from))return;
 const value=g.periodValues?.[boardFreq]?.[from]?.[key],label=key==='actual'?'مقدار واقعی':'مقدار هدف';
 modal(label,'<form id="periodValue" data-id="'+esc(g.id)+'" data-start="'+from+'" data-frequency="'+boardFreq+'" data-key="'+key+'"><p>'+esc(g.name)+' · '+esc(from)+'</p><label>'+label+'</label><input name="amount" type="number" step="any" required value="'+(Number.isFinite(value)?value:'')+'">'+dialogFooter()+'</form>');
}
function kpiBoard(list){
 const columns=Array.from({length:8},(_,i)=>i-6+boardOffset);
 const dateFormat=new Intl.DateTimeFormat('fa-IR-u-ca-gregory',{year:'numeric',...(boardFreq==='annual'?{}:{month:'short'}),...(boardFreq==='weekly'?{day:'numeric'}:{})});
 const dates=columns.map(i=>({i,from:iso(boardDate(i)),until:iso(boardDate(i+1)),label:dateFormat.format(boardDate(i))}));
 const rows=list.map(g=>{
   const periods=dates.map(({i,from,until})=>{
     const samples=(g.history||[]).filter(h=>h.date>=from&&h.date<until).sort((a,b)=>a.date.localeCompare(b.date));
     const sample=samples.at(-1),plan=samples.filter(h=>Number.isFinite(h.target)).at(-1);
     const override=g.periodValues?.[boardFreq]?.[from]||{};
     const target=Object.hasOwn(override,'target')?override.target:(plan?.target??(i===0?g.target:null));
     const value=Object.hasOwn(override,'actual')?override.actual:sample?.value;
     const color=Number.isFinite(value)&&Number.isFinite(target)&&Number.isFinite(plan?.start)?((target>=plan.start?value>=target:value<=target)?'green':'red'):'';
     return {from,actual:Number.isFinite(value)?(color?'<span class="dot '+color+'"></span> ':'')+fa(value):'—',target:Number.isFinite(target)?fa(target):'—'};
   });
   return '<tr data-id="'+esc(g.id)+'"><td rowspan="2"><b>'+esc(g.name)+'</b><small class="board-owner">'+esc([g.team,g.owner].filter(Boolean).join(' · '))+'</small></td><td>واقعی</td>'+periods.map(p=>periodCell(g,p,'actual')).join('')+'</tr><tr><td>هدف</td>'+periods.map(p=>periodCell(g,p,'target')).join('')+'</tr>';

 }

function meetingView(m){let ts=data.tasks.filter(t=>t.meetingId===m.id),gs=data.goals.filter(g=>g.owner===m.participant&&isOpenGoal(g));return '<div class="row between"><button data-act="meeting-list">بازگشت به جلسات</button>'+recordStatus(m.status)+'</div><div class="head"><h1>'+esc(m.name)+'</h1><div class="row">'+personLabel(m.manager)+personLabel(m.participant)+'<span class="pill">'+esc(m.date)+' '+esc(m.time)+'</span>'+btn('meeting-next:'+m.id,'برنامه‌ریزی جلسه بعدی','secondary')+'</div></div><div class="meetinglayout"><div>'+panel('موضوعات گفت‌وگو',m.agenda?'<p class="muted">'+esc(m.agenda)+'</p>':'')+panel('Talking points',m.points.map(p=>'<div class="action"><label class="check"><input type="checkbox" data-meetpoint="'+p.id+'" '+(p.done?'checked':'')+'>'+esc(p.text)+'</label>'+btn('point-delete:'+p.id,'×','secondary')+'</div>').join('')+'<form id="pointAdd" class="inlineform"><input name="text" placeholder="موضوع جدید…" required><button class="primary">افزودن</button></form>')+panel('اقدامات جلسه',ts.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label><small>'+esc(t.owner)+' | '+esc(t.due||'بدون موعد')+'</small>'+btn('task:'+t.id,'ویرایش','secondary')+'</div>').join('')+'<form id="meetingTask" class="inlineform"><input name="name" placeholder="اقدام پیگیری…" required><select name="owner">'+[m.manager,m.participant].map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><input name="due" type="date" title="موعد"><button class="primary">افزودن</button></form>')+panel('یادداشت جلسه','<form id="meetingNote"><textarea name="notes" placeholder="یادداشت‌های مشترک جلسه">'+esc(m.notes||'')+'</textarea><button class="primary">ذخیره یادداشت</button></form>')+panel('یادداشت شخصی','<div class="sensitive">محیط آموزشی محلی است؛ محرمانگی واقعی در برابر سایر کاربران یا دارندگان همین دستگاه تضمین نمی‌شود. اطلاعات حساس وارد نکنید.</div><form id="privateNote"><textarea name="notes" placeholder="یادداشت تمرینی شخصی">'+esc(m.privateNotes||'')+'</textarea><button class="primary">ذخیره</button></form>')+'<div class="row">'+btn('meeting-finish:'+m.id,m.status==='تکمیل‌شده'?'بازگشایی جلسه':'تکمیل جلسه')+'</div></div><aside>'+panel('اهداف '+esc(m.participant),gs.map(g=>'<div class="action"><div><button data-id="'+g.id+'">'+esc(g.name)+'</button>'+bar(progress(g))+'</div></div>').join('')||'<div class="empty">هدف فعالی ندارد.</div>')+panel('مرورهای پیشین',data.reviewEntries.filter(e=>e.person===m.participant&&e.status==='تکمیل‌شده').map(e=>'<div class="action">'+esc(data.cycles.find(c=>c.id===e.cycle)?.name||'ارزیابی')+'</div>').join('')||'<small>موردی ثبت نشده است.</small>')+'</aside></div>'}

function cycleView(c){let a=data.reviewEntries.filter(e=>e.cycle===c.id);return heading(esc(c.name),'چرخه ارزیابی عملکرد',btn('cycles-list','بازگشت','secondary')+' '+btn('cycle-close:'+c.id,c.status==='بسته'?'بازگشایی':'بستن چرخه'))+panel('اطلاعات دوره','<div class="row">'+recordStatus(c.status)+'<span class="pill">مهلت: '+esc(c.deadline||'—')+'</span><span class="pill">'+esc(c.reviewer||'خودارزیابی')+'</span></div><p>'+esc(c.description)+'</p>')+panel('مشارکت‌کنندگان',a.map(e=>'<div class="reviewcard">'+av(e.person)+'<div><b>'+esc(e.person)+'</b><br><small>'+esc(e.mode==='self'?'خودارزیابی':e.reviewer)+'</small></div>'+recordStatus(e.status)+btn('entry-open:'+e.id,'مشاهده / تکمیل')+'</div>').join('')||'<div class="empty">مشارکت‌کننده‌ای وجود ندارد.</div>')}
function entryView(e){let c=data.cycles.find(x=>x.id===e.cycle),closed=c?.status==='بسته';return '<div class="reviewform">'+heading('ارزیابی '+esc(e.person),esc(c?.name||''),btn('entry-back','بازگشت','secondary'))+panel('اهداف و شواهد عملکرد',table(data.goals.filter(g=>g.owner===e.person)))+'<form id="entryForm">'+panel('بازتاب عملکرد','<label>دستاوردها و شواهد</label><textarea name="achievements">'+esc(e.achievements||'')+'</textarea><label>موانع و فرصت‌های بهبود</label><textarea name="challenges">'+esc(e.challenges||'')+'</textarea><label>برنامه توسعه و گام‌های بعدی</label><textarea name="development">'+esc(e.development||'')+'</textarea>'+options('rating','ارزیابی کلی',[['','انتخاب کنید'],['1','۱ — نیازمند بهبود جدی'],['2','۲ — پایین‌تر از انتظار'],['3','۳ — مطابق انتظار'],['4','۴ — بالاتر از انتظار'],['5','۵ — عملکرد برجسته']],e.rating||''))+ (c?.mode!=='self'?panel('بازخورد مدیر','<label>بازخورد و شواهد ارزیاب</label><textarea name="managerFeedback">'+esc(e.managerFeedback||'')+'</textarea>'):'')+ (closed||e.status==='تکمیل‌شده'?'<p class="sensitive">این ارزیابی بسته یا تکمیل شده است؛ برای اصلاح، چرخه را بازگشایی کنید و ارزیابی را به پیش‌نویس برگردانید.</p>'+(!closed?btn('entry-reopen:'+e.id,'بازگشایی ارزیابی','secondary'):''):'<div class="row"><button type="submit" name="intent" value="draft">ذخیره پیش‌نویس</button><button type="submit" name="intent" value="complete" class="primary">تکمیل ارزیابی</button></div>')+'</form></div>'}
function viewPeopleReviews(){if(entryId){let e=data.reviewEntries.find(x=>x.id===entryId);if(e)return entryView(e)}if(workflowMode==='cycle-new')return cycleForm();if(cycleId){let c=data.cycles.find(x=>x.id===cycleId);if(c)return cycleView(c)}if(sub==='cycles')return heading('چرخه‌های ارزیابی','مدیریت دوره‌های ارزیابی',btn('cycle-new','＋ چرخه جدید'))+panel('چرخه‌ها',data.cycles.map(cycleCard).join('')||'<div class="empty">چرخه‌ای ایجاد نشده است.</div>');let people=persons(),list=data.reviewEntries.filter(e=>!focusPerson||e.person===focusPerson||e.reviewer===focusPerson);const cards=a=>a.map(e=>'<div class="reviewcard">'+av(e.person)+'<div><b>'+esc(e.person)+'</b><br><small>'+esc(data.cycles.find(c=>c.id===e.cycle)?.name||'ارزیابی')+'</small></div>'+recordStatus(e.status)+btn('entry-open:'+e.id,e.status==='تکمیل‌شده'?'مشاهده':'شروع')+'</div>').join('')||'<div class="empty">موردی وجود ندارد.</div>';return heading('ارزیابی‌های من','ارزیابی‌های نیازمند اقدام و سوابق',btn('cycles-list','چرخه‌ها','secondary'))+'<div class="row filters"><label for="reviewPerson">نمای آموزشی فرد</label><select id="reviewPerson" class="personselector"><option value="">همه افراد</option>'+people.map(n=>'<option '+(focusPerson===n?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'+panel('نیازمند اقدام',cards(list.filter(e=>e.status!=='تکمیل‌شده')))+panel('ارزیابی‌های گذشته',cards(list.filter(e=>e.status==='تکمیل‌شده')))}
function snapshotTable(list){return '<div class="tablewrap"><table><thead><tr><th>هدف / شاخص</th><th>تیم</th><th>مسئول</th><th>پیشرفت ثبت‌شده</th><th>مقدار ثبت‌شده</th><th>هدف</th></tr></thead><tbody>'+list.map(g=>'<tr><td class="tname">'+esc(g.name)+'</td><td>'+esc(g.team)+'</td><td>'+esc(g.owner)+'</td><td>'+bar(Object.hasOwn(g,'frozenProgress')?g.frozenProgress:g.kind==='Objective'?null:progress(g))+'</td><td>'+(g.kind==='Objective'?'—':fa(g.current)+' '+esc(g.unit))+'</td><td>'+(g.kind==='Objective'?'—':fa(g.target)+' '+esc(g.unit))+'</td></tr>').join('')+'</tbody></table></div>'}
function bizForm(){return '<div class="reviewform">'+heading('بازبینی کسب‌وکار جدید','بازبینی عملکرد دوره‌ای سازمان و تیم')+panel('تعریف بازبینی','<form id="bizCreate">'+field('name','عنوان بازبینی','بازبینی '+data.period)+options('team','دامنه',[['','کل سازمان'],...teamOptions()],'')+field('date','تاریخ بازبینی',date(),'date')+field('period','دوره',data.period)+'<button class="primary">ایجاد بازبینی</button></form>')+'</div>'}
function bizView(b){let list=data.goals.filter(g=>!b.team||g.team===b.team),snapshot=b.snapshot||null;return heading(esc(b.name),esc(b.period)+' | '+esc(b.team||'کل سازمان'),btn('biz-list','بازگشت','secondary')+' '+btn('print','چاپ گزارش','secondary'))+panel('نمای عملکرد',snapshot?'<div class="notice">مقادیر این گزارش در زمان نهایی‌سازی ثبت شده‌اند.</div>'+snapshotTable(snapshot):table(list))+panel('تحلیل و تصمیم‌ها','<form id="bizUpdate"><label>چه چیزی طبق برنامه پیش رفت؟</label><textarea name="wins">'+esc(b.wins||'')+'</textarea><label>انحراف‌ها و موانع اصلی</label><textarea name="risks">'+esc(b.risks||'')+'</textarea><label>آموخته‌ها و تصمیم‌های مدیریتی</label><textarea name="decisions">'+esc(b.decisions||'')+'</textarea><label>اولویت دوره بعد</label><textarea name="next">'+esc(b.next||'')+'</textarea>'+(b.status==='منتشرشده'?'<p class="muted">گزارش نهایی شده است.</p>':'<div class="row"><button name="intent" value="draft">ذخیره پیش‌نویس</button><button name="intent" value="complete" class="primary">نهایی‌سازی بازبینی</button></div>')+'</form>')+panel('اقدامات پیگیری',data.tasks.filter(t=>t.businessId===b.id).map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label><small>'+esc(t.owner)+' | '+esc(t.due||'—')+'</small></div>').join('')+'<form id="bizTask" class="inlineform"><input name="name" placeholder="اقدام پیگیری" required><select name="owner">'+ownerOptions().map(([n])=>'<option>'+esc(n)+'</option>').join('')+'</select><input name="due" type="date"><button class="primary">افزودن</button></form>')}
function viewBusiness(){if(workflowMode==='biz-new')return bizForm();if(bizId){let b=data.businessCycles.find(x=>x.id===bizId);if(b)return bizView(b)}return heading('بازبینی کسب‌وکار','از عملکرد تا تصمیم و اقدام',btn('biz-new','＋ بازبینی جدید'))+panel('بازبینی‌ها',data.businessCycles.map(b=>'<div class="reviewcard">'+av(b.team||'سازمان')+'<div><b>'+esc(b.name)+'</b><br><small>'+esc(b.period)+' | '+esc(b.date)+' | '+esc(b.team||'کل سازمان')+'</small></div>'+recordStatus(b.status)+btn('biz-open:'+b.id,'مشاهده','secondary')+'</div>').join('')||'<div class="empty">بازبینی ایجاد نشده است.</div>')}
function orgNode(t,seen=[]){if(seen.includes(t))return '';let m=data.teamMeta[t]||{},kids=data.teams.filter(n=>data.teamMeta[n]?.parent===t);return '<div class="orgnode"><div class="action"><div><b>'+esc(t)+'</b><br><small>'+esc(m.lead||'مسئول تعیین نشده')+'</small></div>'+btn('team-meta:'+encodeURIComponent(t),'ویرایش','secondary')+'</div>'+kids.map(n=>orgNode(n,[...seen,t])).join('')+'</div>'}
teams=function(){if(sub==='org'){let roots=data.teams.filter(t=>!data.teams.includes(data.teamMeta[t]?.parent));return heading('ساختار سازمانی','تیم‌ها، مدیران و ارتباط سلسله‌مراتبی',btn('add-team','＋ تیم'))+panel('درخت سازمان','<div class="orgtree">'+roots.map(t=>orgNode(t)).join('')+'</div>')}return teamsV2()};

act=function(s){let [a,b]=s.split(':');if(a==='open-meetings'){goto('meetings','one');return}if(a==='open-reviews'){goto('people','my');return}if(a==='meeting-new'){goto('meetings','one');workflowMode='meeting-new';render();return}if(a==='meeting-list'){goto('meetings','one');return}if(a==='meeting-open'){goto('meetings','one');meetingId=b;render();return}if(a==='meeting-finish'){let m=data.oneOnOnes.find(x=>x.id===b);if(m){m.status=m.status==='تکمیل‌شده'?'برنامه‌ریزی‌شده':'تکمیل‌شده';save();render()}return}if(a==='point-delete'){let m=data.oneOnOnes.find(x=>x.id===meetingId);if(m&&confirm('موضوع حذف شود؟')){m.points=m.points.filter(p=>p.id!==b);save();render()}return}if(a==='meeting-next'){let m=data.oneOnOnes.find(x=>x.id===b);if(!m)return;modal('برنامه‌ریزی جلسه بعدی','<form id="meetingNext" data-id="'+b+'">'+field('date','تاریخ','','date')+field('time','ساعت',m.time,'time')+'<button class="primary">ایجاد جلسه بعد</button></form>');return}if(a==='cycles-list'){goto('people','cycles');return}if(a==='cycle-new'){goto('people','cycles');workflowMode='cycle-new';render();return}if(a==='cycle-open'){goto('people','cycles');cycleId=b;render();return}if(a==='cycle-close'){let c=data.cycles.find(x=>x.id===b);if(c){if(c.status!=='بسته'&&data.reviewEntries.some(e=>e.cycle===b&&e.status!=='تکمیل‌شده')&&!confirm('ارزیابی‌های ناتمام وجود دارد. چرخه بسته شود؟'))return;c.status=c.status==='بسته'?'فعال':'بسته';save();render()}return}if(a==='entry-open'){goto('people','my');entryId=b;render();return}if(a==='entry-back'){let e=data.reviewEntries.find(x=>x.id===entryId);if(e&&e.cycle){goto('people','cycles');cycleId=e.cycle;render()}else goto('people','my');return}if(a==='entry-reopen'){let e=data.reviewEntries.find(x=>x.id===b);if(e&&data.cycles.find(c=>c.id===e.cycle)?.status!=='بسته'){e.status='پیش‌نویس';save();render()}return}if(a==='biz-new'){goto('reviews','business');workflowMode='biz-new';render();return}if(a==='biz-list'){goto('reviews','business');return}if(a==='biz-open' join('')+'</tr></thead><tbody>'+rows.map(row=>{let g=row.o;if(row.kind==='pillar'){let key='pillar:'+g.id;return '<tr data-act="pillar:'+esc(g.id)+'"><td><div class="refrowname"><button class="fold" data-act="pillar-fold:'+esc(g.id)+'" aria-label="باز و بسته کردن رکن">'+(rowFold.has(key)?'‹':'⌄')+'</button><span class="type-icon">♜</span><span class="titletext">'+esc(g.name)+'</span></div></td><td colspan="'+cols.length+'"></td></tr>'}let t=row.kind==='task',icon=t?'☷':g.kind==='KPI'?'▤':g.kind==='KR'?'↗':g.kind==='Initiative'?'☷':'⚑',cls=t?'initiative':g.kind.toLowerCase(),attr=t?'data-act="task:'+esc(g.id)+'"':'data-id="'+esc(g.id)+'"';return '<tr '+attr+'><td style="padding-right:'+(10+row.depth*20)+'px"><div class="refrowname">'+(row.kids?'<button class="fold" data-act="row-fold:'+esc(g.id)+'" aria-label="باز و بسته کردن زیرهدف‌ها">'+(rowFold.has(g.id)?'‹':'⌄')+'</button>':'<span class="foldblank">·</span>')+'<span class="type-icon '+cls+'">'+icon+'</span><span class="titletext" title="'+esc(g.name)+'">'+esc(g.name)+'</span></div></td>'+cols.map(([k])=>'<td>'+cell(row,k)+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">موردی یافت نشد.</div>')+'</div>'};
render=function(){refRenderBase();refNav();let top=$('.top');if(top){if(!top.querySelector('[data-act="spark"]'))top.insertAdjacentHTML('beforeend',btn('spark','✧ Spark','secondary'));let label=top.querySelector?.('b');if(label)label.textContent=activeGoal?'جزئیات هدف':page==='goals'?(sub==='kpi'?'تابلوی KPI':sub==='map'?'درخت اهداف':'اهداف فعال'):page==='strategy'?'نقشه استراتژی':page==='home'?'خانه':navs.find(n=>n[0]===page)?.[2]||'به‌پرور'}};
act=function(s){let [a,b,c]=s.split(':');if(a==='spark'){sparkPanel();return}if(a==='org-person'&&cloud){goto('teams','people');profilePerson=b;render();return}if(a==='org-review-refresh'&&cloud){loadOrgReviews();return}if(a==='org-review-new'&&cloud?.role==='admin'){cycleSetup();return}if(a==='org-entry'&&cloud){openAssessment(b);return}if(a==='org-refresh'&&cloud){loadMeetings();return}if(a==='org-open'&&cloud){openOrgMeeting(b);return}if(a==='org-schedule'&&cloud?.role==='admin'){scheduleMeeting(b);return}if(a==='connector'){connectorDetail(Number(b));return}if(a==='ref-nav'){if(b==='users')goto('teams','people');else goto(b);return}if(a==='ref-side'){goto(b,c||undefined);return}if(a==='map-fold'){let k=decodeURIComponent(b);if(mapFold.has(k))mapFold.delete(k);else mapFold.add(k);render();return}if(a==='pillar-fold'){let k='pillar:'+b;if(rowFold.has(k))rowFold.delete(k);else rowFold.add(k);render();return}if(a==='row-fold'){if(rowFold.has(b))rowFold.delete(b);else rowFold.add(b);render();return}if(a==='map-expand'){mapFold.clear();render();return}if(a==='map-collapse'){mapFold=new Set(data.goals.map(g=>'goal:'+g.id));render();return}refActBase(s)};
document.addEventListener('click',e=>{let el=e.target.closest('[data-act^="map-fold:"],[data-act^="row-fold:"],[data-act^="pillar-fold:"]');if(el){e.preventDefault();e.stopImmediatePropagation();act(el.dataset.act)}},true);
render();
</script></body></html>
