<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133168"><title>به‌پرور | سامانه اجرای استراتژی</title>
<style>
@font-face{font-family:Vazirmatn;src:url('../assets/vazirmatn.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--nav:#142b55;--blue:#204a91;--red:#bd2538;--ink:#1b2c42;--muted:#65758a;--line:#e1e6ed;--bg:#f7f9fc;--green:#17805c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.85 Vazirmatn,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #bf2638;outline-offset:3px}button,a{touch-action:manipulation}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 12px;min-height:38px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.danger{color:var(--red)}a{color:var(--blue)}.shell{display:grid;grid-template-columns:72px 224px minmax(0,1fr);min-height:100vh}.rail{background:var(--nav);color:white;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 5px;gap:8px}.mark{width:40px;height:40px;background:white;color:var(--nav);display:grid;place-items:center;font-size:24px;font-weight:900;border-radius:10px;margin-bottom:14px;border-bottom:4px solid var(--red)}.rail button,.rail a{color:#dce6f5;background:none;border:0;text-align:center;width:62px;padding:8px 2px;font-size:10px;text-decoration:none;line-height:1.5;border-radius:8px}.rail button span,.rail a span{display:block;font-size:21px}.rail button.active{background:#ffffff23;color:white}.rail a{margin-top:auto}.side{background:white;border-left:1px solid var(--line);padding:20px 13px;position:sticky;top:0;height:100vh;overflow:auto}.side h2{font-size:16px;margin:0 0 16px}.side button{display:block;width:100%;text-align:right;border:0;background:white;margin:3px 0;padding:8px 12px}.side button.active{background:#eaf0fa;color:var(--blue);font-weight:700}.side small{display:block;color:var(--muted);margin:18px 12px 4px}.main{min-width:0}.top{height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px;position:sticky;top:0;z-index:5}.top b{font-size:17px}.top input{max-width:280px;min-width:0}.content{padding:24px;max-width:1600px;margin:auto}.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.between{justify-content:space-between}.head{margin-bottom:18px}.head h1{margin:0;font-size:24px}.muted,small{color:var(--muted)}.notice{background:#fff7e7;color:#785521;border:1px solid #f1dfb7;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;min-width:0}.panel h2{margin:0 0 10px;font-size:18px}.panel h3{margin:0;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:14px}.metric strong{display:block;font-size:28px;color:var(--nav)}.tag{font-size:12px;padding:2px 7px;border-radius:5px;background:#edf2f8;color:var(--blue);white-space:nowrap}.good{color:var(--green)}.bad{color:var(--red)}.warn{color:#a16c0c}.bar{background:#edf0f4;border-radius:8px;height:7px;min-width:55px;overflow:hidden}.bar i{height:100%;display:block;background:var(--green);border-radius:8px}.tablewrap{overflow:auto}.tablewrap table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:right}th,td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:500;background:#fbfcfe}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f1f5fc}.tname{font-weight:700;white-space:normal;min-width:180px}.map{overflow:auto;padding:14px 8px 28px;min-height:390px}.mapinner{min-width:760px;text-align:center}.rootnode{max-width:460px;margin:auto}.node{border:1px solid #dbe3ef;background:white;border-radius:8px;padding:12px;text-align:right;cursor:pointer;box-shadow:0 2px 5px #172b5510;position:relative;font-size:13px}.node b{display:block;margin:4px 0}.node:hover{border-color:#6386bc}.rootnode .node{text-align:center;border-top:3px solid var(--blue)}.trunk{height:26px;width:1px;background:#aebed3;margin:auto}.branches{display:flex;gap:20px;justify-content:center;position:relative;padding-top:20px}.branches:before{content:'';height:1px;background:#aebed3;position:absolute;top:0;left:12%;right:12%}.branch{flex:1;min-width:170px;max-width:310px;position:relative}.branch:before{content:'';position:absolute;height:20px;width:1px;background:#aebed3;top:-20px;left:50%}.children{display:grid;gap:12px;padding:15px 6px 0;border-right:1px solid #dce3ed;margin-right:12px}.children .node{border-right:3px solid #c3cfe2}.children .node[data-kind=Objective]{border-right-color:var(--blue)}.children .node[data-kind=KPI]{border-right-color:#a16c0c}.filters{margin:12px 0}.action{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}.action:last-child{border:0}input,select,textarea{border:1px solid #ccd6e3;background:white;border-radius:6px;padding:8px 10px;color:var(--ink);width:100%;min-width:0}label{display:block;margin:10px 0 4px;font-weight:600}textarea{min-height:75px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formrow{margin-bottom:8px}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(560px,100%);background:white;box-shadow:0 0 40px #142b5533;z-index:20;overflow:auto;padding:22px}.backdrop{position:fixed;inset:0;background:#142b5555;z-index:19}.drawer h2{font-size:20px;margin:6px 0}.drawer .tabs{border-bottom:1px solid var(--line);margin:15px 0}.timeline{border-right:2px solid var(--line);padding-right:15px;margin:14px 0}.timeline p{margin:8px 0}.check{display:flex;align-items:center;gap:9px}.check input{width:18px}.donut{width:146px;height:146px;border-radius:50%;margin:16px auto;display:grid;place-items:center}.donut>span{width:114px;height:114px;background:white;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:bold}.teamcard{cursor:pointer}.teamcard:hover{border-color:var(--blue)}.empty{padding:25px;text-align:center;color:var(--muted)}.printonly{display:none}@media(max-width:880px){.shell{grid-template-columns:62px minmax(0,1fr)}.side{display:none}.rail{width:62px}.rail button,.rail a{width:54px}.content{padding:12px}.top{padding:0 12px;height:58px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.top input{max-width:130px}.head h1{font-size:20px}.panel{padding:12px}.fields{grid-template-columns:1fr}}@media print{.rail,.side,.top,.no-print,button,.backdrop,.drawer{display:none!important}.shell{display:block}.content{padding:0}.panel{break-inside:avoid}.printonly{display:block}body{background:white;font-size:12pt}.mapinner{min-width:0}.map{overflow:visible}.branches{gap:5px}.branch{min-width:0}.node{font-size:9px}.tablewrap{overflow:visible}td,th{white-space:normal;font-size:10px;padding:5px}}
</style></head><body><div class="shell"><nav class="rail" id="rail"></nav><aside class="side" id="side"></aside><main class="main"><header class="top"><b>به‌پرور | اجرای استراتژی</b><div class="row"><input id="search" placeholder="جستجوی اهداف…" aria-label="جستجو"><button id="export" title="خروجی داده">خروجی</button></div></header><div class="content" id="app"></div></main></div><div id="overlay"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:1}),date=()=>new Date().toISOString().slice(0,10);
const seed={identity:{ultimate:'خلق ارزش پایدار برای مشتریان، کارکنان و کسب‌وکار',mission:'ارائه محصولات و خدمات قابل اعتماد با کیفیت پایدار',vision:'تبدیل شدن به مجموعه‌ای پیشرو در کیفیت، بهره‌وری و رضایت مشتری',values:'کیفیت، مسئولیت‌پذیری، همکاری، یادگیری'},teams:['مدیریت ارشد','تولید','کنترل کیفیت','فروش و بازاریابی','منابع انسانی','مالی','تدارکات و پشتیبانی'],period:'فصل جاری',pillars:[{id:'p1',name:'رشد پایدار و مشتری‌مداری'},{id:'p2',name:'تعالی عملیاتی و کیفیت'},{id:'p3',name:'توسعه سرمایه انسانی'}],goals:[{id:'o1',kind:'Objective',name:'بهبود تجربه مشتری',pillar:'p1',parent:'',team:'فروش و بازاریابی',owner:'مدیر فروش',status:'فعال',description:'کاهش نارضایتی و تقویت وفاداری مشتری',history:[]},{id:'k1',kind:'KR',name:'افزایش رضایت مشتری از ۷۵ به ۹۰ درصد',pillar:'p1',parent:'o1',team:'فروش و بازاریابی',owner:'مدیر فروش',start:75,target:90,current:82,unit:'درصد',status:'فعال',history:[]},{id:'k2',kind:'KPI',name:'نرخ شکایت مشتری',pillar:'p1',parent:'',team:'کنترل کیفیت',owner:'مدیر کیفیت',start:4,target:2,current:3,unit:'درصد',status:'فعال',history:[]},{id:'o2',kind:'Objective',name:'ارتقای بهره‌وری و کیفیت تولید',pillar:'p2',parent:'',team:'تولید',owner:'مدیر تولید',status:'فعال',history:[]},{id:'k3',kind:'KR',name:'کاهش ضایعات تولید از ۵ به ۳ درصد',pillar:'p2',parent:'o2',team:'تولید',owner:'مدیر تولید',start:5,target:3,current:4.1,unit:'درصد',status:'فعال',history:[]},{id:'k4',kind:'KPI',name:'تحویل به‌موقع سفارش',pillar:'p2',parent:'',team:'تدارکات و پشتیبانی',owner:'مسئول برنامه‌ریزی',start:80,target:95,current:87,unit:'درصد',status:'فعال',history:[]},{id:'o3',kind:'Objective',name:'تقویت قابلیت‌های سرپرستان',pillar:'p3',parent:'',team:'منابع انسانی',owner:'مدیر منابع انسانی',status:'فعال',history:[]},{id:'k5',kind:'KR',name:'افزایش تکمیل برنامه توسعه سرپرستان',pillar:'p3',parent:'o3',team:'منابع انسانی',owner:'مدیر منابع انسانی',start:0,target:100,current:60,unit:'درصد',status:'فعال',history:[]}],tasks:[{id:'t1',name:'تحلیل علل ضایعات تولید',goal:'k3',owner:'مدیر تولید',due:'',done:false},{id:'t2',name:'جمع‌آوری بازخورد مشتریان',goal:'k1',owner:'مدیر فروش',due:'',done:false}],meetings:[],reviews:[],peopleReviews:[]};
let data;try{data=JSON.parse(localStorage.getItem('behparvar-strategy-v1'))||structuredClone(seed)}catch{data=structuredClone(seed)}let page='home',sub='',team='',query='',statusFilter='all',openId='';
const save=()=>{try{localStorage.setItem('behparvar-strategy-v1',JSON.stringify(data))}catch{alert('ذخیره محلی ممکن نیست؛ از خروجی پشتیبان استفاده کنید.')}};
const types={Objective:'هدف',KR:'نتیجه کلیدی',KPI:'شاخص عملکرد'},navs=[['home','⌂','خانه'],['strategy','◇','استراتژی'],['goals','◎','اهداف'],['tasks','☑','اقدامات'],['teams','♧','تیم‌ها'],['meetings','▤','جلسات'],['reviews','▥','بازبینی کسب‌وکار'],['people','☆','ارزیابی عملکرد'],['dash','◫','داشبورد'],['settings','⚙','تنظیمات']],subnav={home:[['','مرکز اقدامات']],strategy:[['map','نقشه استراتژی'],['identity','هویت راهبردی']],goals:[['all','اهداف فعال'],['risk','اهداف نیازمند توجه'],['kpi','تابلوی KPI'],['map','نمای درختی'],['closed','اهداف بسته‌شده']],tasks:[['','اقدامات و پروژه‌ها']],teams:[['','همه تیم‌ها']],meetings:[['','جلسات و پیگیری']],reviews:[['','بازبینی دوره‌ای']],people:[['','چرخه ارزیابی']],dash:[['','عملکرد سازمان']],settings:[['','تنظیمات و داده‌ها']]};
function progress(g){if(g.kind==='Objective'){let a=data.goals.filter(x=>x.parent===g.id&&x.kind==='KR');return a.length?a.reduce((s,x)=>s+progress(x),0)/a.length:null}const a=Number(g.start),b=Number(g.target),c=Number(g.current);return [a,b,c].every(Number.isFinite)&&a!==b?Math.max(0,Math.min(100,(c-a)/(b-a)*100)):null}
function bar(p){return p===null?'<small>بدون نتیجه کلیدی</small>':'<div class="row"><div class="bar" style="width:70px"><i style="width:'+p+'%"></i></div><small>'+fa(p)+'٪</small></div>'}
function health(g){let p=progress(g);return g.status==='بسته'?'بسته‌شده':p===null?'تعریف نشده':p>=70?'پیشرفت بالا':p>=40?'نیازمند پیگیری':'پیشرفت پایین'}
function goto(p,s){page=p;sub=s??subnav[p][0][0];team='';query='';$('#search').value='';render();window.scrollTo(0,0)}
function render(){ $('#rail').innerHTML='<div class="mark">ب</div>'+navs.map(n=>'<button data-page="'+n[0]+'" class="'+(page===n[0]?'active':'')+'"><span>'+n[1]+'</span>'+n[2]+'</button>').join('')+'<a href="../"><span>↩</span>اپ آموزش</a>';$('#side').innerHTML='<h2>'+navs.find(n=>n[0]===page)[2]+'</h2><small>نماهای اصلی</small>'+subnav[page].map(n=>'<button data-sub="'+n[0]+'" class="'+(sub===n[0]?'active':'')+'">'+n[1]+'</button>').join('')+'<small>دوره جاری</small><div style="padding:0 12px">'+esc(data.period)+'</div><small>محیط آموزشی مستقل</small>';let views={home, strategy,goals,tasks,teams,meetings:()=>records('meetings'),reviews:()=>records('reviews'),people:()=>records('peopleReviews'),dash,settings};$('#app').innerHTML='<div class="notice">نسخه آموزشی — داده‌های اولیه صرفاً نمونه هستند و اطلاعات رسمی به‌پرور محسوب نمی‌شوند. ذخیره‌سازی در همین مرورگر انجام می‌شود.</div>'+views[page](); }
const heading=(title,desc,button='')=>'<div class="head row between"><div><h1>'+title+'</h1><small>'+desc+'</small></div>'+button+'</div>',panel=(title,body)=>'<section class="panel"><h2>'+title+'</h2>'+body+'</section>',btn=(act,label,cls='primary')=>'<button class="'+cls+'" data-act="'+act+'">'+label+'</button>';
function match(g){return (!query||[g.name,g.owner,g.team,types[g.kind]].join(' ').includes(query))&&(!team||g.team===team)}
function table(list){return '<div class="tablewrap"><table><thead><tr><th>عنوان</th><th>تیم</th><th>مسئول</th><th>پیشرفت</th><th>مقدار فعلی</th><th>هدف</th><th>وضعیت</th></tr></thead><tbody>'+list.map(g=>'<tr data-id="'+esc(g.id)+'"><td class="tname">'+(g.kind==='KR'?'↳ ':'')+'<span class="tag">'+types[g.kind]+'</span> '+esc(g.name)+'</td><td>'+esc(g.team)+'</td><td>'+esc(g.owner)+'</td><td>'+bar(progress(g))+'</td><td>'+ (g.kind==='Objective'?'—':fa(g.current)+' '+esc(g.unit))+'</td><td>'+(g.kind==='Objective'?'—':fa(g.target)+' '+esc(g.unit))+'</td><td>'+health(g)+'</td></tr>').join('')+'</tbody></table>'+(list.length?'':'<div class="empty">موردی یافت نشد.</div>')+'</div>'}
function summary(){let a=data.goals.filter(g=>g.kind==='KR'&&g.status!=='بسته'),p=a.length?a.reduce((s,g)=>s+(progress(g)||0),0)/a.length:0;return '<div class="metrics">'+[['اهداف',data.goals.filter(g=>g.kind==='Objective').length],['نتایج کلیدی',a.length],['شاخص‌های عملکرد',data.goals.filter(g=>g.kind==='KPI').length],['پیشرفت نتایج کلیدی',fa(p)+'٪']].map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+esc(v)+'</strong></div>').join('')+'</div>'}
function home(){return heading('خانه','مرکز اقدامات و مسئولیت‌ها',btn('add-goal','＋ هدف جدید'))+summary()+panel('مرکز اقدامات','<div class="action"><div><b>به‌روزرسانی پیشرفت اهداف</b><br><small>آخرین وضعیت نتایج کلیدی را ثبت کنید.</small></div>'+btn('go-goals','مشاهده اهداف')+'</div><div class="action"><div><b>بازبینی دوره‌ای کسب‌وکار</b><br><small>آموخته‌ها، موانع و تصمیم‌های بعدی</small></div>'+btn('go-reviews','بازبینی')+'</div><div class="action"><div><b>اقدامات باز</b><br><small>'+fa(data.tasks.filter(t=>!t.done).length)+' اقدام تکمیل نشده</small></div>'+btn('go-tasks','پیگیری')+'</div>')+panel('مسئولیت‌ها و اهداف',table(data.goals.filter(g=>g.status!=='بسته'&&match(g))))}
function node(g){return '<div class="node" data-kind="'+g.kind+'" data-id="'+esc(g.id)+'" tabindex="0"><small>'+types[g.kind]+'</small><b>'+esc(g.name)+'</b>'+bar(progress(g))+'<small>'+esc(g.team)+'</small></div>'}
function map(){return '<div class="panel map"><div class="mapinner"><div class="rootnode"><div class="node" data-act="identity"><small>هدف غایی سازمان</small><b>'+esc(data.identity.ultimate)+'</b><small>مأموریت، چشم‌انداز و ارزش‌ها</small></div></div><div class="trunk"></div><div class="branches">'+data.pillars.map(p=>'<div class="branch"><div class="node" data-act="pillar:'+esc(p.id)+'"><small>رکن راهبردی</small><b>'+esc(p.name)+'</b></div><div class="children">'+data.goals.filter(g=>g.pillar===p.id&&!g.parent&&g.status!=='بسته'&&match(g)).map(g=>node(g)+(g.kind==='Objective'?'<div class="children">'+data.goals.filter(k=>k.parent===g.id&&k.status!=='بسته').map(node).join('')+'</div>':'')).join('')+'</div></div>').join('')+'</div></div></div>'}
function strategy(){if(sub==='identity')return heading('هویت راهبردی','از هدف غایی تا ارزش‌های سازمان')+panel('هویت سازمان', '<form id="identityForm">'+Object.entries({ultimate:'هدف غایی',mission:'مأموریت',vision:'چشم‌انداز',values:'ارزش‌ها'}).map(([k,v])=>'<label for="i-'+k+'">'+v+'</label><textarea id="i-'+k+'" name="'+k+'" required>'+esc(data.identity[k])+'</textarea>').join('')+'<button class="primary" style="margin-top:12px">ذخیره هویت راهبردی</button></form>')+panel('ارکان راهبردی',data.pillars.map(p=>'<div class="action"><b>'+esc(p.name)+'</b>'+btn('pillar:'+p.id,'ویرایش','secondary')+'</div>').join('')+btn('add-pillar','＋ رکن جدید'));return heading('نقشه استراتژی','ارتباط هدف غایی، ارکان، OKR و KPI',btn('add-pillar','＋ رکن راهبردی')+' '+btn('add-goal','＋ هدف'))+ '<div class="row filters">'+btn('identity','هویت راهبردی','secondary')+btn('print','چاپ نقشه','secondary')+'</div>'+map()}
function goals(){let list=data.goals.filter(g=>match(g)&&(sub==='closed'?g.status==='بسته':g.status!=='بسته')&&(sub!=='kpi'||g.kind==='KPI')&&(sub!=='risk'||progress(g)!==null&&progress(g)<40));let controls='<div class="row filters"><select id="goalTeam" style="width:auto"><option value="">همه تیم‌ها</option>'+data.teams.map(t=>'<option '+(team===t?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'+['all','risk','kpi','map','closed'].map((s,i)=>'<button data-sub="'+s+'">'+['فهرست','نیازمند توجه','KPI','نقشه','بسته‌شده'][i]+'</button>').join('')+'</div>';if(sub==='map')return heading('نمای درختی اهداف','هم‌راستایی استراتژیک',btn('add-goal','＋ هدف جدید'))+controls+map();if(sub==='kpi')return heading('تابلوی شاخص‌های عملکرد','آخرین مقدار و تاریخچه ثبت‌شده',btn('add-goal','＋ شاخص'))+controls+panel('شاخص‌های عملکرد',table(list))+panel('تاریخچه پایش شاخص‌ها','<div class="tablewrap"><table><thead><tr><th>شاخص</th><th>تاریخ</th><th>مقدار</th><th>یادداشت</th></tr></thead><tbody>'+list.flatMap(g=>(g.history||[]).map(h=>'<tr><td>'+esc(g.name)+'</td><td>'+esc(h.date)+'</td><td>'+fa(h.value)+'</td><td>'+esc(h.note)+'</td></tr>')).join('')+'</tbody></table></div>');return heading(sub==='risk'?'اهداف نیازمند توجه':sub==='closed'?'اهداف بسته‌شده':'اهداف فعال','مدیریت اهداف، نتایج کلیدی و شاخص‌ها',btn('add-goal','＋ افزودن هدف'))+controls+panel('فهرست اهداف',table(list))}
function tasks(){return heading('اقدامات و پروژه‌ها','اقدامات مرتبط با تحقق اهداف',btn('add-task','＋ اقدام جدید'))+panel('فهرست اقدامات',data.tasks.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'><span>'+esc(t.name)+'<br><small>'+esc(t.owner)+' | '+esc(data.goals.find(g=>g.id===t.goal)?.name||'بدون هدف')+' | '+esc(t.due||'بدون موعد')+'</small></span></label>'+btn('task:'+t.id,'ویرایش','secondary')+'</div>').join('')||'<div class="empty">اقدامی ثبت نشده است.</div>')}
function teams(){return heading('تیم‌ها','مسئولیت و هم‌راستایی واحدها',btn('add-team','＋ تیم جدید'))+'<div class="grid">'+data.teams.map(t=>'<section class="panel teamcard"><h2>'+esc(t)+'</h2><small>'+fa(data.goals.filter(g=>g.team===t).length)+' هدف و شاخص</small><div style="margin-top:12px"><button data-team="'+esc(t)+'">مشاهده اهداف تیم</button></div></section>').join('')+'</div>'}
const recNames={meetings:'جلسات',reviews:'بازبینی کسب‌وکار',peopleReviews:'ارزیابی عملکرد'},recFields={meetings:[['name','عنوان جلسه'],['owner','شرکت‌کنندگان'],['due','تاریخ جلسه'],['notes','دستور جلسه و نکات گفت‌وگو'],['next','تصمیم‌ها و اقدامات بعدی']],reviews:[['name','عنوان دوره بازبینی'],['owner','مسئول / تیم'],['due','تاریخ بازبینی'],['notes','نتایج، موانع و آموخته‌ها'],['next','تصمیم‌ها و اولویت‌های دوره بعد']],peopleReviews:[['name','عنوان چرخه یا نام فرد'],['owner','ارزیاب / مشارکت‌کنندگان'],['due','مهلت'],['notes','شواهد عملکرد و بازخورد'],['next','برنامه رشد و پیگیری']]};
function records(k){return heading(recNames[k],'ثبت، مرور و پیگیری',btn('record:'+k,'＋ ثبت جدید'))+panel('سوابق',data[k].map(r=>'<div class="action"><div><b>'+esc(r.name)+'</b><br><small>'+esc(r.owner)+' | '+esc(r.due||'بدون تاریخ')+'</small><p>'+esc(r.notes||'')+'</p></div>'+btn('record:'+k+':'+r.id,'مشاهده / ویرایش','secondary')+'</div>').join('')||'<div class="empty">هنوز موردی ثبت نشده است.</div>')}
function dash(){let a=data.goals.filter(g=>g.kind==='KR'&&g.status!=='بسته'),avg=a.length?a.reduce((s,g)=>s+(progress(g)||0),0)/a.length:0;return heading('داشبورد عملکرد','نمای مدیریتی پیشرفت و وضعیت اهداف',btn('print','چاپ گزارش'))+summary()+'<div class="grid">'+panel('پیشرفت نتایج کلیدی','<div class="donut" style="background:conic-gradient(#204a91 '+avg+'%,#e9edf4 0)"><span>'+fa(avg)+'٪</span></div><div class="muted" style="text-align:center">میانگین ساده پیشرفت نتایج کلیدی فعال</div>')+panel('وضعیت اهداف',a.map(g=>'<div class="action"><span>'+esc(g.name)+'</span>'+bar(progress(g))+'</div>').join(''))+'</div>'+panel('عملکرد تیم‌ها',data.teams.map(t=>{let x=a.filter(g=>g.team===t),p=x.length?x.reduce((s,g)=>s+(progress(g)||0),0)/x.length:null;return '<div class="action"><b>'+esc(t)+'</b>'+bar(p)+'</div>'}).join(''))+panel('آخرین ثبت‌های پیشرفت',data.goals.flatMap(g=>(g.history||[]).map(h=>({...h,name:g.name}))).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,12).map(h=>'<div class="action"><span>'+esc(h.name)+' | '+esc(h.date)+'</span><b>'+fa(h.value)+'</b></div>').join('')||'<div class="empty">پس از به‌روزرسانی اهداف، سوابق در اینجا نمایش داده می‌شود.</div>')}
function settings(){return heading('تنظیمات','مدیریت دوره، داده‌ها و پشتیبان')+panel('دوره زمانی','<form id="periodForm"><label>عنوان دوره</label><input name="period" value="'+esc(data.period)+'" required><button class="primary" style="margin-top:12px">ذخیره</button></form>')+panel('پشتیبان و گزارش','<div class="row">'+btn('download','خروجی JSON')+btn('csv','خروجی CSV')+btn('print','چاپ / ذخیره PDF','secondary')+'</div><label>بازیابی فایل پشتیبان JSON</label><input type="file" id="import" accept=".json,application/json"><p class="muted">بازیابی، داده‌های فعلی همین مرورگر را جایگزین می‌کند.</p>')+panel('محدودیت محیط آموزشی','<p>این نسخه بدون حساب کاربری و سرور اشتراکی است. همگام‌سازی کاربران، مجوزها، اعلان‌ها، اتصال سازمانی و دستیار هوش مصنوعی در این نسخه فعال نیستند.</p>'+btn('reset','بازگردانی نمونه آموزشی','danger'))}
function drawer(title,body){$('#overlay').innerHTML='<div class="backdrop" data-act="close"></div><section class="drawer" role="dialog" aria-modal="true"><div class="row between"><h2>'+title+'</h2>'+btn('close','بستن ×','secondary')+'</div>'+body+'</section>'}
function field(k,label,value='',type='text'){return '<div class="formrow"><label>'+label+'</label><input name="'+k+'" type="'+type+'" value="'+esc(value)+'" '+(k==='name'?'required':'')+' '+(type==='number'?'step="any" required':'')+'></div>'}
function options(k,label,items,value){return '<label>'+label+'</label><select name="'+k+'">'+items.map(([v,l])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'}
function goalForm(g={}){drawer(g.id?'ویرایش هدف':'افزودن هدف', '<form id="goalForm" data-id="'+esc(g.id||'')+'">'+field('name','عنوان',g.name)+options('kind','نوع',Object.entries(types),g.kind||'Objective')+options('pillar','رکن راهبردی',data.pillars.map(p=>[p.id,p.name]),g.pillar||data.pillars[0]?.id)+options('parent','هدف بالادست (برای نتیجه کلیدی)',[['','بدون هدف بالادست'],...data.goals.filter(x=>x.kind==='Objective'&&x.id!==g.id).map(x=>[x.id,x.name])],g.parent||'')+options('team','تیم',data.teams.map(t=>[t,t]),g.team||data.teams[0])+field('owner','مسئول',g.owner)+'<div class="fields" id="numeric">'+field('start','مقدار مبنا',g.start??0,'number')+field('target','مقدار هدف',g.target??100,'number')+field('current','مقدار فعلی',g.current??0,'number')+field('unit','واحد',g.unit||'درصد')+'</div>'+field('due','موعد',g.due,'date')+'<label>شرح</label><textarea name="description">'+esc(g.description||'')+'</textarea><button class="primary" style="margin-top:14px">ذخیره هدف</button></form>')}
function detail(id){let g=data.goals.find(x=>x.id===id);if(!g)return;openId=id;let p=progress(g);drawer(esc(g.name),'<div class="row"><span class="tag">'+types[g.kind]+'</span><span class="tag">'+esc(g.status)+'</span><small>'+esc(g.team)+' | '+esc(g.owner)+'</small></div><div class="tabs row">'+btn('edit:'+id,'ویرایش','secondary')+btn('close-goal:'+id,g.status==='بسته'?'بازگشایی هدف':'بستن هدف','secondary')+'</div>'+panel('پیشرفت',bar(p)+(g.kind==='Objective'?'<p class="muted">پیشرفت هدف از میانگین نتایج کلیدی آن محاسبه می‌شود.</p>':'<form id="updateProgress" data-id="'+id+'">'+field('current','مقدار فعلی',g.current,'number')+'<label>توضیح تغییر و موانع</label><textarea name="note"></textarea><button class="primary">ثبت پیشرفت</button></form>'))+panel('شرح و هم‌راستایی','<p>'+esc(g.description||'بدون شرح')+'</p><small>'+esc(data.pillars.find(x=>x.id===g.pillar)?.name||'')+'</small>')+(g.kind==='Objective'?panel('نتایج کلیدی',table(data.goals.filter(x=>x.parent===id))+btn('add-kr:'+id,'＋ نتیجه کلیدی')):'')+panel('اقدامات مرتبط',data.tasks.filter(t=>t.goal===id).map(t=>'<div class="action">'+esc(t.name)+'<small>'+(t.done?'تکمیل شده':'باز')+'</small></div>').join('')+btn('add-task:'+id,'＋ اقدام'))+panel('فعالیت‌ها و سوابق','<div class="timeline">'+(g.history||[]).slice().reverse().map(h=>'<p>'+esc(h.date)+' | '+fa(h.value)+' — '+esc(h.note)+'</p>').join('')+'</div>')+(g.closeNote?panel('آموخته‌های اختتام',esc(g.closeNote)):'')+btn('delete-goal:'+id,'حذف هدف','danger'))}
function taskForm(t={}){drawer('اقدام / پروژه','<form id="taskForm" data-id="'+esc(t.id||'')+'">'+field('name','عنوان اقدام',t.name)+options('goal','هدف مرتبط',[['','بدون هدف'],...data.goals.map(g=>[g.id,g.name])],t.goal||'')+field('owner','مسئول',t.owner)+field('due','موعد',t.due,'date')+'<button class="primary">ذخیره</button></form>'+(t.id?btn('delete-task:'+t.id,'حذف','danger'):''))}
function recordForm(k,id){let r=data[k].find(x=>x.id===id)||{};drawer(recNames[k],'<form id="recordForm" data-kind="'+k+'" data-id="'+esc(id||'')+'">'+recFields[k].map(([key,label])=>['notes','next'].includes(key)?'<label>'+label+'</label><textarea name="'+key+'">'+esc(r[key]||'')+'</textarea>':field(key,label,r[key],key==='due'?'date':'text')).join('')+'<button class="primary">ذخیره</button></form>'+(id?btn('delete-record:'+k+':'+id,'حذف','danger'):''))}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function act(s){const [a,b,c]=s.split(':');if(a==='close'){$('#overlay').innerHTML='';return}if(a==='identity'){goto('strategy','identity');return}if(a==='go-goals'){goto('goals');return}if(a==='go-reviews'){goto('reviews');return}if(a==='go-tasks'){goto('tasks');return}if(a==='print'){window.print();return}if(a==='download'){download('behparvar-strategy.json',JSON.stringify(data,null,2),'application/json');return}if(a==='csv'){let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('behparvar-goals.csv','\ufeff'+[['عنوان','نوع','تیم','مسئول','مبنا','هدف','فعلی','واحد','پیشرفت'],...data.goals.map(g=>[g.name,types[g.kind],g.team,g.owner,g.start,g.target,g.current,g.unit,progress(g)])].map(r=>r.map(q).join(',')).join('\n'),'text/csv');return}if(a==='reset'){if(confirm('داده‌های فعلی حذف و نمونه جایگزین شود؟')){data=structuredClone(seed);save();render()}return}if(a==='add-goal'){goalForm({kind:sub==='kpi'?'KPI':'Objective'});return}if(a==='edit'){goalForm(data.goals.find(g=>g.id===b));return}if(a==='add-kr'){let g=data.goals.find(x=>x.id===b);goalForm({kind:'KR',parent:b,pillar:g.pillar,team:g.team,owner:g.owner});return}if(a==='add-task'||a==='task'){taskForm(a==='task'?data.tasks.find(t=>t.id===b):{goal:b});return}if(a==='delete-task'){if(confirm('حذف شود؟')){data.tasks=data.tasks.filter(t=>t.id!==b);save();act('close');render()}return}if(a==='record'){recordForm(b,c);return}if(a==='delete-record'){if(confirm('حذف شود؟')){data[b]=data[b].filter(r=>r.id!==c);save();act('close');render()}return}if(a==='add-pillar'||a==='pillar'){let p=data.pillars.find(x=>x.id===b);drawer('رکن راهبردی','<form id="pillarForm" data-id="'+esc(b||'')+'">'+field('name','عنوان رکن',p?.name)+'<button class="primary">ذخیره</button></form>');return}if(a==='add-team'){drawer('تیم جدید','<form id="teamForm">'+field('name','نام تیم')+'<button class="primary">ذخیره</button></form>');return}if(a==='delete-goal'){if(data.goals.some(g=>g.parent===b)||data.tasks.some(t=>t.goal===b)){alert('ابتدا نتایج یا اقدامات مرتبط را منتقل یا حذف کنید.');return}if(confirm('هدف حذف شود؟')){data.goals=data.goals.filter(g=>g.id!==b);save();act('close');render()}return}if(a==='close-goal'){let g=data.goals.find(x=>x.id===b);if(g.status==='بسته'){g.status='فعال';save();render();detail(b);return}drawer('اختتام هدف','<form id="closeForm" data-id="'+b+'"><label>ارزیابی و آموخته‌ها</label><textarea name="note" required></textarea><label>گام بعدی</label><textarea name="next"></textarea><button class="primary">ثبت و بستن هدف</button></form>')}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-sub],[data-act],[data-id],[data-team]');if(!el)return;if(el.tagName==='FORM')return;let d=el.dataset;if(d.page)goto(d.page);else if('sub' in d){sub=d.sub;render()}else if(d.act)act(d.act);else if(d.team){goto('goals','all');team=d.team;render()}else if(d.id)detail(d.id)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')act('close');if(e.key==='Enter'&&e.target.matches('.node[data-id]'))detail(e.target.dataset.id)});
document.addEventListener('change',async e=>{let x=e.target;if(x.id==='goalTeam'){team=x.value;render()}if(x.dataset.task){let t=data.tasks.find(t=>t.id===x.dataset.task);if(t){t.done=x.checked;save();render()}}if(x.id==='import'&&x.files[0]){try{let v=JSON.parse(await x.files[0].text());if(!v.identity||!Array.isArray(v.goals)||!Array.isArray(v.pillars)||!Array.isArray(v.teams)||!['tasks','meetings','reviews','peopleReviews'].every(k=>Array.isArray(v[k])))throw Error();if(confirm('داده‌های جاری جایگزین شوند؟')){data=v;save();render()}}catch{alert('فایل پشتیبان معتبر نیست.')}}});
document.addEventListener('submit',e=>{let f=e.target;if(!f.id)return;e.preventDefault();let v=Object.fromEntries(new FormData(f)),id=f.dataset.id;if(f.id==='identityForm')data.identity=v;else if(f.id==='periodForm')data.period=v.period;else if(f.id==='goalForm'){if(v.kind==='KR'){let p=data.goals.find(g=>g.id===v.parent&&g.kind==='Objective');if(!p){alert('برای نتیجه کلیدی یک هدف بالادست انتخاب کنید.');return}v.pillar=p.pillar}else v.parent='';if(v.kind!=='Objective'&&Number(v.start)===Number(v.target)){alert('مقدار هدف و مبنا باید متفاوت باشند.');return}if(id&&v.kind!=='Objective'&&data.goals.some(x=>x.parent===id)){alert('هدف دارای نتیجه کلیدی است؛ نوع آن قابل تغییر نیست.');return}let old=data.goals.find(g=>g.id===id);let g={...old,...v,id:id||uid(),status:old?.status||'فعال',history:old?.history||[]};['start','target','current'].forEach(k=>g[k]=Number(v[k]));if(old){Object.assign(old,g);data.goals.filter(x=>x.parent===id).forEach(x=>x.pillar=g.pillar)}else data.goals.push(g)}else if(f.id==='updateProgress'){let g=data.goals.find(x=>x.id===id);g.current=Number(v.current);g.history.push({date:date(),value:g.current,note:v.note});save();render();detail(id);return}else if(f.id==='closeForm'){let g=data.goals.find(x=>x.id===id);g.status='بسته';g.closeNote=v.note+' | گام بعدی: '+v.next}else if(f.id==='taskForm'){let t=data.tasks.find(x=>x.id===id);if(t)Object.assign(t,v);else data.tasks.push({...v,id:uid(),done:false})}else if(f.id==='recordForm'){let list=data[f.dataset.kind],r=list.find(x=>x.id===id);if(r)Object.assign(r,v);else list.push({...v,id:uid()})}else if(f.id==='pillarForm'){let p=data.pillars.find(x=>x.id===id);if(p)Object.assign(p,v);else data.pillars.push({...v,id:uid()})}else if(f.id==='teamForm'){if(!data.teams.includes(v.name))data.teams.push(v.name)}save();act('close');render()});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();if(page!=='goals'){page='goals';sub='all'}render()});$('#export').addEventListener('click',()=>act('download'));render();
</script>
<style>
:root{--blue:#168acf;--nav:#182941;--line:#e8edf2;--bg:#f8fafc;--ink:#28384b}
body{font-size:14px;line-height:1.7}.shell{grid-template-columns:64px 205px minmax(0,1fr)}.rail{gap:4px;padding-top:10px}.rail button{font-size:10px;min-height:44px;width:56px}.rail button span{font-size:19px}.top{height:52px;padding:0 18px}.side{padding:15px 10px;background:#fbfcfe}.side button{font-size:13px;min-height:34px;padding:5px 9px}.content{padding:19px}.head h1{font-size:22px}.panel{border-radius:7px;padding:16px;box-shadow:0 1px 2px #18294106}.panel h2{font-size:16px}.notice{font-size:12px;padding:6px 10px}.metric strong{font-size:24px}.goalworkspace{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:14px;align-items:start}.goalworkspace .panel{margin-bottom:12px}.detailtitle{font-size:22px;margin:8px 0}.tabline{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:14px}.tabline button{border:0;border-radius:0;background:transparent;color:var(--muted)}.tabline button.selected{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:700}.tiny{font-size:12px}.pill{display:inline-block;border-radius:12px;padding:2px 8px;background:#eff4f9;color:#48647b;font-size:12px}.goalrow{display:flex;gap:6px;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#96a4b6;flex:none}.dot.green{background:#20af81}.dot.red{background:#e15d63}.dot.orange{background:#e5ad48}.avatar{width:30px;height:30px;border-radius:50%;background:#e2eaf4;color:#345478;display:inline-grid;place-items:center;font-weight:700;flex:none}.activity{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.activity p{margin:0}.goalchart{width:100%;height:auto;display:block;max-height:210px}.period-board th,.period-board td{text-align:center;min-width:83px}.period-board th:first-child,.period-board td:first-child{text-align:right;position:sticky;right:0;background:white;min-width:195px;z-index:1}.period-board tr:nth-child(2n) td{background:#fafbfc}.period-board tr:nth-child(2n) td:first-child{background:#fafbfc}.period-board .current{background:#e6f4fe}.modal{width:min(560px,calc(100% - 24px));max-height:90vh;overflow:auto;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;z-index:21;border-radius:9px;padding:22px;box-shadow:0 15px 70px #18294133}.modal h2{font-size:18px;margin:0 0 10px}.star{color:#da9826;font-size:25px;min-width:36px;background:transparent;border:0;padding:0}.star.dim{color:#cbd5e1}.actionline{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:center}.actionline:last-child{border:0}.actionline>div{flex:1}.actionicon{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#e5f5ef;color:#16805e}.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.integration{min-height:130px;border:1px solid var(--line);padding:14px;border-radius:7px;background:white}.integration p{color:var(--muted);font-size:12px}.chartlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.profilehead{display:flex;gap:12px;align-items:center;margin-bottom:15px}.profilehead .avatar{width:50px;height:50px;font-size:22px}.subtle{background:#fafbfd}.mobiletabs{display:none}@media(max-width:880px){.shell{grid-template-columns:62px minmax(0,1fr)}.goalworkspace{grid-template-columns:1fr}.cardgrid{grid-template-columns:1fr}.mobiletabs{display:flex;gap:4px;overflow:auto;margin-bottom:10px}.mobiletabs button{white-space:nowrap}.content{padding:10px}}@media print{.goalworkspace{display:block}.modal{display:none}.mobiletabs{display:none}}
</style>
<script>
/* Expanded reference-based workspace. All values are local, not a connected enterprise tenant. */
let activeGoal='',detailTab='aligned',boardFreq='monthly',boardOffset=0,profilePerson='',teamProfile='',homeTab='goals',showColumns={team:true,owner:true,progress:true,actual:true,target:true,status:true,due:true},filterOwner='';
const baseRender=render,baseGoto=goto,baseAct=act,baseGoals=goals,baseSettings=settings,baseDash=dash,baseTeams=teams,baseHome=home;
const persons=()=>[...new Set(data.goals.map(g=>g.owner).concat(data.tasks.map(t=>t.owner)).filter(Boolean))];
const av=n=>'<span class="avatar">'+esc((n||'؟').trim().slice(0,1))+'</span>';
function extended(){data.templates??={description:'',learning:'چه آموختیم؟',next:'گام‌های بعدی چیست؟',progress:'چه چیزی تغییر کرده است؟'};data.userReviews??=[];data.dashboardConfig??={trend:true,status:true,teams:true};data.goals.forEach(g=>{g.history??=[];g.comments??=[];g.confidence??='نامشخص';g.measurement??='manual';g.goalType??='متعهدانه'});}
extended();
subnav.goals.push(['templates','قالب‌های اهداف']);subnav.settings.push(['integrations','یکپارچه‌سازی‌ها']);subnav.teams.push(['people','افراد']);
goto=function(p,s){activeGoal='';teamProfile='';profilePerson='';filterOwner='';baseGoto(p,s)};
render=function(){extended();baseRender();if(activeGoal&&data.goals.some(g=>g.id===activeGoal))$('#app').innerHTML=goalPage(data.goals.find(g=>g.id===activeGoal));if(page==='teams'&&profilePerson)$('#app').innerHTML=personPage(profilePerson);else if(page==='teams'&&teamProfile)$('#app').innerHTML=teamPage(teamProfile);let side=subnav[page];if(side&&side.length>1&&!activeGoal)$('#app').insertAdjacentHTML('afterbegin','<div class="mobiletabs no-print">'+side.map(n=>'<button data-sub="'+n[0]+'">'+n[1]+'</button>').join('')+'</div>')};
function trend(points,target){let a=points.map(x=>Number(x.value)).filter(Number.isFinite);if(!a.length)return '<div class="empty">هنوز سابقه‌ای برای نمودار ثبت نشده است.</div>';let all=Number.isFinite(target)?a.concat(target):a,lo=Math.min(...all),hi=Math.max(...all);if(lo===hi){hi+=1;lo-=1}const X=i=>38+i*462/Math.max(1,a.length-1),Y=v=>145-(v-lo)*115/(hi-lo);let lines=[0,1,2,3,4].map(i=>'<line x1="38" y1="'+(30+i*28.75)+'" x2="500" y2="'+(30+i*28.75)+'" stroke="#e5eaf0"/><text x="31" y="'+(34+i*28.75)+'" text-anchor="end" font-size="10" fill="#697b8c">'+fa(hi-i*(hi-lo)/4)+'</text>').join('');return '<svg class="goalchart" viewBox="0 0 530 175" role="img" aria-label="نمودار روند مقادیر" direction="ltr">'+lines+(Number.isFinite(target)?'<line x1="38" y1="'+Y(target)+'" x2="500" y2="'+Y(target)+'" stroke="#e3a33b" stroke-dasharray="5 4"/>':'')+'<polyline points="'+a.map((v,i)=>X(i)+','+Y(v)).join(' ')+'" fill="none" stroke="#168acf" stroke-width="2.5"/>'+a.map((v,i)=>'<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="3" fill="#168acf"/>').join('')+'</svg><div class="row between tiny muted"><span>'+esc(points[0]?.date||'')+'</span><span>'+esc(points.at(-1)?.date||'')+'</span></div>'}
function statusDot(g){return '<span class="dot '+(g.confidence==='در مسیر'?'green':g.confidence==='خارج از مسیر'?'red':g.confidence==='در معرض ریسک'?'orange':'')+'"></span>'}
function goalPage(g){let p=progress(g),children=data.goals.filter(x=>x.parent===g.id),ts=data.tasks.filter(t=>t.goal===g.id),hist=(g.history||[]).map(h=>({...h,type:'progress'})).concat((g.comments||[]).map(h=>({...h,type:'comment'}))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));let tabs='<div class="tabline">'+[['aligned','اهداف هم‌راستا'],['tasks','اقدامات'],['history','روند و سوابق']].map(([k,n])=>'<button data-act="detail-tab:'+k+'" class="'+(detailTab===k?'selected':'')+'">'+n+'</button>').join('')+'</div>';
let content=detailTab==='tasks'?panel('اقدامات مرتبط',ts.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label>'+btn('task:'+t.id,'ویرایش','secondary')+'</div>').join('')+btn('add-task:'+g.id,'＋ اقدام جدید')):detailTab==='history'?panel('روند پیشرفت',g.kind==='Objective'?'<p>پیشرفت هدف بر مبنای نتایج کلیدی محاسبه می‌شود.</p>':trend(g.history,Number(g.target))):panel('اهداف هم‌راستا',(g.parent?'<div class="action"><small>هدف بالادست</small><button data-id="'+esc(g.parent)+'">'+esc(data.goals.find(x=>x.id===g.parent)?.name||'')+'</button></div>':'')+table(children)+(g.kind==='Objective'?btn('add-kr:'+g.id,'＋ نتیجه کلیدی'):''));
return '<div class="row between"><button data-act="back-goals">بازگشت به اهداف</button><small>کاوش / نقشه استراتژی / '+esc(types[g.kind])+'</small></div><h1 class="detailtitle">'+esc(g.name)+'</h1><div class="row" style="margin-bottom:14px"><span class="pill">'+types[g.kind]+'</span><span class="pill">'+esc(g.status)+'</span><span class="pill">'+esc(data.period)+'</span><span class="pill">'+esc(g.goalType)+'</span>'+btn('edit:'+g.id,'ویرایش','secondary')+btn('close-goal:'+g.id,g.status==='بسته'?'بازگشایی':'اختتام هدف','secondary')+'</div><div class="goalworkspace"><div>'+tabs+content+panel('فعالیت‌ها','<form id="goalComment" data-id="'+g.id+'"><textarea name="note" placeholder="افزودن نظر یا یادداشت…" required></textarea><button class="primary">ثبت نظر</button></form>'+hist.map(h=>'<div class="activity">'+av(g.owner)+'<div><b>'+esc(g.owner||'کاربر محلی')+'</b> <small>'+esc(h.date)+'</small><p>'+(h.type==='progress'?'پیشرفت را به '+fa(h.value)+' '+esc(g.unit)+' به‌روزرسانی کرد. ':'')+esc(h.note||'')+'</p></div></div>').join(''))+'</div><aside>'+panel('پیشرفت','<div class="row">'+statusDot(g)+'<span>'+esc(g.confidence)+'</span></div><div style="font-size:30px;font-weight:700">'+(p===null?'—':fa(p)+'٪')+'</div>'+bar(p)+(g.kind!=='Objective'?'<p class="tiny">مقدار فعلی: <b>'+fa(g.current)+' '+esc(g.unit)+'</b><br>هدف: '+fa(g.target)+' '+esc(g.unit)+'</p>'+btn('checkin:'+g.id,'به‌روزرسانی پیشرفت')+' '+btn('measure:'+g.id,'روش پایش','secondary'):'')+'<p class="tiny muted">آخرین ثبت: '+esc(g.history.at(-1)?.date||'ثبت نشده')+'</p>')+panel('توضیحات',esc(g.description||'بدون شرح'))+panel('افراد و مسئولیت‌ها','<div class="row">'+av(g.owner)+'<div>'+esc(g.owner)+'<br><small>مسئول هدف</small></div></div><p class="tiny">'+esc(g.team)+'</p><button data-act="person:'+encodeURIComponent(g.owner||'')+'">پروفایل مسئول</button>')+panel('زمان‌بندی','<small>دوره: '+esc(data.period)+'<br>موعد: '+esc(g.due||'تعیین نشده')+'</small>')+(g.closeNote?panel('آموخته‌های اختتام',esc(g.closeNote)):'')+'</aside></div>'}
detail=function(id){if(!data.goals.some(g=>g.id===id))return;act('close');activeGoal=id;detailTab='aligned';render();window.scrollTo(0,0)};
function modal(title,content){$('#overlay').innerHTML='<div class="backdrop" data-act="close"></div><section class="modal" role="dialog" aria-modal="true"><div class="row between"><h2>'+title+'</h2><button data-act="close">×</button></div>'+content+'</section>'}
function boardDate(offset){let now=new Date(), d=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(boardFreq==='weekly'){d.setDate(d.getDate()-((d.getDay()+1)%7)+offset*7);return d}if(boardFreq==='monthly')return new Date(now.getFullYear(),now.getMonth()+offset,1);if(boardFreq==='quarterly')return new Date(now.getFullYear(),Math.floor(now.getMonth()/3)*3+offset*3,1);return new Date(now.getFullYear()+offset,0,1)}
const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function kpiBoard(list){let cols=Array.from({length:8},(_,i)=>i-6+boardOffset),labels=cols.map(i=>new Intl.DateTimeFormat('fa-IR',{year:'2-digit',month:'short',...(boardFreq==='weekly'?{day:'numeric'}:{})}).format(boardDate(i)));let rows=list.map(g=>'<tr data-id="'+g.id+'"><td rowspan="2"><span class="tag">KPI</span> '+esc(g.name)+'</td><td>واقعی</td>'+cols.map(i=>{let a=iso(boardDate(i)),b=iso(boardDate(i+1)),h=g.history.filter(h=>h.date>=a&&h.date<b).sort((x,y)=>x.date.localeCompare(y.date)).at(-1);return '<td class="'+(i===0?'current':'')+'">'+(h?fa(h.value):'—')+'</td>'}).join('')+'</tr><tr><td>هدف جاری</td>'+cols.map(i=>'<td>'+(i===0?fa(g.target):'—')+'</td>').join('')+'</tr>').join('');return panel('تابلوی دوره‌ای شاخص‌ها','<div class="row filters">'+[['weekly','هفتگی'],['monthly','ماهانه'],['quarterly','فصلی'],['annual','سالانه']].map(([k,n])=>'<button class="'+(k===boardFreq?'primary':'')+'" data-act="freq:'+k+'">'+n+'</button>').join('')+btn('board-prev','قبلی','secondary')+btn('board-now','امروز','secondary')+btn('board-next','بعدی','secondary')+'</div><div class="tablewrap period-board"><table><thead><tr><th>شاخص</th><th>نوع</th>'+labels.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div><p class="tiny muted">فقط مقادیر ثبت‌شده در هر بازه نمایش داده می‌شوند. هدف جاری به گذشته تعمیم داده نشده است.</p>')}
const oldTable=table;
table=function(list){const cols=[['team','تیم'],['owner','مسئول'],['progress','پیشرفت'],['actual','فعلی'],['target','هدف'],['due','موعد'],['status','وضعیت']].filter(([k])=>showColumns[k]);let ordered=[];list.filter(g=>!g.parent||!list.some(x=>x.id===g.parent)).forEach(g=>{ordered.push(g);if(g.kind==='Objective')ordered.push(...list.filter(x=>x.parent===g.id))});const cell=(g,k)=>k==='team'?esc(g.team):k==='owner'?'<div class="goalrow">'+av(g.owner)+esc(g.owner)+'</div>':k==='progress'?bar(progress(g)):k==='actual'?(g.kind==='Objective'?'—':fa(g.current)+' '+esc(g.unit)):k==='target'?(g.kind==='Objective'?'—':fa(g.target)+' '+esc(g.unit)):k==='due'?esc(g.due||'—'):statusDot(g)+' '+esc(g.status==='بسته'?'بسته':g.confidence);return '<div class="tablewrap"><table><thead><tr><th>نام هدف</th>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+ordered.map(g=>'<tr data-id="'+g.id+'"><td class="tname" style="padding-right:'+(g.parent?30:10)+'px"><span class="tag">'+types[g.kind]+'</span> '+esc(g.name)+'</td>'+cols.map(([k])=>'<td>'+cell(g,k)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'+(ordered.length?'':'<div class="empty">موردی یافت نشد.</div>')+'</div>'};
goals=function(){if(sub==='templates')return heading('قالب‌های اهداف','استانداردسازی تعریف، ثبت پیشرفت و اختتام')+panel('قالب‌ها','<form id="templateForm">'+Object.entries({description:'شرح OKR',learning:'آموخته‌های اختتام',next:'گام‌های بعدی',progress:'ثبت پیشرفت'}).map(([k,n])=>'<label>'+n+'</label><textarea name="'+k+'">'+esc(data.templates[k])+'</textarea>').join('')+'<button class="primary">ذخیره قالب‌ها</button></form>');if(sub==='kpi'){let list=data.goals.filter(g=>g.kind==='KPI'&&g.status!=='بسته'&&match(g));return heading('تابلوی KPI','پایش دوره‌ای عملکرد',btn('add-goal','＋ شاخص جدید'))+kpiBoard(list)+panel('آخرین وضعیت',table(list))}return baseGoals().replace('<div class="row filters">','<div class="row filters">'+btn('display','تنظیم نمایش','secondary'))};
home=function(){let items=homeTab==='tasks'?data.tasks.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label>'+esc(t.owner)+'</div>').join(''):homeTab==='teams'?data.teams.map(t=>'<div class="action"><button data-act="team-profile:'+encodeURIComponent(t)+'">'+esc(t)+'</button></div>').join(''):homeTab==='reviews'?data.userReviews.map(r=>'<div class="action"><b>'+esc(r.name)+'</b><small>'+esc(r.notes)+'</small></div>').join(''):table(data.goals.filter(g=>g.status!=='بسته'&&match(g)));return '<div class="profilehead">'+av('مدیر')+'<div><h1 style="font-size:20px;margin:0">به محیط مدیریت به‌پرور خوش آمدید</h1><small>نمای کاری شما</small></div></div>'+panel('مرکز اقدامات','<div class="actionline"><span class="actionicon">↗</span><div><b>پیشرفت اهداف را به اشتراک بگذارید</b><br><small>ثبت آخرین وضعیت شاخص‌ها و نتایج کلیدی</small></div>'+btn('go-goals','ثبت پیشرفت')+'</div><div class="actionline"><span class="actionicon">✓</span><div><b>مرور هفتگی خود را ثبت کنید</b><br><small>موفقیت‌ها، موانع و برنامه هفته بعد</small></div>'+btn('weekly-review','ثبت مرور')+'</div>')+panel('مسئولیت‌های من','<div class="tabline">'+[['goals','اهداف'],['tasks','اقدامات'],['teams','تیم‌ها'],['reviews','مرورهای من']].map(([k,n])=>'<button class="'+(homeTab===k?'selected':'')+'" data-act="home-tab:'+k+'">'+n+'</button>').join('')+'</div>'+items)};
function teamPage(t){let g=data.goals.filter(x=>x.team===t);return '<div class="profilehead">'+av(t)+'<div><h1 style="margin:0">'+esc(t)+'</h1><small>تیم / اهداف / اعضا</small></div></div>'+panel('بازبینی تیم',btn('record:reviews','ثبت بازبینی'))+panel('اهداف تیم',table(g))+panel('اعضا',[...new Set(g.map(x=>x.owner).filter(Boolean))].map(n=>'<div class="action"><div class="row">'+av(n)+esc(n)+'</div>'+btn('person:'+encodeURIComponent(n),'مشاهده پروفایل','secondary')+'</div>').join(''))}
function personPage(n){return '<div class="profilehead">'+av(n)+'<div><h1 style="margin:0">'+esc(n)+'</h1><small>پروفایل مسئول / نمای محلی</small></div></div>'+panel('اهداف و مسئولیت‌ها',table(data.goals.filter(g=>g.owner===n)))+panel('اقدامات',data.tasks.filter(t=>t.owner===n).map(t=>'<div class="action">'+esc(t.name)+'<span>'+ (t.done?'تکمیل شده':'باز')+'</span></div>').join(''))+panel('جلسات و بازخورد',btn('record:meetings','ثبت جلسه')+' '+btn('record:peopleReviews','ثبت ارزیابی'))}
teams=function(){if(sub==='people')return heading('افراد','مسئولیت‌ها و پرونده عملکرد')+panel('افراد',persons().map(n=>'<div class="action"><div class="row">'+av(n)+esc(n)+'</div>'+btn('person:'+encodeURIComponent(n),'پروفایل','secondary')+'</div>').join(''));return heading('همه تیم‌ها','تیم، مسئول و اهداف فعال',btn('add-team','＋ تیم جدید'))+panel('فهرست تیم‌ها','<div class="tablewrap"><table><thead><tr><th>تیم</th><th>اعضا</th><th>اهداف فعال</th><th>پیشرفت OKR</th></tr></thead><tbody>'+data.teams.map(t=>{let a=data.goals.filter(g=>g.team===t&&g.status!=='بسته'),k=a.filter(g=>g.kind==='KR');return '<tr><td><button data-act="team-profile:'+encodeURIComponent(t)+'">'+esc(t)+'</button></td><td>'+fa(new Set(a.map(g=>g.owner).filter(Boolean)).size)+'</td><td>'+fa(a.length)+'</td><td>'+bar(k.length?k.reduce((s,g)=>s+(progress(g)||0),0)/k.length:null)+'</td></tr>'}).join('')+'</tbody></table></div>')};
dash=function(){let list=data.goals.filter(g=>g.kind==='KR'&&g.status!=='بسته'),dates=[...new Set(list.flatMap(g=>g.history.map(h=>h.date)))].sort(),points=dates.map(d=>{let vals=list.map(g=>{let h=g.history.filter(h=>h.date<=d).sort((a,b)=>a.date.localeCompare(b.date)).at(-1);return h?progress({...g,current:h.value}):null}).filter(v=>v!==null);return {date:d,value:vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:0}});let cfg=data.dashboardConfig;return heading('داشبورد عملکرد','تحلیل اهداف و نتایج کلیدی',btn('dashboard-config','ویرایش داشبورد','secondary')+' '+btn('print','چاپ'))+summary()+'<div class="grid">'+(cfg.trend?panel('روند پیشرفت OKR',trend(points,100)+'<small>میانگین نتایج دارای سابقه ثبت تا هر تاریخ</small>'):'')+(cfg.status?panel('اهداف بر اساس وضعیت',['در مسیر','در معرض ریسک','خارج از مسیر','نامشخص'].map(n=>{let count=list.filter(g=>g.confidence===n).length;return '<div class="action">'+n+' '+bar(list.length?count/list.length*100:0)+' '+fa(count)+'</div>'}).join('')):'')+'</div>'+(cfg.teams?panel('عملکرد تیم‌ها',data.teams.map(t=>{let a=list.filter(g=>g.team===t);return '<div class="action">'+esc(t)+bar(a.length?a.reduce((s,g)=>s+(progress(g)||0),0)/a.length:null)+'</div>'}).join('')):'')};
settings=function(){if(sub==='integrations')return heading('یکپارچه‌سازی‌ها','اتصال به ابزارهای سازمانی')+'<div class="notice">هیچ اتصال بیرونی در نسخه محلی فعال نیست. کارت‌ها صرفاً دامنه قابلیت‌های موردنیاز را نشان می‌دهند.</div><div class="cardgrid">'+['API','Asana','Azure DevOps','Excel Online','Google Sheets','Google Calendar','HubSpot','Microsoft Teams','Slack','ChatGPT','Claude','Microsoft Copilot'].map(n=>'<div class="integration"><h3 dir="ltr">'+n+'</h3><p>نیازمند اتصال امن، احراز هویت و پیکربندی سرور</p><span class="pill">متصل نیست</span></div>').join('')+'</div>';return baseSettings()+panel('قالب‌ها و اتصالات',btn('templates','قالب‌های اهداف','secondary')+' '+btn('integrations','یکپارچه‌سازی‌ها','secondary'))};
act=function(s){let [a,b]=s.split(':');let g=data.goals.find(x=>x.id===b);if(a==='back-goals'){activeGoal='';goto('goals','all');return}if(a==='detail-tab'){detailTab=b;render();return}if(a==='home-tab'){homeTab=b;render();return}if(a==='freq'){boardFreq=b;boardOffset=0;render();return}if(a==='board-prev'||a==='board-next'||a==='board-now'){boardOffset=a==='board-now'?0:boardOffset+(a==='board-prev'?-1:1);render();return}if(a==='person'){if(!b)return;goto('teams','people');profilePerson=decodeURIComponent(b);render();return}if(a==='team-profile'){goto('teams');teamProfile=decodeURIComponent(b);render();return}if(a==='templates'){goto('goals','templates');return}if(a==='integrations'){goto('settings','integrations');return}if(a==='display'){modal('تنظیم نمایش اهداف','<form id="displayForm">'+Object.entries({team:'تیم',owner:'مسئول',progress:'پیشرفت',actual:'مقدار فعلی',target:'هدف',due:'موعد',status:'وضعیت'}).map(([k,n])=>'<label class="check"><input type="checkbox" name="'+k+'" '+(showColumns[k]?'checked':'')+'>'+n+'</label>').join('')+'<button class="primary">اعمال</button></form>');return}if(a==='dashboard-config'){modal('تنظیم داشبورد','<form id="dashboardForm">'+[['trend','روند پیشرفت'],['status','وضعیت اهداف'],['teams','عملکرد تیم‌ها']].map(([k,n])=>'<label class="check"><input type="checkbox" name="'+k+'" '+(data.dashboardConfig[k]?'checked':'')+'>'+n+'</label>').join('')+'<button class="primary">ذخیره</button></form>');return}if(a==='checkin'&&g){modal('به‌روزرسانی پیشرفت','<form id="checkinForm" data-id="'+g.id+'">'+field('current','مقدار فعلی',g.current,'number')+options('confidence','وضعیت / اطمینان',[['در مسیر','در مسیر'],['در معرض ریسک','در معرض ریسک'],['خارج از مسیر','خارج از مسیر'],['نامشخص','نامشخص']],g.confidence)+'<label>'+esc(data.templates.progress)+'</label><textarea name="note"></textarea><button class="primary">ثبت پیشرفت</button></form>');return}if(a==='measure'&&g){modal('روش پایش','<form id="measureForm" data-id="'+g.id+'">'+options('measurement','منبع مقدار',[['manual','ثبت دستی'],['aligned','اهداف هم‌راستا (فقط برای هدف)'],['integration','اتصال بیرونی (غیرفعال)']],g.measurement)+'<p class="muted">ثبت دستی تنها روش فعال برای نتایج و شاخص‌های عددی است.</p><button class="primary">ذخیره</button></form>');return}if(a==='close-goal'&&g&&g.status!=='بسته'){modal('اختتام هدف','<form id="closeEnhanced" data-id="'+g.id+'"><p>'+esc(g.name)+'</p><label>کیفیت اجرا از یک تا پنج</label>'+options('rating','امتیاز',[1,2,3,4,5].map(n=>[String(n),'★'.repeat(n)+' '+fa(n)]),'3')+options('outcome','نتیجه اختتام',[['محقق شد','محقق شد'],['تا حدی محقق شد','تا حدی محقق شد'],['محقق نشد','محقق نشد'],['متوقف شد','متوقف شد']],'')+'<label>'+esc(data.templates.learning)+'</label><textarea name="learning" required></textarea><label>'+esc(data.templates.next)+'</label><textarea name="next"></textarea><button class="primary">ثبت و بستن هدف</button></form>');return}if(a==='weekly-review'){modal('مرور هفتگی','<form id="weeklyForm">'+field('name','عنوان هفته',data.period)+'<label>دستاوردها و موانع</label><textarea name="notes" required></textarea><label>اولویت هفته بعد</label><textarea name="next"></textarea><button class="primary">ثبت مرور</button></form>');return}baseAct(s)};
document.addEventListener('submit',e=>{let f=e.target,ids=['goalComment','checkinForm','measureForm','closeEnhanced','weeklyForm','templateForm','displayForm','dashboardForm'];if(!ids.includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();let v=Object.fromEntries(new FormData(f)),g=data.goals.find(x=>x.id===f.dataset.id);if(f.id==='goalComment'&&g)g.comments.push({date:date(),note:v.note});if(f.id==='checkinForm'&&g){g.current=Number(v.current);g.confidence=v.confidence;g.history.push({date:date(),value:g.current,note:v.note,confidence:g.confidence})}if(f.id==='measureForm'&&g){if(v.measurement!=='manual'){alert('این روش در نسخه محلی برای شاخص عددی فعال نیست.');return}g.measurement=v.measurement}if(f.id==='closeEnhanced'&&g){g.status='بسته';g.rating=Number(v.rating);g.outcome=v.outcome;g.closeNote=v.outcome+' | '+v.learning+' | گام بعدی: '+v.next;g.closedAt=date()}if(f.id==='weeklyForm')data.userReviews.push({...v,id:uid(),date:date()});if(f.id==='templateForm')data.templates=v;if(f.id==='displayForm')Object.keys(showColumns).forEach(k=>showColumns[k]=!!v[k]);if(f.id==='dashboardForm')Object.keys(data.dashboardConfig).forEach(k=>data.dashboardConfig[k]=!!v[k]);save();act('close');render()},true);
document.addEventListener('click',e=>{let t=e.target.closest('[data-sub]');if(t){activeGoal='';profilePerson='';teamProfile=''}},true);
render();
</script>
<style>
.meetinglayout{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:15px}.meetinglayout h3{margin:14px 0 7px}.meetinglayout .action{padding:8px 0}.reviewcard{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.reviewcard>div:nth-child(2){flex:1}.reviewcard:last-child{border:0}.inlineform{display:flex;align-items:center;gap:7px;margin-top:8px}.inlineform input,.inlineform select{flex:1}.inlineform button{flex:none}.reviewform{max-width:760px;margin:auto}.reviewform .panel{padding:23px}.reviewform label{margin-top:14px}.checklist{max-height:240px;overflow:auto;border:1px solid var(--line);padding:7px 12px;border-radius:6px}.checklist label{display:flex;align-items:center;gap:9px;font-weight:400;margin:7px 0}.checklist input{width:18px}.statechip{font-size:12px;border-radius:5px;padding:3px 8px;background:#e8f3fd;color:#217eb3;white-space:nowrap}.statechip.done{background:#e5f5ec;color:#218052}.timeline2{border-right:2px solid #dfe6ef;padding-right:14px}.timeline2 .action{position:relative}.timeline2 .action:before{content:'';height:8px;width:8px;border:2px solid white;background:#8cb5d3;border-radius:50%;position:absolute;right:-20px;top:19px}.personselector{max-width:230px}.orgtree{display:grid;gap:10px}.orgnode{margin-right:16px;border-right:1px solid #d7e1ed;padding-right:15px}.goalhealth{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.reviewrating{display:flex;gap:5px;flex-wrap:wrap}.reviewrating label{font-weight:400;display:flex;gap:4px;align-items:center}.reviewrating input{width:17px}.counter{background:#e5effa;color:#18669d;border-radius:20px;padding:1px 8px;font-size:12px}.sensitive{background:#fff7e6;border:1px solid #f2dfb6;padding:8px;border-radius:6px;font-size:12px;color:#735c2e}@media(max-width:880px){.meetinglayout{grid-template-columns:1fr}.reviewcard{flex-wrap:wrap}.inlineform{flex-wrap:wrap}.reviewform .panel{padding:12px}}
</style>
<script>
let meetingId='',cycleId='',entryId='',bizId='',focusPerson='',workflowMode='',teamEditId='';
const renderV2=render,gotoV2=goto,actV2=act,homeV2=home,teamsV2=teams,personPageV2=personPage;
function ensureV3(){data.oneOnOnes??=[];data.cycles??=[];data.reviewEntries??=[];data.teamMeta??={};data.businessCycles??=[];data.peopleMeta??={};data.tasks.forEach(t=>{t.meetingId??='';t.description??=''});}
ensureV3();
subnav.meetings=[['one','جلسات یک‌به‌یک'],['','همه جلسات']];
subnav.reviews=[['business','بازبینی کسب‌وکار'],['','سوابق بازبینی']];
subnav.people=[['my','ارزیابی‌های من'],['cycles','چرخه‌های ارزیابی'],['','سوابق ارزیابی']];
subnav.teams.push(['org','ساختار سازمانی']);
function clearV3(){meetingId='';cycleId='';entryId='';bizId='';workflowMode='';teamEditId=''}
goto=function(p,s){clearV3();gotoV2(p,s)};
const ownerOptions=()=>persons().map(n=>[n,n]);
const teamOptions=()=>data.teams.map(n=>[n,n]);
function recordStatus(v){return '<span class="statechip '+(v==='تکمیل‌شده'||v==='منتشرشده'||v==='بسته'?'done':'')+'">'+esc(v)+'</span>'}
const personLabel=n=>'<div class="row">'+av(n)+esc(n)+'</div>';
function viewMeetings(){if(workflowMode==='meeting-new')return meetingForm();if(meetingId){let m=data.oneOnOnes.find(x=>x.id===meetingId);if(m)return meetingView(m)}return heading('جلسات یک‌به‌یک','گفت‌وگو، پیگیری و هم‌راستایی با اهداف',btn('meeting-new','＋ جلسه جدید'))+panel('جلسات پیش رو',data.oneOnOnes.filter(x=>x.status!=='تکمیل‌شده').map(meetingCard).join('')||'<div class="empty">جلسه‌ای برنامه‌ریزی نشده است.</div>')+panel('جلسات گذشته',data.oneOnOnes.filter(x=>x.status==='تکمیل‌شده').map(meetingCard).join('')||'<div class="empty">جلسه تکمیل‌شده‌ای وجود ندارد.</div>')}
function meetingCard(m){return '<div class="reviewcard">'+av(m.participant)+'<div><b>'+esc(m.name)+'</b><br><small>'+esc(m.manager)+' و '+esc(m.participant)+' | '+esc(m.date||'بدون تاریخ')+'</small></div>'+recordStatus(m.status)+btn('meeting-open:'+m.id,'مشاهده','secondary')+'</div>'}
function meetingForm(){return '<div class="reviewform">'+heading('جلسه جدید','برنامه‌ریزی گفت‌وگوی یک‌به‌یک')+panel('اطلاعات جلسه','<form id="meetingCreate">'+field('name','عنوان جلسه','جلسه یک‌به‌یک')+options('manager','مدیر',ownerOptions(),persons()[0])+options('participant','همکار',ownerOptions(),persons()[1])+field('date','تاریخ',date(),'date')+field('time','ساعت','','time')+options('repeat','تکرار',[['none','بدون تکرار'],['weekly','هفتگی'],['biweekly','دو هفته یک‌بار'],['monthly','ماهانه']],'none')+'<p class="tiny muted">تناوب برای برنامه‌ریزی ثبت می‌شود؛ ایجاد خودکار جلسات و ارسال دعوت‌نامه در نسخه محلی فعال نیست.</p><label>دستور جلسه</label><textarea name="agenda"></textarea><div class="row" style="margin-top:15px"><button class="primary">ایجاد جلسه</button><button type="button" data-act="meeting-list">انصراف</button></div></form>')+'</div>'}
function meetingView(m){let ts=data.tasks.filter(t=>t.meetingId===m.id),gs=data.goals.filter(g=>g.owner===m.participant&&g.status!=='بسته');return '<div class="row between"><button data-act="meeting-list">بازگشت به جلسات</button>'+recordStatus(m.status)+'</div><div class="head"><h1>'+esc(m.name)+'</h1><div class="row">'+personLabel(m.manager)+personLabel(m.participant)+'<span class="pill">'+esc(m.date)+' '+esc(m.time)+'</span>'+btn('meeting-next:'+m.id,'برنامه‌ریزی جلسه بعدی','secondary')+'</div></div><div class="meetinglayout"><div>'+panel('موضوعات گفت‌وگو',m.agenda?'<p class="muted">'+esc(m.agenda)+'</p>':'')+panel('Talking points',m.points.map(p=>'<div class="action"><label class="check"><input type="checkbox" data-meetpoint="'+p.id+'" '+(p.done?'checked':'')+'>'+esc(p.text)+'</label>'+btn('point-delete:'+p.id,'×','secondary')+'</div>').join('')+'<form id="pointAdd" class="inlineform"><input name="text" placeholder="موضوع جدید…" required><button class="primary">افزودن</button></form>')+panel('اقدامات جلسه',ts.map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label><small>'+esc(t.owner)+' | '+esc(t.due||'بدون موعد')+'</small>'+btn('task:'+t.id,'ویرایش','secondary')+'</div>').join('')+'<form id="meetingTask" class="inlineform"><input name="name" placeholder="اقدام پیگیری…" required><select name="owner">'+[m.manager,m.participant].map(n=>'<option>'+esc(n)+'</option>').join('')+'</select><input name="due" type="date" title="موعد"><button class="primary">افزودن</button></form>')+panel('یادداشت جلسه','<form id="meetingNote"><textarea name="notes" placeholder="یادداشت‌های مشترک جلسه">'+esc(m.notes||'')+'</textarea><button class="primary">ذخیره یادداشت</button></form>')+panel('یادداشت شخصی','<div class="sensitive">محیط آموزشی محلی است؛ محرمانگی واقعی در برابر سایر کاربران یا دارندگان همین دستگاه تضمین نمی‌شود. اطلاعات حساس وارد نکنید.</div><form id="privateNote"><textarea name="notes" placeholder="یادداشت تمرینی شخصی">'+esc(m.privateNotes||'')+'</textarea><button class="primary">ذخیره</button></form>')+'<div class="row">'+btn('meeting-finish:'+m.id,m.status==='تکمیل‌شده'?'بازگشایی جلسه':'تکمیل جلسه')+'</div></div><aside>'+panel('اهداف '+esc(m.participant),gs.map(g=>'<div class="action"><div><button data-id="'+g.id+'">'+esc(g.name)+'</button>'+bar(progress(g))+'</div></div>').join('')||'<div class="empty">هدف فعالی ندارد.</div>')+panel('مرورهای پیشین',data.reviewEntries.filter(e=>e.person===m.participant&&e.status==='تکمیل‌شده').map(e=>'<div class="action">'+esc(data.cycles.find(c=>c.id===e.cycle)?.name||'ارزیابی')+'</div>').join('')||'<small>موردی ثبت نشده است.</small>')+'</aside></div>'}
function cycleCard(c){let a=data.reviewEntries.filter(e=>e.cycle===c.id),done=a.filter(e=>e.status==='تکمیل‌شده').length;return '<div class="reviewcard"><div class="avatar">★</div><div><b>'+esc(c.name)+'</b><br><small>موعد '+esc(c.deadline||'—')+' | '+fa(done)+' از '+fa(a.length)+' ارزیابی تکمیل شده</small>'+bar(a.length?done/a.length*100:0)+'</div>'+recordStatus(c.status)+btn('cycle-open:'+c.id,'مشاهده','secondary')+'</div>'}
function cycleForm(){let people=persons();return '<div class="reviewform">'+heading('چرخه ارزیابی جدید','تعریف دوره، دسترسی و مشارکت‌کنندگان')+'<form id="cycleCreate">'+panel('اطلاعات پایه',field('name','عنوان چرخه','')+'<label>توضیحات</label><textarea name="description"></textarea>'+field('deadline','مهلت تکمیل','','date')+options('repeat','تناوب',[['none','بدون تکرار'],['quarterly','فصلی'],['annual','سالانه']],'none'))+panel('دسترسی و ارزیابی',options('mode','روش ارزیابی',[['self-manager','خودارزیابی و مدیر مستقیم'],['self','فقط خودارزیابی'],['manager','فقط ارزیابی مدیر']],'self-manager')+options('reviewer','ارزیاب مسئول',[['','انتخاب ارزیاب'],...ownerOptions()],'')+'<p class="sensitive">انتخاب افراد در این نسخه آموزشی فقط یک تنظیم فرایندی است؛ ارسال اعلان، تکرار خودکار و مجوز دسترسی واقعی اعمال نمی‌شود. خودارزیابی و بازخورد مدیر در یک پرونده محلی ثبت می‌شوند.</p>')+panel('مشارکت‌کنندگان','<div class="checklist">'+people.map(n=>'<label><input type="checkbox" name="participant" value="'+esc(n)+'">'+av(n)+esc(n)+'</label>').join('')+'</div>')+'<div class="row"><button class="primary">شروع چرخه</button><button type="button" data-act="cycles-list">انصراف</button></div></form></div>'}
function cycleView(c){let a=data.reviewEntries.filter(e=>e.cycle===c.id);return heading(esc(c.name),'چرخه ارزیابی عملکرد',btn('cycles-list','بازگشت','secondary')+' '+btn('cycle-close:'+c.id,c.status==='بسته'?'بازگشایی':'بستن چرخه'))+panel('اطلاعات دوره','<div class="row">'+recordStatus(c.status)+'<span class="pill">مهلت: '+esc(c.deadline||'—')+'</span><span class="pill">'+esc(c.reviewer||'خودارزیابی')+'</span></div><p>'+esc(c.description)+'</p>')+panel('مشارکت‌کنندگان',a.map(e=>'<div class="reviewcard">'+av(e.person)+'<div><b>'+esc(e.person)+'</b><br><small>'+esc(e.mode==='self'?'خودارزیابی':e.reviewer)+'</small></div>'+recordStatus(e.status)+btn('entry-open:'+e.id,'مشاهده / تکمیل')+'</div>').join('')||'<div class="empty">مشارکت‌کننده‌ای وجود ندارد.</div>')}
function entryView(e){let c=data.cycles.find(x=>x.id===e.cycle),closed=c?.status==='بسته';return '<div class="reviewform">'+heading('ارزیابی '+esc(e.person),esc(c?.name||''),btn('entry-back','بازگشت','secondary'))+panel('اهداف و شواهد عملکرد',table(data.goals.filter(g=>g.owner===e.person)))+'<form id="entryForm">'+panel('بازتاب عملکرد','<label>دستاوردها و شواهد</label><textarea name="achievements">'+esc(e.achievements||'')+'</textarea><label>موانع و فرصت‌های بهبود</label><textarea name="challenges">'+esc(e.challenges||'')+'</textarea><label>برنامه توسعه و گام‌های بعدی</label><textarea name="development">'+esc(e.development||'')+'</textarea>'+options('rating','ارزیابی کلی',[['','انتخاب کنید'],['1','۱ — نیازمند بهبود جدی'],['2','۲ — پایین‌تر از انتظار'],['3','۳ — مطابق انتظار'],['4','۴ — بالاتر از انتظار'],['5','۵ — عملکرد برجسته']],e.rating||''))+ (c?.mode!=='self'?panel('بازخورد مدیر','<label>بازخورد و شواهد ارزیاب</label><textarea name="managerFeedback">'+esc(e.managerFeedback||'')+'</textarea>'):'')+ (closed||e.status==='تکمیل‌شده'?'<p class="sensitive">این ارزیابی بسته یا تکمیل شده است؛ برای اصلاح، چرخه را بازگشایی کنید و ارزیابی را به پیش‌نویس برگردانید.</p>'+(!closed?btn('entry-reopen:'+e.id,'بازگشایی ارزیابی','secondary'):''):'<div class="row"><button type="submit" name="intent" value="draft">ذخیره پیش‌نویس</button><button type="submit" name="intent" value="complete" class="primary">تکمیل ارزیابی</button></div>')+'</form></div>'}
function viewPeopleReviews(){if(entryId){let e=data.reviewEntries.find(x=>x.id===entryId);if(e)return entryView(e)}if(workflowMode==='cycle-new')return cycleForm();if(cycleId){let c=data.cycles.find(x=>x.id===cycleId);if(c)return cycleView(c)}if(sub==='cycles')return heading('چرخه‌های ارزیابی','مدیریت دوره‌های ارزیابی',btn('cycle-new','＋ چرخه جدید'))+panel('چرخه‌ها',data.cycles.map(cycleCard).join('')||'<div class="empty">چرخه‌ای ایجاد نشده است.</div>');let people=persons(),list=data.reviewEntries.filter(e=>!focusPerson||e.person===focusPerson||e.reviewer===focusPerson);const cards=a=>a.map(e=>'<div class="reviewcard">'+av(e.person)+'<div><b>'+esc(e.person)+'</b><br><small>'+esc(data.cycles.find(c=>c.id===e.cycle)?.name||'ارزیابی')+'</small></div>'+recordStatus(e.status)+btn('entry-open:'+e.id,e.status==='تکمیل‌شده'?'مشاهده':'شروع')+'</div>').join('')||'<div class="empty">موردی وجود ندارد.</div>';return heading('ارزیابی‌های من','ارزیابی‌های نیازمند اقدام و سوابق',btn('cycles-list','چرخه‌ها','secondary'))+'<div class="row filters"><label for="reviewPerson">نمای آموزشی فرد</label><select id="reviewPerson" class="personselector"><option value="">همه افراد</option>'+people.map(n=>'<option '+(focusPerson===n?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'+panel('نیازمند اقدام',cards(list.filter(e=>e.status!=='تکمیل‌شده')))+panel('ارزیابی‌های گذشته',cards(list.filter(e=>e.status==='تکمیل‌شده')))}
function snapshotTable(list){return '<div class="tablewrap"><table><thead><tr><th>هدف / شاخص</th><th>تیم</th><th>مسئول</th><th>پیشرفت ثبت‌شده</th><th>مقدار ثبت‌شده</th><th>هدف</th></tr></thead><tbody>'+list.map(g=>'<tr><td class="tname">'+esc(g.name)+'</td><td>'+esc(g.team)+'</td><td>'+esc(g.owner)+'</td><td>'+bar(Object.hasOwn(g,'frozenProgress')?g.frozenProgress:g.kind==='Objective'?null:progress(g))+'</td><td>'+(g.kind==='Objective'?'—':fa(g.current)+' '+esc(g.unit))+'</td><td>'+(g.kind==='Objective'?'—':fa(g.target)+' '+esc(g.unit))+'</td></tr>').join('')+'</tbody></table></div>'}
function bizForm(){return '<div class="reviewform">'+heading('بازبینی کسب‌وکار جدید','بازبینی عملکرد دوره‌ای سازمان و تیم')+panel('تعریف بازبینی','<form id="bizCreate">'+field('name','عنوان بازبینی','بازبینی '+data.period)+options('team','دامنه',[['','کل سازمان'],...teamOptions()],'')+field('date','تاریخ بازبینی',date(),'date')+field('period','دوره',data.period)+'<button class="primary">ایجاد بازبینی</button></form>')+'</div>'}
function bizView(b){let list=data.goals.filter(g=>!b.team||g.team===b.team),snapshot=b.snapshot||null;return heading(esc(b.name),esc(b.period)+' | '+esc(b.team||'کل سازمان'),btn('biz-list','بازگشت','secondary')+' '+btn('print','چاپ گزارش','secondary'))+panel('نمای عملکرد',snapshot?'<div class="notice">مقادیر این گزارش در زمان نهایی‌سازی ثبت شده‌اند.</div>'+snapshotTable(snapshot):table(list))+panel('تحلیل و تصمیم‌ها','<form id="bizUpdate"><label>چه چیزی طبق برنامه پیش رفت؟</label><textarea name="wins">'+esc(b.wins||'')+'</textarea><label>انحراف‌ها و موانع اصلی</label><textarea name="risks">'+esc(b.risks||'')+'</textarea><label>آموخته‌ها و تصمیم‌های مدیریتی</label><textarea name="decisions">'+esc(b.decisions||'')+'</textarea><label>اولویت دوره بعد</label><textarea name="next">'+esc(b.next||'')+'</textarea>'+(b.status==='منتشرشده'?'<p class="muted">گزارش نهایی شده است.</p>':'<div class="row"><button name="intent" value="draft">ذخیره پیش‌نویس</button><button name="intent" value="complete" class="primary">نهایی‌سازی بازبینی</button></div>')+'</form>')+panel('اقدامات پیگیری',data.tasks.filter(t=>t.businessId===b.id).map(t=>'<div class="action"><label class="check"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'>'+esc(t.name)+'</label><small>'+esc(t.owner)+' | '+esc(t.due||'—')+'</small></div>').join('')+'<form id="bizTask" class="inlineform"><input name="name" placeholder="اقدام پیگیری" required><select name="owner">'+ownerOptions().map(([n])=>'<option>'+esc(n)+'</option>').join('')+'</select><input name="due" type="date"><button class="primary">افزودن</button></form>')}
function viewBusiness(){if(workflowMode==='biz-new')return bizForm();if(bizId){let b=data.businessCycles.find(x=>x.id===bizId);if(b)return bizView(b)}return heading('بازبینی کسب‌وکار','از عملکرد تا تصمیم و اقدام',btn('biz-new','＋ بازبینی جدید'))+panel('بازبینی‌ها',data.businessCycles.map(b=>'<div class="reviewcard">'+av(b.team||'سازمان')+'<div><b>'+esc(b.name)+'</b><br><small>'+esc(b.period)+' | '+esc(b.date)+' | '+esc(b.team||'کل سازمان')+'</small></div>'+recordStatus(b.status)+btn('biz-open:'+b.id,'مشاهده','secondary')+'</div>').join('')||'<div class="empty">بازبینی ایجاد نشده است.</div>')}
function orgNode(t,seen=[]){if(seen.includes(t))return '';let m=data.teamMeta[t]||{},kids=data.teams.filter(n=>data.teamMeta[n]?.parent===t);return '<div class="orgnode"><div class="action"><div><b>'+esc(t)+'</b><br><small>'+esc(m.lead||'مسئول تعیین نشده')+'</small></div>'+btn('team-meta:'+encodeURIComponent(t),'ویرایش','secondary')+'</div>'+kids.map(n=>orgNode(n,[...seen,t])).join('')+'</div>'}
teams=function(){if(sub==='org'){let roots=data.teams.filter(t=>!data.teams.includes(data.teamMeta[t]?.parent));return heading('ساختار سازمانی','تیم‌ها، مدیران و ارتباط سلسله‌مراتبی',btn('add-team','＋ تیم'))+panel('درخت سازمان','<div class="orgtree">'+roots.map(t=>orgNode(t)).join('')+'</div>')}return teamsV2()};
render=function(){ensureV3();renderV2();if(activeGoal)return;let extra='';if(page==='meetings'&&sub==='one')extra=viewMeetings();if(page==='people'&&sub!=='')extra=viewPeopleReviews();if(page==='reviews'&&sub==='business')extra=viewBusiness();if(extra){$('#app').innerHTML='<div class="notice">محیط آموزشی محلی؛ داده‌های این دستگاه، نه سامانه رسمی منابع انسانی.</div>'+extra;let side=subnav[page];$('#app').insertAdjacentHTML('afterbegin','<div class="mobiletabs no-print">'+side.map(n=>'<button data-sub="'+n[0]+'">'+n[1]+'</button>').join('')+'</div>')}};
home=function(){let base=homeV2(),pending=data.reviewEntries.filter(e=>e.status!=='تکمیل‌شده').length,upcoming=data.oneOnOnes.filter(m=>m.status!=='تکمیل‌شده').length;return base+panel('پیگیری‌های سازمانی','<div class="actionline"><span class="actionicon">▤</span><div><b>جلسات یک‌به‌یک</b><br><small>'+fa(upcoming)+' جلسه باز</small></div>'+btn('open-meetings','مشاهده','secondary')+'</div><div class="actionline"><span class="actionicon">☆</span><div><b>ارزیابی‌های نیازمند اقدام</b><br><small>'+fa(pending)+' ارزیابی باز</small></div>'+btn('open-reviews','مشاهده','secondary')+'</div>')};
personPage=function(n){return personPageV2(n)+panel('جلسات یک‌به‌یک',data.oneOnOnes.filter(m=>m.manager===n||m.participant===n).map(meetingCard).join('')||'<div class="empty">جلسه‌ای ثبت نشده است.</div>')+panel('ارزیابی‌های عملکرد',data.reviewEntries.filter(e=>e.person===n).map(e=>'<div class="action"><b>'+esc(data.cycles.find(c=>c.id===e.cycle)?.name||'ارزیابی')+'</b>'+recordStatus(e.status)+btn('entry-open:'+e.id,'مشاهده','secondary')+'</div>').join('')||'<div class="empty">ارزیابی‌ای ثبت نشده است.</div>')};
act=function(s){let [a,b]=s.split(':');if(a==='open-meetings'){goto('meetings','one');return}if(a==='open-reviews'){goto('people','my');return}if(a==='meeting-new'){goto('meetings','one');workflowMode='meeting-new';render();return}if(a==='meeting-list'){goto('meetings','one');return}if(a==='meeting-open'){goto('meetings','one');meetingId=b;render();return}if(a==='meeting-finish'){let m=data.oneOnOnes.find(x=>x.id===b);if(m){m.status=m.status==='تکمیل‌شده'?'برنامه‌ریزی‌شده':'تکمیل‌شده';save();render()}return}if(a==='point-delete'){let m=data.oneOnOnes.find(x=>x.id===meetingId);if(m&&confirm('موضوع حذف شود؟')){m.points=m.points.filter(p=>p.id!==b);save();render()}return}if(a==='meeting-next'){let m=data.oneOnOnes.find(x=>x.id===b);if(!m)return;modal('برنامه‌ریزی جلسه بعدی','<form id="meetingNext" data-id="'+b+'">'+field('date','تاریخ','','date')+field('time','ساعت',m.time,'time')+'<button class="primary">ایجاد جلسه بعد</button></form>');return}if(a==='cycles-list'){goto('people','cycles');return}if(a==='cycle-new'){goto('people','cycles');workflowMode='cycle-new';render();return}if(a==='cycle-open'){goto('people','cycles');cycleId=b;render();return}if(a==='cycle-close'){let c=data.cycles.find(x=>x.id===b);if(c){if(c.status!=='بسته'&&data.reviewEntries.some(e=>e.cycle===b&&e.status!=='تکمیل‌شده')&&!confirm('ارزیابی‌های ناتمام وجود دارد. چرخه بسته شود؟'))return;c.status=c.status==='بسته'?'فعال':'بسته';save();render()}return}if(a==='entry-open'){goto('people','my');entryId=b;render();return}if(a==='entry-back'){let e=data.reviewEntries.find(x=>x.id===entryId);if(e&&e.cycle){goto('people','cycles');cycleId=e.cycle;render()}else goto('people','my');return}if(a==='entry-reopen'){let e=data.reviewEntries.find(x=>x.id===b);if(e&&data.cycles.find(c=>c.id===e.cycle)?.status!=='بسته'){e.status='پیش‌نویس';save();render()}return}if(a==='biz-new'){goto('reviews','business');workflowMode='biz-new';render();return}if(a==='biz-list'){goto('reviews','business');return}if(a==='biz-open'){goto('reviews','business');bizId=b;render();return}if(a==='team-meta'){let t=decodeURIComponent(b),m=data.teamMeta[t]||{};modal('تنظیم تیم '+esc(t),'<form id="teamMetaForm" data-team="'+esc(t)+'">'+options('lead','مدیر تیم',[['','تعیین نشده'],...ownerOptions()],m.lead||'')+options('parent','تیم بالادست',[['','بدون بالادست'],...teamOptions().filter(([n])=>n!==t)],m.parent||'')+'<button class="primary">ذخیره</button></form>');return}actV2(s)};
document.addEventListener('click',e=>{if(e.target.closest('[data-sub]'))clearV3()},true);
document.addEventListener('change',e=>{let x=e.target;if(x.id==='reviewPerson'){focusPerson=x.value;render()}if(x.dataset.meetpoint){let m=data.oneOnOnes.find(x=>x.id===meetingId),p=m?.points.find(p=>p.id===x.dataset.meetpoint);if(p){p.done=x.checked;save();render()}}});
document.addEventListener('submit',e=>{let f=e.target,ids=['meetingCreate','pointAdd','meetingTask','meetingNote','privateNote','meetingNext','cycleCreate','entryForm','bizCreate','bizUpdate','bizTask','teamMetaForm'];if(!ids.includes(f.id))return;e.preventDefault();e.stopImmediatePropagation();let fd=new FormData(f),v=Object.fromEntries(fd),m=data.oneOnOnes.find(x=>x.id===meetingId),b=data.businessCycles.find(x=>x.id===bizId),entry=data.reviewEntries.find(x=>x.id===entryId);const intent=e.submitter?.value;switch(f.id){
case 'meetingCreate':if(!v.manager||!v.participant||v.manager===v.participant||!v.date){alert('دو فرد متفاوت و تاریخ جلسه را انتخاب کنید.');return}m={...v,id:uid(),status:'برنامه‌ریزی‌شده',points:[],notes:'',privateNotes:''};data.oneOnOnes.push(m);meetingId=m.id;workflowMode='';break;
case 'pointAdd':if(m)m.points.push({id:uid(),text:v.text,done:false});break;
case 'meetingTask':if(m)data.tasks.push({...v,id:uid(),goal:'',done:false,meetingId:m.id});break;
case 'meetingNote':if(m)m.notes=v.notes;break;
case 'privateNote':if(m)m.privateNotes=v.notes;break;
case 'meetingNext':{let old=data.oneOnOnes.find(x=>x.id===f.dataset.id);if(!old||!v.date){alert('تاریخ را وارد کنید.');return}let next={...old,...v,id:uid(),status:'برنامه‌ریزی‌شده',points:old.points.filter(p=>!p.done).map(p=>({...p,id:uid()})),notes:'',privateNotes:''};data.oneOnOnes.push(next);meetingId=next.id;break}
case 'cycleCreate':{let ps=fd.getAll('participant');if(!ps.length||!v.deadline||(v.mode!=='self'&&!v.reviewer)){alert('مهلت، مشارکت‌کنندگان و در صورت نیاز ارزیاب را مشخص کنید.');return}let c={...v,id:uid(),participants:ps,status:'فعال'};delete c.participant;data.cycles.push(c);ps.forEach(person=>data.reviewEntries.push({id:uid(),cycle:c.id,person,reviewer:v.mode==='self'?person:v.reviewer,mode:v.mode,status:'نیازمند اقدام'}));cycleId=c.id;workflowMode='';break}
case 'entryForm':if(!entry||entry.status==='تکمیل‌شده'||data.cycles.find(c=>c.id===entry.cycle)?.status==='بسته')return;if(intent==='complete'&&(!v.rating||!v.achievements.trim()||!v.development.trim())){alert('برای تکمیل، شواهد، امتیاز و برنامه توسعه ضروری است.');return}Object.assign(entry,v,{status:intent==='complete'?'تکمیل‌شده':'پیش‌نویس',updatedAt:date()});break;
case 'bizCreate':b={...v,id:uid(),status:'پیش‌نویس'};data.businessCycles.push(b);bizId=b.id;workflowMode='';break;
case 'bizUpdate':if(!b||b.status==='منتشرشده')return;if(intent==='complete'&&!v.decisions.trim()){alert('تصمیم‌های مدیریتی را ثبت کنید.');return}Object.assign(b,v);if(intent==='complete'){b.status='منتشرشده';b.snapshot=data.goals.filter(g=>!b.team||g.team===b.team).map(g=>({...structuredClone(g),frozenProgress:progress(g)}));b.finalizedAt=date()}break;
case 'bizTask':if(b)data.tasks.push({...v,id:uid(),goal:'',done:false,businessId:b.id});break;
case 'teamMetaForm':{let t=f.dataset.team,p=v.parent,seen=new Set([t]);while(p){if(seen.has(p)){alert('این انتخاب باعث چرخه در ساختار سازمانی می‌شود.');return}seen.add(p);p=data.teamMeta[p]?.parent}data.teamMeta[t]=v;break}
}save();act('close');render()},true);
render();
</script></body></html>
