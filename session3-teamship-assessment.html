<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خودارزیابی تیم‌شیپ | به‌پرور</title><style>@font-face{font-family:v;src:url('assets/vazirmatn.woff2')}*{box-sizing:border-box}body{margin:0;background:#f4f7fd;color:#172543;font:19px/1.9 v,Tahoma,sans-serif}main{max-width:850px;margin:auto;padding:20px}header{background:#152d65;color:white;padding:24px;border-radius:22px}h1{font-size:28px;line-height:1.5;margin:0}h2{font-size:21px}p{margin:8px 0 16px}a{color:inherit}.tabs{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.tabs button{font:inherit;padding:10px 16px;border:2px solid #b9cbea;border-radius:14px;background:white;color:#152d65}.tabs button[aria-pressed=true]{background:#152d65;color:white}.item{background:white;border:1px solid #dce4f1;border-radius:19px;padding:18px;margin:14px 0}.ends{display:flex;justify-content:space-between;gap:12px;font-size:16px;line-height:1.5}.ends span{width:48%}.ends span:last-child{text-align:left;color:#127264}input[type=range]{width:100%;height:40px;direction:ltr;accent-color:#2465ad;touch-action:pan-y}.numbers{display:flex;justify-content:space-between;direction:ltr;font-size:15px}.score{font-weight:bold;color:#152d65}.summary{background:white;padding:18px;border-radius:18px;margin:20px 0}.summary strong{font-size:28px}.note{font-size:15px;color:#53637d}button:focus-visible,input:focus-visible{outline:3px solid orange;outline-offset:3px}</style></head><body><main><header><a href="session3-teamship.html">→ بازگشت به پرونده کتاب</a><h1>🎯 خودارزیابی تیم‌شیپ</h1><p>من و به‌پرور کجای طیف رهبری فردمحور تا تیم‌محور قرار داریم؟ نشانگر هر طیف را از ۱ تا ۱۰ جابه‌جا کنید.</p></header><div class="tabs"><button data-mode="self" aria-pressed="true">👤 ارزیابی خودم</button><button data-mode="org" aria-pressed="false">🏢 ارزیابی به‌پرور</button></div><div id="scales"></div><div class="summary" id="summary" aria-live="polite"></div><p class="note">این ابزار یک خودارزیابی آموزشی است، نه آزمون روان‌سنجی. در مواردی که کتاب تقابل لفظی صریح ندارد، دو سر طیف بازنویسی آموزشی مفاهیم کتاب‌اند.</p></main><script>const shifts=[{"title":"ارتقای متقابل اعضای تیم","pair":["Hub-and-Spoke","Co-Elevation"]},{"title":"صراحت سازنده","pair":["Conflict Avoidance","Candor"]},{"title":"اعتمادسازی هدفمند","pair":["Accidental Relationships","Purposeful Bond-Building"]},{"title":"تاب‌آوری تیمی","pair":["Individual Resilience","Team Resilience"]},{"title":"هم‌آفرینی و همکاری مؤثر","pair":["هم‌آفرینی محدود","هم‌آفرینی گسترده"]},{"title":"چابکی تیمی","pair":["روش‌های کاری ثابت","چابکی تیمی"]},{"title":"قدردانی متقابل","pair":["Leader-Led Praise","Peer Recognition"]},{"title":"تنوع دیدگاه و مشارکت فراگیر","pair":["مشارکت محدود","تنوع، شمول و تعلق"]},{"title":"کوچینگ متقابل","pair":["مربی‌گری صرفاً توسط مدیر","مربی‌گری متقابل"]},{"title":"هم‌راستایی تیمی","pair":["Silos","Alignment"]}];let mode='self';const values={self:Array(10).fill(null),org:Array(10).fill(null)};for(const k of ['self','org'])try{const a=JSON.parse(localStorage.getItem('bp-teamship-v1-'+k));if(Array.isArray(a)&&a.length===10)values[k]=a.map(v=>Number.isInteger(v)&&v>=1&&v<=10?v:null)}catch(e){}function summary(){const a=values[mode].filter(v=>v!==null);document.getElementById('summary').innerHTML='میانگین '+(mode==='self'?'خودم':'به‌پرور')+': <strong>'+(a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'—')+' از ۱۰</strong><p>'+a.length+' از ۱۰ طیف تکمیل شده است.</p>'}function render(){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));document.getElementById('scales').innerHTML=shifts.map((s,i)=>'<section class="item"><h2>'+(i+1)+'. '+s.title+'</h2><div class="ends"><span>'+s.pair[0]+'</span><span>'+s.pair[1]+'</span></div><input type="range" min="1" max="10" step="1" value="'+(values[mode][i]??5)+'" data-index="'+i+'" aria-label="امتیاز '+s.title+'"><div class="numbers"><span>1</span><span class="score" id="v'+i+'">'+(values[mode][i]??'ثبت نشده')+'</span><span>10</span></div></section>').join('');summary()}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;render()}));document.getElementById('scales').addEventListener('input',e=>{const i=Number(e.target.dataset.index);if(!Number.isInteger(i)||i<0||i>9)return;values[mode][i]=Number(e.target.value);document.getElementById('v'+i).textContent=values[mode][i];try{localStorage.setItem('bp-teamship-v1-'+mode,JSON.stringify(values[mode]))}catch(e){}summary()});render();</script></body></html>
