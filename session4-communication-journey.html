@font-face{font-family:Vazirmatn;src:url("assets/vazirmatn.woff2") format("woff2");font-display:swap}
:root{--navy:#192f67;--ink:#162641;--cream:#f8fafc;--mag:#b02154;--coral:#f37850;--gold:#d7a043;--teal:#087e89;--line:#dde4f2;--muted:#53607a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top right,#f8e9f2 0,#f4f7fc 48%,#f7f9fc 100%);font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);font-size:19px;line-height:1.85}
button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}.shell{max-width:1150px;margin:0 auto;padding:18px 20px 75px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:#ffffffeb;backdrop-filter:blur(14px);padding:10px 18px;border:1px solid #e9edf6;border-radius:0 0 19px 19px;box-shadow:0 7px 28px #152d5112}
.logos{display:flex;gap:12px;align-items:center}.logos img{width:145px;height:auto;max-height:44px;object-fit:contain}.top-sub{font-weight:800;font-size:16px;color:var(--navy);border-right:1px solid var(--line);padding-right:12px}
.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top a,.top button{background:white;color:var(--navy);border:1px solid var(--line);padding:7px 12px;border-radius:12px;font-weight:750;font-size:14px}
#clock{font-family:Tahoma,Arial,sans-serif;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums;font-size:20px;color:var(--navy);font-weight:900}
.hero{min-height:420px;display:grid;grid-template-columns:1.15fr .85fr;position:relative;border-radius:30px;overflow:hidden;margin:22px 0 24px;box-shadow:0 19px 48px #132a5138;background:linear-gradient(100deg,#102a58f2 0%,#132b55eb 48%,#132b5570 78%),url("https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1600&q=85") center center / cover}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:7px;background:linear-gradient(90deg,#d83c67,#ef9755,#f4bd51,#15b5b3)}
.hero-copy{position:relative;z-index:1;padding:42px 44px;color:#fff}.hero h1{font-size:clamp(47px,6vw,88px);letter-spacing:-2px;line-height:1.25;margin:8px 0 17px;color:#fff;text-shadow:0 4px 25px #091d48a0}.hero h1 span{color:#ffc15d}
.hero p{max-width:610px;color:#f2f5ff;font-size:22px;margin:0 0 20px}.hero .brandpatch{background:#fffffff5;display:inline-flex;border-radius:15px;padding:7px 15px;margin:0 0 5px;box-shadow:0 9px 20px #02172a25}
.hero .brandpatch img{width:180px;max-height:55px;object-fit:contain}.eyebrow{display:inline-block;background:#edbf5a;color:#27223d;border-radius:99px;font-weight:850;padding:5px 19px;font-size:17px}
.hero-trail{display:grid;gap:13px;align-content:center;justify-items:end;padding:35px 32px;position:relative;z-index:1}.trail-step{display:flex;align-items:center;gap:12px;min-width:210px;max-width:300px;background:#ffffffde;border:1px solid #ffffffb5;box-shadow:0 9px 25px #0f1d3244;backdrop-filter:blur(6px);padding:11px 16px;border-radius:19px;font-size:17px;font-weight:800;color:var(--navy)}.trail-step:nth-child(2){margin-left:50px}.trail-step:nth-child(3){margin-left:95px}.trail-step .emoji{font-size:25px}
.minibanner{position:relative;overflow:hidden;background:linear-gradient(110deg,#172f70d5,#682c73a5 67%,#f39e5477),url("assets/safar-ertebatat-cover.svg") center center/cover;border-radius:18px;padding:10px 21px;margin:19px 0 18px;min-height:85px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:white;box-shadow:0 8px 24px #12234e2a}
.minibanner strong{font-size:28px}.minibanner img{width:140px;padding:6px;background:#fff;border-radius:10px}.minibanner small{font-size:15px;font-weight:700;color:#ffe4a2}
h2{font-size:31px;margin:4px 0 15px;line-height:1.5}.card{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px #203b6810;border-radius:23px;padding:24px;margin:14px 0}.section-head{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy);font-size:22px;margin-bottom:14px}.section-head .number{background:#eaf2ff;color:var(--navy);border-radius:11px;padding:0px 12px;min-width:39px;text-align:center}
.btn{border:0;background:var(--navy);color:white;border-radius:14px;padding:12px 22px;font-weight:850;min-height:54px;box-shadow:0 4px 14px #132e5620;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.09);transform:translateY(-1px)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.btn.alt{background:#eff3fa;color:var(--navy);box-shadow:none;border:1px solid #d9e0ec}.btn.magenta{background:var(--mag)}.btn.gold{background:#bc8631;color:#fff}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{border-radius:99px;padding:6px 15px;font-size:14px;font-weight:800;background:#f0f3fb;color:var(--navy)}.pill.gold{background:#fff2cc;color:#795218}.pill.teal{background:#e3faf9;color:#086c76}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}.role-card{border:2px solid #dce6f3;text-align:right;padding:22px;border-radius:21px;background:linear-gradient(140deg,#fff,#eff5fb);font-size:20px;color:var(--navy);font-weight:900;min-height:116px}.role-card b{font-size:25px;display:block}.role-card.active{border-color:var(--mag);background:#fff0f6;box-shadow:inset 0 0 0 2px #f7cddd}
.field{width:100%;border:1px solid #bac9dd;background:#fff;border-radius:12px;min-height:48px;padding:11px 14px;color:var(--ink)}.field-label{display:block;font-weight:800;margin-bottom:7px}
.inline-note{font-size:15px;color:var(--muted)}.introgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:14px;background:linear-gradient(125deg,#f0f3fc,#fff);border:1px solid #e1e7f4;border-radius:17px;text-align:center}.stat strong{display:block;font-size:28px;color:var(--navy)}.stat span{font-size:15px;color:var(--muted)}
.progressrow{display:flex;gap:3px;margin:15px 0 8px;direction:rtl}.progressrow .seg{flex:1;height:12px;background:#dfe6f0;border-radius:5px}.progressrow .seg.done{background:#1c9c99}.progressrow .seg.now{background:#e5a333;box-shadow:0 0 0 2px #f7e1ab}
.statusbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.statuschip{display:inline-block;border-radius:99px;font-size:15px;font-weight:800;padding:5px 13px;background:#e9f2ff;color:#183b74}.statuschip.warn{background:#fff0df;color:#9b4f0f}.statuschip.good{background:#e1f8ed;color:#11603d}
.companion{position:relative;background:linear-gradient(100deg,#fff4e6,#fff9f5);border:1px solid #f8cf9f;border-right:6px solid #e47a40;border-radius:18px;padding:18px 22px;font-size:18px;color:#593512;margin:13px 0;box-shadow:0 4px 15px #efaf6712}.companion strong{display:block;font-size:17px;color:#873d1b}.companion .avatar{font-size:24px;margin-left:8px}
.bullets{list-style:none;padding:0;margin:0;display:grid;gap:10px}.bullets li{background:#f5f8ff;border-radius:14px;padding:12px 17px;border-right:4px solid var(--teal)}
.case{background:linear-gradient(120deg,#e9f9f8,#fff);border-right:5px solid var(--teal);border-radius:15px;padding:18px 22px;font-weight:650}.self-list{display:grid;gap:13px}.self-item{border:1px solid #e4e9f4;border-radius:13px;padding:13px;background:#fbfcff}.self-item p{margin:0 0 9px}.scalebtns{display:flex;flex-wrap:wrap;gap:8px}.scalebtn{background:white;border:1px solid #cbd4e3;border-radius:10px;padding:6px 12px;min-height:43px;color:#213e68}.scalebtn.selected{background:#153c77;color:#fff;border-color:#153c77}
.question{padding:19px;border:1px solid #dfe6f5;border-radius:18px;margin:16px 0;background:#fff}.qtitle{display:flex;justify-content:space-between;align-items:center;gap:5px}.qtitle b{color:var(--mag);font-size:17px}.option{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border:1px solid #e0e5f0;border-radius:12px;margin:9px 0;cursor:pointer;font-size:17px}.option:has(input:checked){border-color:#274da6;background:#edf3ff}.option input{margin-top:11px;accent-color:var(--navy)}.locked{background:#eaf7f1;border:1px solid #b6ddc6;color:#1d6d44;border-radius:12px;padding:12px;margin-top:10px;font-weight:750}.warning{background:#fff0df;border:1px solid #f1c8a0;border-radius:15px;padding:15px 19px;color:#8c4214;font-weight:750;margin:12px 0}.alert{animation:flash 1.2s ease 2;border:2px solid #da4d66;background:#fff0f2}.alert .section-head{color:#a71d48}@keyframes flash{0%,100%{box-shadow:0 0 0 0 #c72d5555}50%{box-shadow:0 0 0 9px #c72d5512}}
.coin{font-size:23px}.coinslider{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:12px 0;padding:12px;border-radius:12px;background:#f7f9fc}.coinslider input{width:55%;accent-color:#c58b2d}.coinmeter{height:12px;border-radius:99px;background:#e5eaf2;overflow:hidden}.coinfill{height:100%;background:linear-gradient(90deg,#ca8848,#f6c24b);transition:width .2s}
.charrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.character{background:#f1f5fb;padding:13px;border-radius:13px;font-size:16px}.character b{color:var(--navy);display:block}
.checkrow{display:flex;gap:9px;align-items:start;background:#f7f9fb;padding:9px 12px;border-radius:10px;margin-bottom:7px}.checkrow input{margin-top:12px;width:19px;height:19px;accent-color:var(--navy)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:23px 0}.actions button{flex:1}
.result-hero{border-radius:28px;text-align:center;background:linear-gradient(120deg,#182e65,#87385c);color:#fff;padding:38px 22px;box-shadow:0 16px 32px #142b552f}.result-hero h1{font-size:44px;margin:12px 0}.score{font-size:72px;font-family:Tahoma,Arial;font-weight:900;line-height:1.3}.badge-medal{width:210px;min-height:220px;display:grid;place-content:center;text-align:center;border-radius:32px;margin:20px auto;background:linear-gradient(140deg,#fce6a4,#aa7a20,#ffda7e);border:5px solid #fff5ca;box-shadow:0 20px 35px #1a25484a;color:#604115}.badge-medal.silver{background:linear-gradient(140deg,#f3f6fc,#8c9aad,#fafbff);color:#43536e}.badge-medal.bronze{background:linear-gradient(140deg,#f7d4bb,#a76842,#f2c6a0);color:#6d3c25}.badge-medal.none{background:linear-gradient(140deg,#e8eef9,#ced8e8);color:#40516e}.badge-medal img{max-width:125px;max-height:40px;background:#fff;border-radius:10px;padding:4px;margin:auto}.badge-medal .medalicon{font-size:52px;line-height:1.2}.badge-medal strong{font-size:28px}
.reviewentry{border:1px solid #e0e6f0;background:white;border-radius:17px;padding:17px;margin:12px 0}.reviewentry h3{font-size:21px;margin:0 0 12px;color:var(--navy)}.analysis{background:#f2f7ff;border-radius:10px;padding:10px 14px;font-size:16px}
.bottomnav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:26px}
.sound-toggle{font-size:14px;min-width:125px}.smaller{font-size:15px;color:var(--muted)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.top,.actions,.bottomnav,.btn,.minibanner{display:none!important}.shell{max-width:none}.card{box-shadow:none}body{background:white}}
.cover-surface{margin:22px 0 24px;border-radius:26px;overflow:hidden;box-shadow:0 17px 42px #12265130;background:linear-gradient(100deg,#17345f,#824b7d)}.cover-surface img{display:block;width:100%;height:auto;min-height:265px;object-fit:cover}@media(max-width:640px){.cover-surface img{min-height:230px;object-position:70% center}}

function guide(step){const texts=["عزیزم، یادت باشه رابطه خوب از یک شروع محترمانه و روشن ساخته می‌شه.","جلسه خوب فقط گفت‌وگو نیست؛ با یک توافق قابل پیگیری پایان پیدا می‌کنه.","گاهی بهترین کار اینه که چند ثانیه بیشتر گوش بدی و بعد سؤال بپرسی.","لحن آرام، پیام روشن و زبان بدن هماهنگ رو فراموش نکن.","بازخورد درباره رفتار قابل تغییره، نه قضاوت درباره شخصیت.","حالا یک گفت‌وگوی دشوار داریم؛ قاطع باش و احترام رو هم حفظ کن.","قبل از اینکه بگی دیگران همکاری نمی‌کنن، محدودیت‌های اون‌ها رو بپرس.","برای حفظ رابطه، قرار نیست به همه درخواست‌ها بله بگی.","وقتی مخاطب ناراضیه، قبل از دفاع، اثر مشکل رو بر اون بفهم.","رسیدیم به آخرین مرحله! توافق خوب توافقیه که اجراشدنی باشه."];return texts[step]||""}
function render(){if(state.mode==="study"){modes.renderStudy(state);return;}topClock();const root=$("#root");if(state.finished){renderEnd();return}if(!state.startedAt){renderIntro();return}renderStage()}
function renderIntro(){
$("#root").innerHTML='<div class="cover-surface"><img src="assets/safar-ertebatat-cover.svg" alt="پوستر اصلی سفر ارتباطات، جلسه چهارم به‌پرور، با لوگوی رسمی شرکت و تصویر واقعی مجموعه"></div><div class="sf-classroom-qr-link"><a href="session4-classroom-qr.html" target="_blank" rel="noopener">نمایش QR ورود کلاس روی پرده</a><span>بدون کد یا تأیید مدرس وارد سفر شوید.</span></div><div class="introgrid"><div class="stat"><strong>۱۰</strong><span>مرحله متوالی</span></div><div class="stat"><strong>۲۰</strong><span>پرسش تصمیم‌گیری</span></div><div class="stat"><strong>۱۰۰</strong><span>امتیاز ممکن</span></div></div><section class="card"><div class="section-head">👋 سلام! خوش اومدی به سفر ارتباطات</div><p>اینجا قرار نیست فقط پاسخ درست رو حدس بزنی. قراره با آدم‌ها گفت‌وگو کنی، در لحظه تصمیم بگیری و محدودیت‌ها رو مدیریت کنی. امتیاز هر مرحله همان‌جا نمایش داده می‌شود؛ درست و غلط و تحلیل گزینه‌ها فقط در پایان سفر باز می‌شوند.</p><label class="field-label" for="learner">نام و نام خانوادگی برای نشان (اختیاری)</label><input id="learner" class="field" maxlength="80" placeholder="نام شما" value="'+E(state.name)+'"><p class="field-label">مسیرت رو انتخاب کن:</p><div class="roles"><button type="button" class="role-card '+(transient.role==="supervisors"?"active":"")+'" data-role="supervisors" aria-pressed="'+(transient.role==="supervisors"?"true":"false")+'"><b>👥 سرپرستان</b>رابطه با کارکنان و همکاران</button><button type="button" class="role-card '+(transient.role==="managers"?"active":"")+'" data-role="managers" aria-pressed="'+(transient.role==="managers"?"true":"false")+'"><b>🎯 مدیران</b>تصمیم و همکاری میان‌واحدی</button></div><p class="inline-note">در مسیر رقابتی، تایمر ۶۰ دقیقه‌ای با شروع مأموریت فعال می‌شود؛ پس از پایان زمان، ادامه رقابت با درخواست وقت اضافه و پذیرش کسر امتیاز امکان‌پذیر است؛ هر ۵ دقیقه یا بخشی از آن، ۲ امتیاز کسر می‌شود.</p><div class="sf-mode-choices"><div class="sf-mode-choice"><h3>⏱ مسیر رقابتی</h3><p>۶۰ دقیقه، آزمون‌ها، امتیاز و نشان پایان سفر؛ یک مکث ۵ دقیقه‌ای و امکان درخواست وقت اضافه.</p><strong>برای محک‌زدن مهارت و مدیریت زمان</strong><button id="start" type="button" '+(!transient.role?"disabled":"")+'>شروع مأموریت ۶۰ دقیقه‌ای</button></div><div class="sf-mode-choice free"><h3>📖 مطالعه آزاد</h3><p>هر ۱۰ مرحله را با تکنیک‌ها، مثال‌ها و گفت‌وگوها، بدون تایمر، آزمون اجباری، امتیاز یا نشان مرور کن.</p><strong>برای یادگیری با سرعت شخصی</strong><button id="sfStartStudy" type="button" '+(!transient.role?"disabled":"")+'>ورود به مطالعه آزاد</button></div></div></section>';
}

function grade(){

   const delta=alloc.reduce((n,v,j)=>n+Math.abs(v-inc.ideal[j]),0);
   resources+=delta===0?2:delta<=2?1:0;
  }

 });

}

function saveanswer(q){if(overtime.expired(state)){overtime.sync(state);return;}const a=state.answers[state.stage]||{};if(q===1){if(a.q1!==undefined||transient.q1===null)return;if(!confirm("این پاسخ پس از ثبت، قابل تغییر نیست. ثبت شود؟"))return;a.q1=transient.q1}else{if(a.q2!==undefined||transient.best===null||transient.worst===null||transient.best===transient.worst){alert("دو انتخاب متفاوت انجام بده.");return}if(!confirm("بهترین و ضعیف‌ترین اقدام برای همیشه ثبت و قفل شوند؟"))return;a.q2={best:transient.best,worst:transient.worst}}state.answers[state.stage]=a;save();render()}
function begin(){let name=$("#learner").value.trim();if(!transient.role)return;if(!confirm("با شروع سفر، تایمر ۶۰ دقیقه‌ای فعال می‌شود و مسیر انتخابی قفل می‌شود. شروع کنیم؟"))return;state.role=transient.role;state.name=name;state.curriculumV4=4;state.appliedCurriculumV2=2;state.startedAt=Date.now();state.stage=0;state.mode="competitive";state.pause={since:0,spentMs:0,usedOnce:false};state.overtime={pauseMs:0,grants:[]};state.guide={uses:[]};save();render()}
function next(){
 if(overtime.expired(state)){overtime.sync(state);return;}
 const vals=state.self?.[state.stage]||[],a=ans();
 if(vals.length!==3||vals.some(v=>!Number.isInteger(v)||v<1||v>4)||a.q1===undefined||a.q2===undefined){
  alert("خودارزیابی و دو سؤال تصمیم‌گیری را ثبت کن تا مرحله بعد باز شود.");return;
 }
 // Self-paced learning: no instructor approval or extra confirmation.
 // Pair practice, allocation and written follow-up remain optional.
 if(state.stage===9){finish();return}
 state.stage++;
 transient={role:state.role,q1:null,best:null,worst:null,alloc:[0,0,0,0],
 evidence:"",observer:"",note:"",checks:[false,false,false],feedback:"",suggestion:""};
 save();render();window.scrollTo({top:0,behavior:"smooth"});
 if([3,6,8].includes(state.stage))sfx();
}
function saveAlloc(){if(overtime.expired(state)){overtime.sync(state);return;}const arr=transient.alloc;if(state.alloc[state.stage]||arr.reduce((a,b)=>a+b,0)!==6||arr.filter(x=>x>0).length<2)return;if(!confirm("تخصیص شش سکه قفل شود؟"))return;state.alloc[state.stage]=arr.slice();save();render()}
function saveRP(){
 if(overtime.expired(state)){overtime.sync(state);return;}
 if(state.rp[state.stage])return;
 const rating=Number(document.querySelector('input[name="peerRating"]:checked')?.value||0);
 if(!Number.isInteger(rating)||rating<1||rating>5){alert("برای ثبت تمرین، عملکرد همکار را از ۱ تا ۵ ارزیابی کن. این عدد فقط در گوشی تو می‌ماند.");return}
 state.rp[state.stage]={observer:($("#peername")?.value||"").trim().slice(0,70),peerRating:rating,at:Date.now(),mode:"adjacent-peer-private"};
