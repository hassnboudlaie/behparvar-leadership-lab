*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top right,#f2f3f6 0,#f7f8f9 48%,#f9f9fa 100%);font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);font-size:19px;line-height:1.85}

.hidden{display:none!important}.shell{max-width:1150px;margin:0 auto;padding:18px 20px 75px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:50;background:#ffffffeb;backdrop-filter:blur(14px);padding:10px 18px;border:1px solid #f2f3f6;border-radius:0 0 19px 19px;box-shadow:0 7px 28px #132a5312}
.logos{display:flex;gap:12px;align-items:center}.logos img{width:145px;height:auto;max-height:44px;object-fit:contain}.top-sub{font-weight:800;font-size:16px;color:var(--navy);border-right:1px solid var(--line);padding-right:12px}
.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top a,.top button{background:white;color:var(--navy);border:1px solid var(--line);padding:7px 12px;border-radius:12px;font-weight:750;font-size:14px}
#clock{font-family:Tahoma,Arial,sans-serif;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums;font-size:20px;color:var(--navy);font-weight:900}
.hero{min-height:420px;display:grid;grid-template-columns:1.15fr .85fr;position:relative;border-radius:30px;overflow:hidden;margin:22px 0 24px;box-shadow:0 19px 48px #13295138;background:linear-gradient(100deg,#102958f2 0%,#132a55eb 48%,#132a5570 78%),url("https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=1600&q=85") center center / cover}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:7px;background:linear-gradient(90deg,#e43042,#f64e5f,#f64f60,#0a47c0)}
.hero-copy{position:relative;z-index:1;padding:42px 44px;color:#ffffff}.hero h1{font-size:clamp(47px,6vw,88px);letter-spacing:-2px;line-height:1.25;margin:8px 0 17px;color:#ffffff;text-shadow:0 4px 25px #091f48a0}.hero h1 span{color:#f76574}
.hero p{max-width:610px;color:#f8f8f9;font-size:22px;margin:0 0 20px}.hero .brandpatch{background:#fffffff5;display:inline-flex;border-radius:15px;padding:7px 15px;margin:0 0 5px;box-shadow:0 9px 20px #03102925}
.hero .brandpatch img{width:180px;max-height:55px;object-fit:contain}.eyebrow{display:inline-block;background:#5188f6;color:#12274d;border-radius:99px;font-weight:850;padding:5px 19px;font-size:17px}
.hero-trail{display:grid;gap:13px;align-content:center;justify-items:end;padding:35px 32px;position:relative;z-index:1}.trail-step{display:flex;align-items:center;gap:12px;min-width:210px;max-width:300px;background:#ffffffde;border:1px solid #ffffffb5;box-shadow:0 9px 25px #0c1a3544;backdrop-filter:blur(6px);padding:11px 16px;border-radius:19px;font-size:17px;font-weight:800;color:var(--navy)}.trail-step:nth-child(2){margin-left:50px}.trail-step:nth-child(3){margin-left:95px}.trail-step .emoji{font-size:25px}
.minibanner{position:relative;overflow:hidden;background:linear-gradient(110deg,#173670d5,#811e28a5 67%,#f6516277),url("assets/safar-ertebatat-cover.svg") center center/cover;border-radius:18px;padding:10px 21px;margin:19px 0 18px;min-height:85px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:white;box-shadow:0 8px 24px #12274e2a}
.minibanner strong{font-size:28px}.minibanner img{width:140px;padding:6px;background:#ffffff;border-radius:10px}.minibanner small{font-size:15px;font-weight:700;color:#c1cbe0}
h2{font-size:31px;margin:4px 0 15px;line-height:1.5}.card{background:#ffffff;border:1px solid var(--line);box-shadow:0 8px 24px #1a376e10;border-radius:23px;padding:24px;margin:14px 0}.section-head{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--navy);font-size:22px;margin-bottom:14px}.section-head .number{background:#f3f4f6;color:var(--navy);border-radius:11px;padding:0px 12px;min-width:39px;text-align:center}
.btn{border:0;background:var(--navy);color:white;border-radius:14px;padding:12px 22px;font-weight:850;min-height:54px;box-shadow:0 4px 14px #132a5620;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.09);transform:translateY(-1px)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.btn.alt{background:#f3f4f6;color:var(--navy);box-shadow:none;border:1px solid #d9e0ec}.btn.magenta{background:var(--mag)}.btn.gold{background:#c62737;color:#ffffff}
.pills{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.pill{border-radius:99px;padding:6px 15px;font-size:14px;font-weight:800;background:#f4f5f7;color:var(--navy)}.pill.gold{background:#dde3ee;color:#791822}.pill.teal{background:#f2f3f6;color:#082d76}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}.role-card{border:2px solid #e0e5ef;text-align:right;padding:22px;border-radius:21px;background:linear-gradient(140deg,#ffffff,#f3f4f7);font-size:20px;color:var(--navy);font-weight:900;min-height:116px}.role-card b{font-size:25px;display:block}.role-card.active{border-color:var(--mag);background:#f6f7f9;box-shadow:inset 0 0 0 2px #ecd8da}
.field{width:100%;border:1px solid #bac6dd;background:#ffffff;border-radius:12px;min-height:48px;padding:11px 14px;color:var(--ink)}.field-label{display:block;font-weight:800;margin-bottom:7px}
.inline-note{font-size:15px;color:var(--muted)}.introgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:14px;background:linear-gradient(125deg,#f5f6f7,#ffffff);border:1px solid #f2f3f6;border-radius:17px;text-align:center}.stat strong{display:block;font-size:28px;color:var(--navy)}.stat span{font-size:15px;color:var(--muted)}
.progressrow{display:flex;gap:3px;margin:15px 0 8px;direction:rtl}.progressrow .seg{flex:1;height:12px;background:#e0e5ef;border-radius:5px}.progressrow .seg.done{background:#1243a6}.progressrow .seg.now{background:#f2263a;box-shadow:0 0 0 2px #c1cce1}
.statusbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.statuschip{display:inline-block;border-radius:99px;font-size:15px;font-weight:800;padding:5px 13px;background:#f2f3f6;color:#183874}.statuschip.warn{background:#f2f3f6;color:#9b0f1d}.statuschip.good{background:#f2f3f6;color:#112b60}
.companion{position:relative;background:linear-gradient(100deg,#f2f3f6,#f9fafb);border:1px solid #ddbabd;border-right:6px solid #f03447;border-radius:18px;padding:18px 22px;font-size:18px;color:#591219;margin:13px 0;box-shadow:0 4px 15px #f75f6f12}.companion strong{display:block;font-size:17px;color:#871b26}.companion .avatar{font-size:24px;margin-left:8px}
.bullets{list-style:none;padding:0;margin:0;display:grid;gap:10px}.bullets li{background:#f9fafb;border-radius:14px;padding:12px 17px;border-right:4px solid var(--teal)}
.case{background:linear-gradient(120deg,#f2f3f6,#ffffff);border-right:5px solid var(--teal);border-radius:15px;padding:18px 22px;font-weight:650}.self-list{display:grid;gap:13px}.self-item{border:1px solid #f2f3f6;border-radius:13px;padding:13px;background:#fdfdfd}.self-item p{margin:0 0 9px}.scalebtns{display:flex;flex-wrap:wrap;gap:8px}.scalebtn{background:white;border:1px solid #cbd3e3;border-radius:10px;padding:6px 12px;min-height:43px;color:#1a386f}.scalebtn.selected{background:#153777;color:#ffffff;border-color:#153777}
.question{padding:19px;border:1px solid #f2f3f6;border-radius:18px;margin:16px 0;background:#ffffff}.qtitle{display:flex;justify-content:space-between;align-items:center;gap:5px}.qtitle b{color:var(--mag);font-size:17px}.option{display:flex;align-items:flex-start;gap:10px;padding:12px 15px;border:1px solid #e0e6f0;border-radius:12px;margin:9px 0;cursor:pointer;font-size:17px}.option:has(input:checked){border-color:#1d51b0;background:#f5f6f7}.option input{margin-top:11px;accent-color:var(--navy)}.locked{background:#f2f3f6;border:1px solid #b7c3dc;color:#1a3770;border-radius:12px;padding:12px;margin-top:10px;font-weight:750}.warning{background:#f2f3f6;border:1px solid #dbb6ba;border-radius:15px;padding:15px 19px;color:#8c1420;font-weight:750;margin:12px 0}.alert{animation:flash 1.2s ease 2;border:2px solid #e54253;background:#f6f7f9}.alert .section-head{color:#b11323}@keyframes flash{0%,100%{box-shadow:0 0 0 0 #d3213355}50%{box-shadow:0 0 0 9px #d3213312}}
.coin{font-size:23px}.coinslider{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:12px 0;padding:12px;border-radius:12px;background:#f9f9fa}.coinslider input{width:55%;accent-color:#d02233}.coinmeter{height:12px;border-radius:99px;background:#f2f3f6;overflow:hidden}.coinfill{height:100%;background:linear-gradient(90deg,#d43e4d,#4b84f6);transition:width .2s}
.charrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.character{background:#f5f6f7;padding:13px;border-radius:13px;font-size:16px}.character b{color:var(--navy);display:block}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin:23px 0}.actions button{flex:1}
.result-hero{border-radius:28px;text-align:center;background:linear-gradient(120deg,#183365,#942b35);color:#ffffff;padding:38px 22px;box-shadow:0 16px 32px #142b552f}.result-hero h1{font-size:44px;margin:12px 0}.score{font-size:72px;font-family:Tahoma,Arial;font-weight:900;line-height:1.3}.badge-medal{width:210px;min-height:220px;display:grid;place-content:center;text-align:center;border-radius:32px;margin:20px auto;background:linear-gradient(140deg,#c0cbe0,#b41626,#84abf9);border:5px solid #dbe1ee;box-shadow:0 20px 35px #13284f4a;color:#60151c}.badge-medal.silver{background:linear-gradient(140deg,#f6f7f9,#668cd3,#fcfcfd);color:#284a89}.badge-medal.bronze{background:linear-gradient(140deg,#e6cccf,#b53441,#dbb7ba);color:#761c25}.badge-medal.none{background:linear-gradient(140deg,#f2f3f6,#cfd7e7);color:#274987}.badge-medal img{max-width:125px;max-height:40px;background:#ffffff;border-radius:10px;padding:4px;margin:auto}.badge-medal .medalicon{font-size:52px;line-height:1.2}.badge-medal strong{font-size:28px}

.bottomnav{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:26px}
.sound-toggle{font-size:14px;min-width:125px}.smaller{font-size:15px;color:var(--muted)}

@media print{.top,.actions,.bottomnav,.btn,.minibanner{display:none!important}.shell{max-width:none}.card{box-shadow:none}body{background:white}}

function guide(step){const texts=["عزیزم، یادت باشه رابطه خوب از یک شروع محترمانه و روشن ساخته می‌شه.","جلسه خوب فقط گفت‌وگو نیست؛ با یک توافق قابل پیگیری پایان پیدا می‌کنه.","گاهی بهترین کار اینه که چند ثانیه بیشتر گوش بدی و بعد سؤال بپرسی.","لحن آرام، پیام روشن و زبان بدن هماهنگ رو فراموش نکن.","بازخورد درباره رفتار قابل تغییره، نه قضاوت درباره شخصیت.","حالا یک گفت‌وگوی دشوار داریم؛ قاطع باش و احترام رو هم حفظ کن.","قبل از اینکه بگی دیگران همکاری نمی‌کنن، محدودیت‌های اون‌ها رو بپرس.","برای حفظ رابطه، قرار نیست به همه درخواست‌ها بله بگی.","وقتی مخاطب ناراضیه، قبل از دفاع، اثر مشکل رو بر اون بفهم.","رسیدیم به آخرین مرحله! توافق خوب توافقیه که اجراشدنی باشه."];return texts[step]||""}
function normalizeFivePointSelf(){
 if(state.rubricV2!==2||state.selfScaleV5===5||state.finished)return;
 for(const k of Object.keys(state.self||{})){
  const vals=state.self[k];
  if(Array.isArray(vals))state.self[k]=vals.map(v=>v===4?5:v===3?4:v);
 }
 state.selfScaleV5=5;save();
}
function pruneFutureStageData(){
 if(!state.startedAt||state.finished||state.mode!=="competitive"||state.rubricV2!==2)return;
 let changed=false;
 for(const key of ["answers","self","learned","evidence","alloc","orders"]){
  const records=state[key];
  if(!records||typeof records!=="object")continue;
  for(const index of Object.keys(records)){
   if(Number.isSafeInteger(Number(index))&&String(Number(index))===index&&Number(index)>state.stage){
    delete records[index];changed=true;
   }
  }
 }
 if(changed)save();
}
function render(){if(!state.startedAt&&!state.finished){state.s5gameVersion=1;state.soloVersion=1;state.rubricV2=2;save();}normalizeFivePointSelf();pruneFutureStageData();if(state.withdrawn){$("#root").innerHTML="";return;}if(state.mode==="study"){modes.renderStudy(state);return;}topClock();const root=$("#root");if(state.finished){renderEnd();return}if(!state.startedAt){renderIntro();return}renderStage()}

function permute4(){
 const values=[0,1,2,3];
 for(let i=values.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[values[i],values[j]]=[values[j],values[i]]}
 return values;
}
function ensureQuestionOrder(){
 state.orders=state.orders||{};
 if(!state.orders[state.stage]){state.orders[state.stage]={q1:permute4(),q2:permute4()};save()}
}

function allocView(){const incident=incidents.find(i=>i.stage===state.stage+1);if(!incident)return "";let done=state.alloc[state.stage],vals=transient.alloc,sum=vals.reduce((a,b)=>a+b,0);return '<section class="card alert"><div class="section-head">🚨 اتفاق تازه! تصمیم با منابع محدود</div><p>'+E(incident.incident)+'</p>'+(done?'<div class="locked">🔒 تصمیم تخصیص شش سکه ثبت شد. امتیاز این فعالیت در خلاصه همین مرحله نمایش داده می‌شود.</div>':'<p>شش سکه در اختیار داری. دقیقاً شش سکه و دست‌کم به دو اقدام اختصاص بده. هیچ اقدام نمی‌تواند بیش از سه سکه بگیرد.</p><div class="coinmeter"><div class="coinfill" style="width:'+Math.min(100,sum/6*100)+'%"></div></div><p class="coin"><strong>'+fa(sum)+' از ۶</strong> سکه</p>'+incident.items.map((item,i)=>'<label class="coinslider"><span>'+E(item)+'</span><input data-coin="'+i+'" type="range" min="0" max="3" step="1" value="'+vals[i]+'"><b>'+fa(vals[i])+'</b></label>').join('')+'<button class="btn gold" id="savealloc" '+(sum!==6||vals.filter(x=>x>0).length<2?"disabled":"")+'>🔒 ثبت قطعی تخصیص منابع</button>')+'</section>'}

function grade(){
 if(state.rubricV2===2)return window.BP_SAFAR_RUBRIC.total(state);
 let quiz=0,roles=0,selfPoints=0,resources=0,feedback=0,breakdown=[];
 stages.forEach((st,i)=>{
  const a=state.answers[i]||{};let q=0;
  if(a.q1===st.c1)q+=4+(state.soloVersion&&[2,7].includes(i)?2:0);
  if(a.q2?.best===st.best)q+=2;
  if(a.q2?.worst===st.worst)q+=2;
  quiz+=q;
  roles+=!state.soloVersion&&!state.s5gameVersion&&state.rp?.[i]?0.5:0;
  const self=state.self?.[i]||[];
  selfPoints+=self.length===3&&self.every(n=>Number.isInteger(n)&&n>=1&&n<=4)?(state.s5gameVersion?1:0.5):0;
  feedback+=!state.soloVersion&&state.peer?.[i]&&[2,7].includes(i)?2:0;
  const inc=incidents.find(x=>x.stage===i+1),alloc=state.alloc?.[i];
  if(inc&&Array.isArray(alloc)){
   const delta=alloc.reduce((n,v,j)=>n+Math.abs(v-inc.ideal[j]),0);
   resources+=delta===0?2:delta<=2?1:0;
  }
  breakdown.push({name:st.title,score:q});
 });
 const rawTotal=quiz+roles+selfPoints+resources+feedback,timePenalty=overtime.penalty(state),guidePenalty=hintCoach.penalty(state),totalPenalty=timePenalty+guidePenalty;return {quiz,roles,selfPoints,resources,feedback,rawTotal,timePenalty,guidePenalty,totalPenalty,total:Math.max(0,rawTotal-totalPenalty),breakdown};
}
